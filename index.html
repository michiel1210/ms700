D.tabs.push({
n:3, key:'collab', icon:'chat', short:'Chat, teams, apps & meetings',
title:'Manage chat, collaboration, apps, teams, channels and meetings',
maps:['Domain 2 · 20–25% (teams, channels, chats, apps)','Domain 3 · 15–20% (meetings & events)','Copilot meeting settings'],
intro:'Everything users touch every day: creating and managing teams and templates, channel types and policies, messaging, apps and extensibility, and the meeting and event experiences — including Copilot, webinars and town halls.',
sections:[
{id:'guide', h:'Detailed study guide', html:`
<h3>1. Creating teams</h3>
<ul>
<li><b>Ways to create</b>: Teams client, TAC (Teams › Manage teams › Add), PowerShell <code>New-Team</code>, Microsoft Graph <code>POST /teams</code>.</li>
<li><b>From an existing source</b>: an existing Microsoft 365 group (<code>New-Team -GroupId</code> / <code>PUT /groups/{id}/team</code>); a group-connected SharePoint site (“Add real-time chat” / Create a team); another team (copies channels, tabs, apps, settings and optionally members — not content; Graph <code>POST /teams/{id}/clone</code>); a template.</li>
<li><b>Privacy</b>: Private (owners add members), Public (anyone can join), Org-wide (Global admins only; all users; ≤ 10,000 users; max 5).</li>
<li><b>Roles</b>: owners (max 100), members, guests; team up to 25,000 members.</li>
<li><b>Planning a rollout</b>: Teams Advisor (Planning › Teams Advisor).</li>
</ul>
<h3>2. Templates</h3>
<ul>
<li>TAC › Teams › Team templates: Microsoft templates (e.g., Manage a project, Manage an event, Onboard employees, Organize help desk, Coordinate incident response, Organize a store, Hospital…) or custom templates created from scratch or from an existing team.</li>
<li>A template defines <b>channels, tabs and apps</b> — not members, files or messages.</li>
<li><b>Template policies</b> (TAC › Teams › Template policies) hide or show templates for specific users/groups.</li>
</ul>
<h3>3. Team settings and Teams settings</h3>
<ul>
<li><b>Per team</b> (TAC › Manage teams or the client): member permissions (create/update channels, add apps, delete messages), guest permissions, @mentions, fun stuff, privacy, sensitivity label.</li>
<li><b>Org-wide Teams settings</b> (TAC › Teams › Teams settings): email into channel (and accepted domains), third-party cloud storage (Box, Dropbox, Google Drive, Citrix ShareFile, Egnyte), tagging (who can manage tags), organization tab, scoped directory search, devices, safety and communications.</li>
<li><b>Sensitivity labels</b> for containers set privacy, guest access, external sharing and unmanaged-device access for the whole team.</li>
</ul>
<h3>4. Frontline experiences</h3>
<ul>
<li><b>Deploy frontline dynamic teams at scale</b> (TAC › Frontline deployment › Manage frontline teams): one team per location based on an Entra attribute (e.g., department or location), with <b>dynamic membership</b> that updates as people move.</li>
<li>Frontline apps: Shifts, Walkie Talkie, Approvals, Tasks (task publishing), Updates; pin them with an app setup policy or the Frontline worker policy package.</li>
<li>Licenses: Microsoft 365 F1/F3 (F-SKUs include Entra ID P1 for dynamic groups).</li>
</ul>
<h3>5. Channels</h3>
<div class="tblwrap"><table class="tbl"><thead><tr><th></th><th>Standard</th><th>Private</th><th>Shared</th></tr></thead><tbody>
<tr><td>Who sees it</td><td>All team members</td><td>Only channel members (subset of team)</td><td>Channel members, including people from other teams or organizations</td></tr>
<tr><td>Storage</td><td>Team SharePoint site (folder)</td><td>Own SharePoint site</td><td>Own SharePoint site</td></tr>
<tr><td>Guests</td><td>Yes (team guests)</td><td>Yes, if guest is a team member</td><td>No guests — external users join via B2B direct connect</td></tr>
<tr><td>Limits</td><td>1,000 channels per team (includes deleted)</td><td>Now up to the 1,000-channel limit; 5,000 members per channel; meetings supported <span class="nfe">NEW FOR EXAM</span></td><td>Up to 5,000 direct members and shared with up to 50 teams</td></tr>
<tr><td>Who creates (policy)</td><td>Team member permissions</td><td>Teams policy “Create private channels”</td><td>Teams policy “Create shared channels”</td></tr>
</tbody></table></div>
<ul>
<li>Channel owners manage private/shared channel membership; team owners can see private channel names and delete them but don't automatically get access to content.</li>
<li><b>Teams policies</b> (TAC › Teams › Teams policies / <code>CsTeamsChannelsPolicy</code>): <i>Create private channels</i>, <i>Create shared channels</i>, <i>Invite external users to shared channels</i>, <i>Join external shared channels</i>.</li>
<li>Channel moderation (standard channels): restrict who can start posts; allow bots/connectors.</li>
</ul>
<h3>6. Messaging policies</h3>
<p>TAC › Messaging › Messaging policies (<code>CsTeamsMessagingPolicy</code>): owners can delete sent messages; users can edit/delete sent messages; chat on/off; read receipts (user controlled / on for everyone / off); Giphy and content rating; memes; stickers; URL previews; translation; immersive reader; priority (urgent) notifications; voice messages (chats and channels / chats only / disabled); suggested replies; users can report security concerns. Messaging settings also include <b>messaging safety</b> (malicious URL scanning, weaponizable file-type blocking) <span class="nfe">NEW FOR EXAM</span>.</p>
<h3>7. Apps</h3>
<ul>
<li><b>App centric management (ACM)</b> replaced app permission policies (migration completed in 2025). Each app has <b>availability</b>: Everyone, Specific users or groups, or No one; plus a status (allowed/blocked). <b>Org-wide app settings</b> set defaults for new Microsoft, third-party and custom apps. Apps can be <b>blocked by publisher</b> until the admin completes setup. A simplified <b>Manage access</b> experience for apps and agents rolled out in late 2026 <span class="nfe">NEW FOR EXAM</span>.</li>
<li><b>App setup policies</b>: pin apps to the app bar, install apps on users' behalf, allow user pinning, and <b>Upload custom apps</b> (sideloading). Custom app upload also requires the org-wide custom app setting.</li>
<li><b>Permissions & consent</b>: review Graph permissions in the app's Permissions tab and grant admin consent; resource-specific consent (RSC) lets team/chat owners consent for their own resource; Entra user consent settings apply.</li>
<li><b>Extensibility</b>: tabs (web content), bots (conversational), message extensions (search/action in compose), meeting extensions (side panel, stage), <b>Workflows</b> (Power Automate templates) — Office 365 connectors were retired in May 2026 and replaced by Workflows webhooks <span class="nfe">NEW FOR EXAM</span> — Power Apps, and Copilot agents.</li>
<li><b>Custom apps</b>: package (manifest.json + color 192×192 and outline 32×32 icons) uploaded in TAC › Manage apps › Upload new app (org catalog, “Built for your org”), or submitted by users for admin approval.</li>
<li><b>Purchasing</b>: buy SaaS licenses for third-party apps in TAC (Manage apps › app › Purchase). <b>Customize store</b>: logo, logomark, background and text color.</li>
</ul>
<h3>8. Meetings and events</h3>
<div class="tblwrap"><table class="tbl"><thead><tr><th>Type</th><th>Use when</th><th>Key facts</th></tr></thead><tbody>
<tr><td>Meeting</td><td>Interactive collaboration</td><td>Up to 1,000 interactive participants; breakout rooms; lobby; co-organizers</td></tr>
<tr><td>Webinar</td><td>Structured events with registration</td><td>Registration page, approval, waitlist, registration windows, custom emails, RTMP-In; attendee engagement up to 1,000 with mic/camera</td></tr>
<tr><td>Town hall</td><td>One-to-many broadcasts (replaces Live Events)</td><td>Teams Enterprise: up to 3,000 attendees with engagement (Q&amp;A, chat, polls, reactions) and 10,000 view-only; up to 100,000 with an Attendee Capacity Pack; Microsoft eCDN, 1080p, ultra-low latency, town hall insights <span class="nfe">NEW FOR EXAM</span></td></tr>
<tr><td>Virtual appointment</td><td>Business-to-consumer appointments</td><td>Bookings/Virtual Appointments app; advanced features (SMS, queue, analytics) with Teams Premium</td></tr>
<tr><td>Immersive event</td><td>3D avatar-based events</td><td>Replaced Microsoft Mesh (retired Dec 1, 2025); controlled by the events policy</td></tr>
</tbody></table></div>
<p><b>Teams Live Events</b>: no new scheduling after June 30, 2026; events scheduled before then run until February 28, 2027. Use town halls.</p>
<h4>Meeting policies (TAC › Meetings › Meeting policies)</h4>
<ul>
<li><b>Scheduling</b>: private meeting scheduling, channel meeting scheduling, Outlook add-in, Meet now.</li>
<li><b>Join &amp; lobby</b>: <i>Who can bypass the lobby</i> (Only organizers and co-organizers / People who were invited / People in my org / People in my org and guests / People in my org, trusted orgs, and guests / Everyone), dial-in users bypass lobby, <i>Anonymous users can join a meeting</i> (per organizer; the org-wide setting must also allow it), anonymous users and dial-in callers can start a meeting, who can admit from lobby.</li>
<li><b>Content sharing</b>: who can present, screen sharing mode, external participants can give/request control, PowerPoint Live, Whiteboard.</li>
<li><b>Recording &amp; transcription</b>: meeting recording, <i>recordings automatically expire</i> + default expiration (120 days by default), store recordings outside your region, transcription, live captions, <b>Copilot</b>.</li>
<li><b>Audio &amp; video</b>: IP audio/video modes, media bit rate, video filters, far-end camera control.</li>
<li><b>Engagement</b>: meeting chat, Q&amp;A, reactions, attendance report.</li>
<li><b>Teams Premium</b> settings: watermarks, end-to-end encryption (enhanced encryption policy), meeting sensitivity labels.</li>
</ul>
<h4>Meeting settings (org-wide)</h4>
<p>Anonymous join (org-wide), anonymous users can interact with apps, email invitation branding (logo, legal, help URLs, footer), network/QoS. <code>Set-CsTeamsMeetingConfiguration</code>.</p>
<h4>Templates and customization</h4>
<ul>
<li><b>Meeting templates</b> (Teams Premium for custom templates) pre-set and optionally <b>lock</b> meeting options; <b>meeting template policies</b> hide/show templates.</li>
<li><b>Customization policies</b> (Teams Premium): meeting themes and branded backgrounds/lobby.</li>
</ul>
<h4>Events policies</h4>
<p>TAC › Meetings › Events policies (<code>CsTeamsEventsPolicy</code>): allow webinars, allow town halls, who can register (everyone or people in the org), email customization, recording/transcription for town halls, immersive events, town hall max resolution (1080p).</p>
<h4>Copilot in meetings</h4>
<div class="tblwrap"><table class="tbl"><thead><tr><th>TAC value</th><th>PowerShell (<code>-Copilot</code>)</th><th>Behavior</th></tr></thead><tbody>
<tr><td>On</td><td>Enabled</td><td>Organizer default <i>Only during the meeting</i> (temporary transcript); organizer can change to During and after the meeting</td></tr>
<tr><td>On with saved transcript required</td><td>EnabledWithTranscript</td><td>Copilot works only with a saved (retained) transcript — the only <b>enforceable</b> Copilot policy value</td></tr>
<tr><td>On with transcript saved by default</td><td>EnabledWithTranscriptDefaultOn</td><td>Default <i>During and after the meeting</i>; organizer can change it</td></tr>
<tr><td>Off</td><td>Disabled</td><td>Default Off — organizers can still change it per meeting</td></tr>
</tbody></table></div>
<p>Copilot requires a Microsoft 365 Copilot license per user; transcription must be allowed for post-meeting Copilot. In late 2025 Microsoft made “Copilot without transcription” the default behavior for many tenants <span class="nfe">NEW FOR EXAM</span>.</p>`},
{id:'concepts', h:'Important concepts', html:`
<dl class="kv">
<dt>App centric management</dt><dd>Per-app availability (everyone / specific users or groups / no one) replacing permission policies.</dd>
<dt>App setup policy</dt><dd>Pinning, auto-install, user pinning and custom app upload.</dd>
<dt>Template policy</dt><dd>Controls which team templates users see.</dd>
<dt>Teams policy</dt><dd>CsTeamsChannelsPolicy — private/shared channel creation and sharing.</dd>
<dt>Lobby</dt><dd>Waiting area governed by <i>Who can bypass the lobby</i>.</dd>
<dt>Co-organizer</dt><dd>Gets most organizer capabilities (up to 10 per meeting).</dd>
<dt>Town hall</dt><dd>Broadcast event replacing Live Events; Q&amp;A, eCDN, producer controls.</dd>
<dt>Attendee Capacity Pack</dt><dd>Add-on enabling town halls up to 100,000 attendees.</dd>
<dt>Recording expiration</dt><dd>Automatic deletion of new recordings after N days (default 120).</dd>
<dt>Workflows</dt><dd>Power Automate-based replacement for Office 365 connectors.</dd>
</dl>`},
{id:'resp', h:'Administrator responsibilities', html:`
<ul>
<li>Publish team templates and template policies that match business processes.</li>
<li>Decide who can create private and shared channels; manage membership escalations.</li>
<li>Set messaging behavior for different personas (e.g., stricter for frontline or students).</li>
<li>Govern apps: availability, blocking risky apps, custom app approval, consent, setup policies.</li>
<li>Design meeting policies per persona (executives, external-facing staff, standard users) and org-wide meeting settings.</li>
<li>Enable and govern webinars, town halls and immersive events; plan eCDN for large audiences.</li>
<li>Configure Copilot meeting behavior with compliance and works council requirements.</li>
</ul>`},
{id:'paths', h:'Teams admin center paths & PowerShell', html:`
<pre><code># Teams and channels
New-Team -DisplayName "Contoso Launch" -Visibility Private -Owner owner@contoso.com
New-Team -GroupId $existingGroupId
New-TeamChannel -GroupId $gid -DisplayName "Finance" -MembershipType Private -Owner fin@contoso.com
Set-CsTeamsChannelsPolicy -Identity Global -AllowPrivateChannelCreation $false

# Messaging and apps
New-CsTeamsMessagingPolicy -Identity "Students" -AllowUserDeleteMessage $false -AllowGiphy $false
New-CsTeamsAppSetupPolicy -Identity "Frontline" -AllowUserPinning $false -AllowSideLoading $false
Grant-CsTeamsAppSetupPolicy -Group "frontline@contoso.com" -PolicyName "Frontline" -Rank 1

# Meetings and events
Set-CsTeamsMeetingPolicy -Identity "Exec" -AutoAdmittedUsers OrganizerOnly -AllowCloudRecording $true -NewMeetingRecordingExpirationDays 60
Set-CsTeamsMeetingPolicy -Identity "CopilotUsers" -Copilot EnabledWithTranscript -AllowTranscription $true
Set-CsTeamsMeetingConfiguration -DisableAnonymousJoin $true
Set-CsTeamsEventsPolicy -Identity Global -AllowWebinars Enabled -AllowTownhalls Enabled -EventAccessType Everyone</code></pre>
<p>TAC: Teams › Manage teams / Team templates / Template policies / Teams policies · Messaging › Messaging policies · Teams apps › Manage apps / Setup policies / Customize store · Meetings › Meeting policies / Meeting settings / Meeting templates / Customization policies / Events policies · Frontline deployment.</p>`},
{id:'scen', h:'Real-world scenarios', html:`
<div class="scen"><h4>Project template</h4><p>Every project team needs Planning, Budget and Risks channels with a Planner tab.</p><div class="sol"><b>Solution:</b> Custom team template; use a template policy to show it only to PMO staff.</div></div>
<div class="scen"><h4>Confidential board channel</h4><div class="sol"><b>Solution:</b> Private channel inside the leadership team; allow private channel creation only for leadership via a Teams policy.</div></div>
<div class="scen"><h4>Store staff apps</h4><div class="sol"><b>Solution:</b> App setup policy pinning Shifts and Walkie Talkie with user pinning disabled, assigned to the frontline group (or the Frontline worker policy package).</div></div>
<div class="scen"><h4>Risky third-party app</h4><div class="sol"><b>Solution:</b> Block the app in Manage apps (or set availability to No one); review permissions before any future allow.</div></div>
<div class="scen"><h4>Customer webinars</h4><div class="sol"><b>Solution:</b> Events policy allowing webinars with registration for Everyone; anonymous join allowed; custom registration and email branding (now in Teams Enterprise).</div></div>`},
{id:'bp', h:'Best practices', html:`
<ul>
<li>Use templates for repeatable work; keep channel counts small and purposeful.</li>
<li>Prefer shared channels over guest accounts for cross-org project work when both orgs use Teams.</li>
<li>Default third-party app availability conservatively; whitelist via ACM.</li>
<li>Use separate meeting policies for sensitive roles (lobby, presenters, recording) and Premium templates/labels for sensitive meetings.</li>
<li>Set a recording expiration that matches your retention schedule; extend specific recordings when needed.</li>
<li>Migrate any remaining live events and connector integrations to town halls and Workflows.</li>
</ul>`},
{id:'tips', h:'Exam tips', html:`
<ul>
<li>Templates include channels, tabs, apps — never content or members.</li>
<li>Org-wide teams: Global admin only, 5 per tenant, ≤ 10,000 users.</li>
<li>“Prevent users from creating private channels” → Teams policy, not team settings.</li>
<li>Custom app upload needs <b>both</b> the org-wide custom apps setting and the setup policy.</li>
<li>Anonymous join needs <b>both</b> the org-wide setting and the organizer's meeting policy.</li>
<li>Only <i>On with saved transcript required</i> enforces Copilot behavior.</li>
<li>Live events → town halls; connectors → Workflows; permission policies → ACM.</li>
</ul>`},
{id:'mistakes', h:'Common mistakes', html:`
<ul>
<li>Assuming team owners can read private channel content.</li>
<li>Thinking guests can be added to shared channels (they use B2B direct connect instead).</li>
<li>Expecting a meeting policy “Off” for Copilot to block organizers from enabling Copilot.</li>
<li>Choosing webinars for 5,000-person broadcasts (town halls are designed for that).</li>
<li>Forgetting that recording expiration applies to new recordings and can be changed by owners.</li>
</ul>`},
{id:'asks', h:'Things Microsoft likes to ask on the exam', html:`
<ul class="asklist">
<li>Which channel type fits a requirement (subset of members, external partners, everyone).</li>
<li>How to create a team from a group, a site, another team or a template (client/PowerShell/Graph).</li>
<li>How to hide a template, pin an app, block an app, allow custom upload.</li>
<li>Meeting vs webinar vs town hall vs virtual appointment.</li>
<li>Lobby, presenter, anonymous join and recording expiration settings.</li>
<li>Copilot policy values and their effect.</li>
<li>Which features require Teams Premium after April 2026.</li>
</ul>`},

n:4, key:'phone', icon:'phone', short:'Teams Phone & voice',
title:'Manage Teams Phone and voice solutions',
maps:['Domain 3 · 15–20%','Manage phone numbers and services for Teams Phone','Auto attendants & call queues','Licensing for Teams Phone and resource accounts (Domain 1)'],
intro:'Teams Phone turns Teams into a cloud PBX. You need to choose PSTN connectivity, manage numbers for users and services, apply voice policies, and build auto attendants and call queues — plus understand 2026 additions such as the Queues app enhancements and Teams Phone Agent.',
sections:[
{id:'guide', h:'Detailed study guide', html:`
<h3>1. Building blocks</h3>
<ul>
<li><b>Teams Phone</b> (formerly Phone System) — the PBX capability: call control, transfer, hold, voicemail, call queues, auto attendants. License: <i>Teams Phone Standard</i> add-on, or included in Microsoft 365/Office 365 E5.</li>
<li><b>PSTN connectivity</b> — how calls reach the phone network:
<div class="tblwrap"><table class="tbl"><thead><tr><th>Option</th><th>Who provides numbers &amp; trunks</th><th>Fits when</th></tr></thead><tbody>
<tr><td>Calling Plans</td><td>Microsoft is the carrier (Domestic, Domestic &amp; International, Pay-as-you-go)</td><td>Supported country, no telephony infrastructure, simplest option</td></tr>
<tr><td>Operator Connect</td><td>A participating operator manages SBCs and numbers; you connect in TAC › Voice › Operators</td><td>Keep a preferred carrier without managing SBCs</td></tr>
<tr><td>Teams Phone Mobile</td><td>Mobile operator; the SIM number is the Teams number</td><td>Mobile-first users</td></tr>
<tr><td>Direct Routing</td><td>You (or a partner) run certified SBCs connected to Microsoft</td><td>Existing carrier contracts, unsupported countries, on-prem PBX interop, survivability (SBA)</td></tr>
</tbody></table></div></li>
<li><b>Audio Conferencing</b> — dial-in/dial-out for meetings (included free with many subscriptions as “Audio Conferencing with dial-out to USA/CAN”; full in E5). Conference bridges hold default toll/toll-free service numbers; <b>communication credits</b> fund toll-free and pay-per-minute usage.</li>
<li><b>Shared calling</b> — users with Teams Phone share a resource account's number and calling plan for outbound and inbound calls (via an auto attendant), configured with a shared calling routing policy.</li>
</ul>
<h3>2. Phone numbers</h3>
<ul>
<li>Number types: <b>user (subscriber)</b> numbers and <b>service</b> numbers (toll/toll-free) for auto attendants, call queues and conference bridges — service numbers handle more concurrent calls.</li>
<li>Get numbers by acquiring new ones (Calling Plans), <b>porting</b> existing numbers (port order wizard), from your operator (Operator Connect), or configuring your own (Direct Routing).</li>
<li>Assign, change or remove: TAC (Voice › Phone numbers or Users › user › Phone number) or PowerShell:
<pre><code>Set-CsPhoneNumberAssignment -Identity user@contoso.com -PhoneNumber "+31201234567" -PhoneNumberType OperatorConnect -LocationId $loc
Set-CsPhoneNumberAssignment -Identity user@contoso.com -PhoneNumber "+14255550100" -PhoneNumberType DirectRouting
Remove-CsPhoneNumberAssignment -Identity user@contoso.com -PhoneNumber "+14255550100" -PhoneNumberType DirectRouting
Get-CsPhoneNumberAssignment -AssignedPstnTargetId user@contoso.com</code></pre></li>
<li>Calling Plan and Operator Connect numbers require an <b>emergency address (location)</b> where required by regulation (e.g., a validated address in the US).</li>
</ul>
<h3>3. Voice policies and settings for users</h3>
<div class="tblwrap"><table class="tbl"><thead><tr><th>Policy</th><th>Controls</th></tr></thead><tbody>
<tr><td>Calling policy (<code>CsTeamsCallingPolicy</code>)</td><td>Private calls, call forwarding/simultaneous ring (internal/external), voicemail availability, busy on busy, delegation, call groups, cloud recording and transcription for calls, Copilot in calls, music on hold, prevent toll bypass, web PSTN calling</td></tr>
<tr><td>Caller ID policy (<code>CsCallingLineIdentity</code>)</td><td>Replace outbound caller ID with a service/resource account number or anonymous; block incoming caller ID; allow user override</td></tr>
<tr><td>Dial plan (<code>CsTenantDialPlan</code>)</td><td>Normalization rules that translate dialed strings (e.g., 4-digit extensions) into E.164</td></tr>
<tr><td>Voice routing policy (Direct Routing)</td><td>Links users to PSTN usages → voice routes → SBC gateways</td></tr>
<tr><td>Voicemail policy (<code>CsOnlineVoicemailPolicy</code>)</td><td>Transcription, profanity masking, max recording length, editing call answer rules, prompt languages</td></tr>
<tr><td>Call park policy</td><td>Enable park/retrieve, pickup code range, timeout</td></tr>
<tr><td>Emergency calling policy</td><td>Security desk notification group and mode (notification only, conferenced muted/unmuted), external location lookup for remote workers</td></tr>
<tr><td>Emergency call routing policy (Direct Routing)</td><td>Emergency numbers and PSTN usages for SBC routing</td></tr>
<tr><td>Voice applications policy</td><td>What authorized users may change on auto attendants/call queues (greetings, routing, holidays)</td></tr>
<tr><td>IP phone policy</td><td>Sign-in mode (user, common area phone, meeting) and hot-desking for Teams phones</td></tr>
</tbody></table></div>
<p><b>Voicemail</b> is Cloud Voicemail stored in the user's Exchange Online mailbox; users manage greetings and call answer rules in Teams. Shared voicemail for AA/CQ goes to a Microsoft 365 group mailbox (enable “Let people outside the organization email this team”).</p>
<h3>4. Emergency calling</h3>
<ul>
<li><b>Emergency addresses</b> (TAC › Locations › Emergency addresses) with places (floor/room) are assigned to numbers (static) or detected dynamically.</li>
<li><b>Dynamic emergency calling</b> uses the network topology (trusted IPs + subnets, Wi-Fi BSSIDs, switches/ports) in the Location Information Service so the client reports its current location; required by US laws such as Kari's Law and RAY BAUM'S Act.</li>
<li>Emergency calling policies notify a security desk group when an emergency number is dialed.</li>
</ul>
<h3>5. Direct Routing essentials</h3>
<pre><code>New-CsOnlinePSTNGateway -Fqdn sbc1.contoso.com -SipSignalingPort 5067 -Enabled $true -MaxConcurrentSessions 100
Set-CsOnlinePstnUsage -Identity Global -Usage @{Add="US-Canada"}
New-CsOnlineVoiceRoute -Identity "US-Canada" -NumberPattern "^\\+1(\\d{10})$" -OnlinePstnGatewayList sbc1.contoso.com -Priority 1 -OnlinePstnUsages "US-Canada"
New-CsOnlineVoiceRoutingPolicy -Identity "US Only" -OnlinePstnUsages "US-Canada"
Grant-CsOnlineVoiceRoutingPolicy -Identity user@contoso.com -PolicyName "US Only"</code></pre>
<p>The SBC FQDN's domain must be a verified domain in the tenant; the SBC needs a public CA certificate. Location-Based Routing addresses toll-bypass rules in some countries.</p>
<h3>6. Auto attendants and call queues</h3>
<ul>
<li><b>Resource accounts</b> (TAC › Voice › Resource accounts or <code>New-CsOnlineApplicationInstance</code>) represent each AA/CQ. Assign the free <b>Teams Phone Resource Account</b> license (required when the account has a phone number) and a service number for external callers. Associate with <code>New-CsOnlineApplicationInstanceAssociation</code> or in the AA/CQ wizard. A tenant needs at least one Teams Phone license to use AA/CQ.</li>
<li><b>Auto attendant</b>: greeting (text-to-speech or audio), menu options (0–9, *, #), dial by name/extension with dial scope, operator, <b>business hours, after hours and holidays</b> call flows, language/time zone, voice inputs. Use AAs in front of queues because <b>call queues have no after-hours or holiday routing</b>.</li>
<li><b>Call queue</b>: agents from users, groups, distribution lists or a <b>Teams channel</b> (collaborative calling); <b>conference mode</b> (faster connect, recommended); <b>routing methods</b> — <i>Attendant</i> (all agents ring at once), <i>Serial</i> (in list order), <i>Round robin</i> (balanced), <i>Longest idle</i> (agent idle the longest, uses presence); <b>presence-based routing</b>; agent opt-out; alert time; <b>overflow</b> (maximum calls in queue) and <b>timeout</b> (maximum wait) with actions: disconnect, redirect to person/AA/CQ/external number, or shared voicemail. Newer: call priorities, automatic recording and compliance recording configuration in TAC (2026) <span class="nfe">NEW FOR EXAM</span>.</li>
<li><b>Authorized users</b>: delegate greeting, routing, holiday changes and reporting to business users via a <b>voice applications policy</b> plus adding them as authorized users on the AA/CQ — no admin role needed.</li>
<li><b>Queues app</b> (Teams Premium + Teams Phone): agents and leads manage queues, real-time/historical metrics, shared call history and voicemail — extended in 2026 to auto attendant shared voicemail and Copilot call recap <span class="nfe">NEW FOR EXAM</span>.</li>
<li><b>Teams Phone Agent</b>: an AI receptionist built on auto attendants (natural-language Q&amp;A, appointments, routing). GA from late September 2026 with usage-based billing through Copilot Credits; if spending isn't configured the line falls back to the auto attendant settings <span class="nfe">NEW FOR EXAM</span>.</li>
</ul>`},
{id:'concepts', h:'Important concepts', html:`
<dl class="kv">
<dt>E.164</dt><dd>International number format (+countrycode…) used throughout Teams Phone.</dd>
<dt>Service number</dt><dd>High-capacity toll/toll-free number for AA, CQ or conference bridges.</dd>
<dt>Resource account</dt><dd>Disabled Entra user object representing an AA/CQ; license: Teams Phone Resource Account.</dd>
<dt>Conference mode</dt><dd>Call queue setting that reduces time to connect an agent.</dd>
<dt>Presence-based routing</dt><dd>Only agents whose presence is Available are offered calls.</dd>
<dt>Overflow / timeout</dt><dd>Queue thresholds for too many waiting calls / waiting too long.</dd>
<dt>Normalization rule</dt><dd>Regex translation inside a dial plan.</dd>
<dt>PSTN usage</dt><dd>Label linking voice routing policies to voice routes (Direct Routing).</dd>
<dt>LIS</dt><dd>Location Information Service — maps network identifiers to emergency locations.</dd>
<dt>Communication credits</dt><dd>Prepaid funds for toll-free numbers and pay-as-you-go calling.</dd>
</dl>`},
{id:'resp', h:'Administrator responsibilities', html:`
<ul>
<li>Choose PSTN connectivity per country and acquire/port numbers.</li>
<li>Assign numbers and emergency locations; maintain network topology for dynamic emergency calling.</li>
<li>Create and assign calling, caller ID, dial plan, voicemail, emergency and voice routing policies.</li>
<li>Build AA/CQ call flows with holidays, overflow/timeout handling and shared voicemail.</li>
<li>Delegate day-to-day changes to authorized users; license Queues app users where needed.</li>
<li>Monitor PSTN usage reports, Direct Routing health and call quality.</li>
</ul>`},
{id:'paths', h:'Teams admin center paths & PowerShell', html:`
<div class="tblwrap"><table class="tbl"><thead><tr><th>Task</th><th>Where / how</th></tr></thead><tbody>
<tr><td>Acquire/port/assign numbers</td><td>TAC › Voice › Phone numbers</td></tr>
<tr><td>Operators</td><td>TAC › Voice › Operators</td></tr>
<tr><td>SBCs</td><td>TAC › Voice › Direct Routing</td></tr>
<tr><td>Policies</td><td>TAC › Voice › Calling / Caller ID / Call park / Dial plans / Emergency / Voice routing / Voicemail / Voice applications policies</td></tr>
<tr><td>Resource accounts</td><td>TAC › Voice › Resource accounts; <code>New-CsOnlineApplicationInstance -UserPrincipalName cq-sales@contoso.com -ApplicationId "11cd3e2e-fccb-42ad-ad00-878b93575e07" -DisplayName "Sales Queue"</code> (AA ApplicationId <code>ce933385-9390-45d1-9512-c8d228074e07</code>)</td></tr>
<tr><td>Call queue</td><td><code>New-CsCallQueue -Name "Sales" -RoutingMethod LongestIdle -ConferenceMode $true -PresenceBasedRouting $true -OverflowThreshold 50 -TimeoutThreshold 1200</code></td></tr>
<tr><td>Caller ID</td><td><code>New-CsCallingLineIdentity -Identity "MainNumber" -CallingIDSubstitute Resource -ResourceAccount $raObjectId -EnableUserOverride $false</code></td></tr>
<tr><td>Voicemail</td><td><code>Set-CsOnlineVoicemailPolicy -Identity Global -EnableTranscription $true -MaximumRecordingLength 00:05:00</code></td></tr>
<tr><td>Emergency</td><td>TAC › Locations › Emergency addresses / Network topology; <code>New-CsTeamsEmergencyCallingPolicy -Identity HQ -NotificationGroup "secdesk@contoso.com" -NotificationMode ConferenceMuted</code></td></tr>
<tr><td>Conference bridge</td><td>TAC › Meetings › Conference bridges; <code>Set-CsOnlineDialInConferencingBridge -DefaultServiceNumber +31...</code></td></tr>
</tbody></table></div>`},
{id:'scen', h:'Real-world scenarios', html:`
<div class="scen"><h4>Main number with menus and holidays</h4><div class="sol"><b>Solution:</b> Auto attendant with business/after-hours/holiday call flows on a service number; menu option 1 → Sales call queue, 2 → Support call queue; queues use conference mode and presence-based routing.</div></div>
<div class="scen"><h4>Sales managers change greetings</h4><div class="sol"><b>Solution:</b> Voice applications policy allowing greeting and holiday edits, assigned to managers, who are added as authorized users on the queue.</div></div>
<div class="scen"><h4>Outbound calls must show the HQ number</h4><div class="sol"><b>Solution:</b> Caller ID policy substituting the resource account's number; assign to users.</div></div>
<div class="scen"><h4>Country without Calling Plans</h4><div class="sol"><b>Solution:</b> Operator Connect if a participating operator exists; otherwise Direct Routing with a certified SBC.</div></div>`},
{id:'bp', h:'Best practices', html:`
<ul>
<li>Use service numbers for AA/CQ and put an AA in front of every queue to handle after hours/holidays.</li>
<li>Prefer longest idle or round robin with presence-based routing for fair distribution; enable conference mode.</li>
<li>Configure overflow and timeout actions — never leave callers in an endless queue.</li>
<li>Keep emergency addresses and network topology current; test emergency notifications (933 in the US).</li>
<li>Delegate operational changes via authorized users instead of giving admin roles.</li>
</ul>`},
{id:'tips', h:'Exam tips', html:`
<ul>
<li><code>Set-CsPhoneNumberAssignment</code> assigns numbers for all PSTN types (and resource accounts); <code>-PhoneNumberType</code> values: CallingPlan, OperatorConnect, DirectRouting, OCMobile.</li>
<li>Call queues: attendant = everyone rings; serial = in order; round robin = balanced; longest idle = presence-aware.</li>
<li>Call queues don't do business hours — AAs do.</li>
<li>Resource accounts need the free Teams Phone Resource Account license (with a number).</li>
<li>Voicemail lives in Exchange Online; shared voicemail uses a Microsoft 365 group.</li>
<li>Queues app needs Teams Premium + Teams Phone.</li>
</ul>`},
{id:'mistakes', h:'Common mistakes', html:`
<ul>
<li>Assigning a full Teams Phone user license to a resource account instead of the Resource Account license.</li>
<li>Assigning a user number type to an auto attendant.</li>
<li>Using serial routing when the requirement is “ring all available agents at once”.</li>
<li>Forgetting to allow external email to the Microsoft 365 group used for shared voicemail.</li>
<li>Mixing up caller ID policy (outbound display) with dial plans (number normalization).</li>
</ul>`},
{id:'asks', h:'Things Microsoft likes to ask on the exam', html:`
<ul class="asklist">
<li>Which PSTN option fits a scenario (country support, existing carrier, no SBC management).</li>
<li>The PowerShell to assign or remove a number.</li>
<li>Which queue routing method matches a requirement.</li>
<li>Overflow vs timeout handling and shared voicemail.</li>
<li>Steps (in order) to create an AA/CQ with a phone number.</li>
<li>How to delegate greeting changes (authorized users + voice applications policy).</li>
<li>Which policy replaces outbound caller ID, normalizes extensions or notifies a security desk.</li>
</ul>`},

n:5, key:'dev', icon:'device', short:'Devices & Teams Rooms',
title:'Manage devices and Teams Rooms',
maps:['Domain 1 · 40–45%','Manage Teams clients and devices','Licensing for Teams devices','Teams Rooms accounts, configuration profiles, firmware, tags, remote sign-in'],
intro:'Teams Rooms on Windows and Android, panels, phones, displays and Surface Hub: licensing, resource accounts, management in the Teams admin center and — since 2026 — the Teams Rooms Pro Management portal for all Teams devices.',
sections:[
{id:'guide', h:'Detailed study guide', html:`
<h3>1. Device families</h3>
<div class="tblwrap"><table class="tbl"><thead><tr><th>Device</th><th>Purpose</th><th>Typical license</th></tr></thead><tbody>
<tr><td>Teams Rooms on Windows (MTR-W)</td><td>Meeting room systems (Windows 11 IoT Enterprise)</td><td>Teams Rooms Basic or Pro</td></tr>
<tr><td>Teams Rooms on Android (MTR-A)</td><td>All-in-one video bars and room systems</td><td>Teams Rooms Basic or Pro</td></tr>
<tr><td>Surface Hub</td><td>Collaboration board running Teams Rooms</td><td>Teams Rooms Basic or Pro</td></tr>
<tr><td>Teams panels</td><td>Room scheduling displays outside rooms</td><td>Teams Rooms Pro (room scenario) or Teams Shared Devices — not Teams Rooms Basic</td></tr>
<tr><td>Teams phones (common area)</td><td>Lobby/break-room/warehouse phones</td><td>Teams Shared Devices</td></tr>
<tr><td>Teams phones/displays (personal)</td><td>User desk devices</td><td>User's own license</td></tr>
<tr><td>SIP gateway devices</td><td>Legacy SIP phones registered to Teams</td><td>User or Shared Devices license</td></tr>
</tbody></table></div>
<h3>2. Teams Rooms licensing</h3>
<ul>
<li><b>Teams Rooms Basic</b>: free, up to 25 rooms per tenant; core meeting experience (join, share, whiteboard, audio conferencing); basic inventory in the management portal.</li>
<li><b>Teams Rooms Pro</b> (~US$40/room/month): advanced AV (intelligent cameras/audio, dual screens, Front Row), Teams Phone and Audio Conferencing, Intune and Entra ID P1 rights, and full <b>Teams Rooms Pro Management</b> (monitoring, incident management, remote configuration, update rings, history).</li>
<li>Legacy Teams Rooms Standard/Premium are no longer sold. Shared/user licenses cannot be used to sign in room devices.</li>
<li>Since March 2026, the Pro Management portal enforces license boundaries for Android devices (Basic → inventory; Pro → advanced monitoring/management) <span class="nfe">NEW FOR EXAM</span>.</li>
</ul>
<h3>3. Resource accounts for rooms</h3>
<ol>
<li>Create an Exchange <b>room mailbox</b> with an enabled account:
<pre><code>New-Mailbox -MicrosoftOnlineServicesID mtr-boardroom@contoso.com -Name "Boardroom" -Alias mtr-boardroom -Room -EnableRoomMailboxAccount $true -RoomMailboxPassword (Read-Host -AsSecureString)
Set-CalendarProcessing -Identity mtr-boardroom -AutomateProcessing AutoAccept -AddOrganizerToSubject $false -DeleteComments $false -DeleteSubject $false -RemovePrivateProperty $false -ProcessExternalMeetingMessages $true</code></pre></li>
<li>Set the password not to expire (or use a managed rotation process), assign a usage location and a <b>Teams Rooms</b> license.</li>
<li>Exclude the account from per-user MFA prompts but protect it with <b>Conditional Access</b> (compliant device via Intune, trusted location) — rooms can't answer MFA prompts.</li>
<li>Optionally assign a phone number and calling policies so the room can make PSTN calls (Pro includes Teams Phone).</li>
</ol>
<h3>4. Managing devices</h3>
<ul>
<li><b>Teams Rooms Pro Management portal (PMP)</b> — <code>portal.rooms.microsoft.com</code>: inventory, health and incidents, update management, remote settings, role-based access (e.g., Teams Rooms Pro Manager, Site Lead, Site Technician). Access with Global, Teams Administrator or Teams Devices Administrator roles.</li>
<li><b>2026 transition</b> <span class="nfe">NEW FOR EXAM</span>: management of Teams Rooms on Android, Teams phones, Teams panels and SIP devices moved from the Teams admin center to PMP (GA in the public cloud July 2026); overlapping TAC capabilities (updates, settings, restart, sign-in/out, log collection, provisioning) were deprecated in TAC by September 2026. Teams Rooms on Windows was already managed in PMP. Basic-licensed devices get inventory and automatic updates; remote configuration and history need Pro. Exam items may still describe the TAC experience — know both.</li>
<li><b>Configuration profiles</b> (Android devices): device lock/PIN, language, time zone, date/time format, screen saver, display brightness, network (DHCP, proxy), logging, admin password. Created per device type and assigned to one or many devices; Intune doesn't provide configuration profiles for Teams Android devices.</li>
<li><b>Teams Rooms on Windows settings</b>: XML file (<code>SkypeSettings.xml</code>) or the PMP/TAC settings pane; Intune for compliance and Windows configuration.</li>
<li><b>Firmware/software updates</b>: automatic with deferral options (e.g., as soon as available / defer 30 or 90 days) or update rings in PMP; manual update for specific devices.</li>
<li><b>Device tags</b>: label devices (building, floor, pilot) to filter and run bulk actions (restart, update, assign configuration).</li>
<li><b>Remote provisioning and sign-in</b> (Android): add the device MAC address, generate a <b>verification code</b>, a technician enters it on the device, the device appears in <i>Waiting for sign in</i>, and the admin signs it in remotely with the resource account. Not available after a device is already signed in (factory reset needed).</li>
<li><b>Admin roles</b>: Teams Devices Administrator manages devices without broader Teams admin rights.</li>
</ul>
<h3>5. Common area phones and hot-desking</h3>
<ul>
<li>Create a resource/user account, assign <b>Teams Shared Devices</b>, a phone number (Calling Plan/Operator Connect/DR) and an <b>IP phone policy</b> with <code>-SignInMode CommonAreaPhoneSignIn</code>.</li>
<li>Hot-desking: allow users to sign in temporarily to a shared phone (<code>-AllowHotDesking</code> and timeout).</li>
<li>2026: Teams Shared Space licensing extends shared-device licensing to manage shared desks in Microsoft Places <span class="nfe">NEW FOR EXAM</span>.</li>
</ul>
<h3>6. Panels and room experience</h3>
<p>Panels show room availability, check-in, and auto-release; they sign in with the room's resource account. Use Places / room lists (Exchange) so rooms appear in the room finder.</p>`},
{id:'concepts', h:'Important concepts', html:`
<dl class="kv">
<dt>Room mailbox account</dt><dd>Exchange resource account used to sign in to Teams Rooms.</dd>
<dt>Pro Management portal</dt><dd>Unified device management for Teams Rooms, phones, panels and SIP devices.</dd>
<dt>Configuration profile</dt><dd>Reusable settings bundle for Android-based Teams devices.</dd>
<dt>Device tag</dt><dd>Label for grouping and bulk actions.</dd>
<dt>Remote provisioning</dt><dd>MAC + verification code + remote sign-in.</dd>
<dt>IP phone policy</dt><dd>Sign-in mode (user/CAP/meeting) and hot-desking.</dd>
<dt>SkypeSettings.xml</dt><dd>Configuration file for Teams Rooms on Windows.</dd>
<dt>Teams Shared Devices</dt><dd>License for shared phones/panels/hot-desk devices.</dd>
</dl>`},
{id:'resp', h:'Administrator responsibilities', html:`
<ul>
<li>Select certified hardware and the right Teams Rooms license per room.</li>
<li>Create and secure room resource accounts (calendar processing, CA, password policy).</li>
<li>Enroll devices into management, assign configuration profiles, tags and update policies.</li>
<li>Provision new devices remotely; maintain inventory and health; respond to incidents.</li>
<li>Configure common area phones, panels and hot-desking.</li>
<li>Track the TAC → PMP transition and update runbooks.</li>
</ul>`},
{id:'paths', h:'Admin portals & PowerShell', html:`
<div class="tblwrap"><table class="tbl"><thead><tr><th>Task</th><th>Where / how</th></tr></thead><tbody>
<tr><td>Manage all Teams devices</td><td>Teams Rooms Pro Management portal (portal.rooms.microsoft.com)</td></tr>
<tr><td>Legacy TAC experience</td><td>TAC › Teams devices › Teams Rooms on Windows / Teams Rooms on Android / Phones / Panels / Displays / SIP devices</td></tr>
<tr><td>Configuration profiles</td><td>(TAC) Teams devices › device type › Configuration profiles · (PMP) Settings</td></tr>
<tr><td>Provision new device</td><td>(TAC) Teams devices › Actions › Provision new device · (PMP) provisioning</td></tr>
<tr><td>Tags</td><td>Select devices › Manage tags</td></tr>
<tr><td>Room mailbox</td><td><code>New-Mailbox -Room -EnableRoomMailboxAccount $true</code>; <code>Set-CalendarProcessing -AutomateProcessing AutoAccept</code></td></tr>
<tr><td>Common area phone</td><td><code>New-CsTeamsIPPhonePolicy -Identity CAP -SignInMode CommonAreaPhoneSignIn</code>; <code>Grant-CsTeamsIPPhonePolicy</code></td></tr>
</tbody></table></div>`},
{id:'scen', h:'Real-world scenarios', html:`
<div class="scen"><h4>Ten huddle rooms on a budget</h4><div class="sol"><b>Solution:</b> Teams Rooms Basic (free up to 25 rooms) if only the core meeting experience is needed.</div></div>
<div class="scen"><h4>Proactive monitoring for 40 rooms</h4><div class="sol"><b>Solution:</b> Teams Rooms Pro for monitoring, incident management and remote configuration in PMP.</div></div>
<div class="scen"><h4>New office, no IT on site</h4><div class="sol"><b>Solution:</b> Remote provisioning: upload MAC addresses, send verification codes to the installer, sign in remotely.</div></div>
<div class="scen"><h4>Warehouse phones</h4><div class="sol"><b>Solution:</b> Teams Shared Devices license + IP phone policy CommonAreaPhoneSignIn + calling policy restricting outbound destinations if needed.</div></div>`},
{id:'bp', h:'Best practices', html:`
<ul>
<li>Use descriptive UPNs (mtr-, cap-, panel-) and dedicated groups for device accounts.</li>
<li>Apply Conditional Access with device compliance for room accounts rather than MFA.</li>
<li>Use update rings: pilot rooms first, then broad deployment.</li>
<li>Tag devices by site/floor for targeted maintenance.</li>
<li>Allow external meeting invites (<code>ProcessExternalMeetingMessages</code>) only if business requires it.</li>
</ul>`},

<ul>
<li>Panels can't use Teams Rooms Basic.</li>
<li>Rooms Basic: max 25 per tenant; Pro: management + advanced features.</li>
<li>Configuration profiles are for Android devices; Windows rooms use XML/Intune.</li>
<li>Remote sign-in requires MAC address + verification code.</li>
<li>Teams Devices Administrator = least privilege for device management.</li>
</ul>`},

D.tabs.push({
n:6, key:'secmon', icon:'shield', short:'Security, compliance & monitoring',
title:'Security, compliance and monitoring',
maps:['Domain 1 · Manage security and compliance settings','Domain 4 · 15–20% Monitor, report on, and troubleshoot Teams'],
intro:'Protect and govern Teams content with Defender and Purview, then monitor quality, usage and health, and troubleshoot clients, sign-in, meetings and Copilot.',
sections:[
{id:'guide', h:'Detailed study guide', html:`
<h3>1. Security and compliance licensing at a glance</h3>
<ul>
<li><b>Retention policies</b> for Teams chats and channel messages, basic sensitivity labels, eDiscovery (Standard), Audit (Standard, 180 days): E3-level.</li>
<li><b>DLP for Teams chat/channel messages</b>, <b>information barriers</b>, <b>communication compliance</b>, <b>insider risk management</b>, eDiscovery (Premium), Audit (Premium): E5 / E5 Compliance (or relevant add-ons).</li>
<li><b>Defender for Office 365</b>: Safe Links for Teams and Safe Attachments for SharePoint/OneDrive/Teams (Plan 1); ZAP for Teams and advanced hunting/investigation (Plan 2 / E5).</li>
<li><b>Meeting sensitivity labels, watermarks, E2EE meetings</b>: Teams Premium.</li>
</ul>
<h3>2. Microsoft Defender for Office 365 in Teams</h3>
<ul>
<li><b>Safe Links</b> rewrites/checks URLs in Teams messages at time of click (policy setting “Teams” scope).</li>
<li><b>Safe Attachments for SharePoint, OneDrive and Teams</b> — global setting that blocks malicious files shared in Teams.</li>
<li><b>Zero-hour auto purge (ZAP)</b> removes malicious messages already delivered in Teams chats.</li>
<li><b>User-reported messages</b>: users report suspicious Teams messages (messaging policy <i>Report a security concern</i> + Defender user-reported settings).</li>
<li>Teams built-in <b>messaging safety</b> (malicious URL warnings, weaponizable file type blocking, impersonation detection) and the new <b>Security detections report</b> in TAC (Analytics &amp; reports › Protection reports) <span class="nfe">NEW FOR EXAM</span>.</li>
</ul>
<h3>3. Alert policies</h3>
<p>Microsoft Purview alert policies (and Defender) generate alerts for activities such as elevated privileges, unusual external sharing or malware campaigns; you can create custom alert policies on audited Teams activities (for example, a team being deleted or a guest being added). In TAC, <b>Notifications &amp; alerts › Rules</b> create operational alerts (Teams Rooms health, Direct Routing health, usage thresholds) delivered to a Teams channel or other targets.</p>
<h3>4. Retention</h3>
<ul>
<li>Purview › Data lifecycle management › Retention policies; locations: <b>Teams channel messages</b> (targets teams/Microsoft 365 groups — now also covers private channel messages after the 2025–2026 migration) and <b>Teams chats</b> (targets users).</li>
<li>Retain, delete, or retain then delete. When content is deleted by retention, it disappears from the Teams client (the process can take several days).</li>
<li>Teams <b>files</b> are retained through the SharePoint/OneDrive locations; recordings follow OneDrive/SharePoint policies.</li>
<li>Litigation hold/eDiscovery holds preserve mailbox content, including Teams chat compliance records.</li>
</ul>
<h3>5. Sensitivity labels</h3>
<ul>
<li><b>Container labels</b> (teams, groups, sites): privacy (public/private), external user (guest) access, external sharing level for the site, access from unmanaged devices, private teams discoverability, shared channel controls. Enable with <code>EnableMIPLabels = true</code> on the Group.Unified setting and sync with <code>Execute-AzureADLabelSync</code>; publish with a <b>label policy</b> (can set a default container label and require a label).</li>
<li><b>Meeting labels</b> (Teams Premium): apply meeting protections — lobby, who can present, recording, chat, copy/paste restrictions, watermarks, end-to-end encryption.</li>
</ul>
<h3>6. Data loss prevention</h3>
<p>Purview DLP policies with the <b>Teams chat and channel messages</b> location detect sensitive information (credit cards, IDs, custom SITs), show policy tips, and block messages (for everyone or for external recipients). Files shared in Teams are protected by SharePoint/OneDrive DLP. Since the private channel change, private channel messages are covered by policies scoped to the team's group.</p>
<h3>7. Information barriers (IB)</h3>
<ul>
<li>Prevent communication and collaboration between <b>segments</b> (defined by Entra attributes such as Department). Steps: define segments (<code>New-OrganizationSegment</code>), create policies (<code>New-InformationBarrierPolicy</code> with blocked or allowed segments), then apply (<code>Start-InformationBarrierPoliciesApplication</code>).</li>
<li>Effects in Teams: blocks chats, calls, meetings and adding users to teams across blocked segments; scoped directory search; IB modes on teams/sites.</li>
</ul>
<h3>8. Communication compliance and insider risk</h3>
<ul>
<li><b>Communication compliance</b>: detect harassment, threats, sensitive information or regulatory violations in Teams messages; reviewers investigate and can remove messages from Teams.</li>
<li><b>Insider risk management</b>: correlates signals (HR connector, data exfiltration, risky browsing) for departing-employee data theft or leaks; Teams activity is one signal source.</li>
</ul>
<h3>9. Monitoring and reporting</h3>
<div class="tblwrap"><table class="tbl"><thead><tr><th>Tool</th><th>Use it for</th></tr></thead><tbody>
<tr><td><b>Call analytics</b> (TAC › Users › user › Meetings &amp; calls)</td><td>One user's calls/meetings, per-leg device, network and quality details (last 30 days)</td></tr>
<tr><td><b>Real-time analytics</b></td><td>Telemetry while a scheduled meeting is in progress (audio/video/sharing, network)</td></tr>
<tr><td><b>Call Quality Dashboard (CQD)</b></td><td>Org-wide quality trends by building, subnet, network, client; upload <b>building data</b> (tenant data) to map subnets to locations</td></tr>
<tr><td><b>Usage reports</b> (TAC › Analytics &amp; reports; Microsoft 365 admin center › Reports)</td><td>Team activity, user activity, app usage, device usage, PSTN usage, per-meeting metrics, storage; 7/30/90/180-day ranges</td></tr>
<tr><td><b>Purview audit log</b></td><td>Who created/deleted a team, added a guest, changed settings (Standard audit retention 180 days)</td></tr>
<tr><td><b>Microsoft 365 network connectivity</b></td><td>Office location network insights and recommendations</td></tr>
<tr><td><b>Alert rules</b> (TAC › Notifications &amp; alerts)</td><td>Proactive alerts for device health, Direct Routing, usage</td></tr>
</tbody></table></div>
<ul>
<li>EUII visibility in CQD/call analytics depends on role: <b>Teams Communications Support Engineer</b> sees full details (including other participants' info); <b>Support Specialist</b> sees limited details; Reports Reader sees aggregate data without EUII.</li>
<li>Usage reports show <b>concealed names</b> by default; to show names, turn off concealment in Microsoft 365 admin center › Settings › Org settings › Reports.</li>
<li><b>Feedback policies</b> (<code>Set-CsTeamsFeedbackPolicy</code>): allow users to give feedback, receive surveys, include screenshots/logs/email.</li>
</ul>
<h3>10. Troubleshooting</h3>
<ul>
<li><b>Logs</b>: Windows <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>1</kbd> (Mac <kbd>Cmd</kbd>+<kbd>Option</kbd>+<kbd>Shift</kbd>+<kbd>1</kbd>) downloads diagnostic logs; media logs for call issues; device logs from the management portal.</li>
<li><b>Clear cache</b> (new Teams on Windows): quit Teams, then delete <code>%userprofile%\\appdata\\local\\Packages\\MSTeams_8wekyb3d8bbwe\\LocalCache\\Microsoft\\MSTeams</code>, or Windows Settings › Apps › Microsoft Teams › Advanced options › Reset.</li>
<li><b>Self-help diagnostics</b> in the Microsoft 365 admin center (Help &amp; support): checks for meetings, recording, sign-in, external access/federation, Direct Routing, user calling and more.</li>
<li><b>Installation/updates</b>: WebView2 present, MSIX/sideloading allowed, bootstrapper logs, version within support window, no blocking of update endpoints.</li>
<li><b>Sign-in</b>: license and Teams service plan enabled, Conditional Access results in Entra sign-in logs (e.g., AADSTS53003 blocked by CA, AADSTS50076 MFA required), account enabled, cached credentials (clear cache), proxy/TLS issues.</li>
<li><b>Copilot</b>: user has a Microsoft 365 Copilot license; organizer's meeting policy and meeting option (Off / Only during / During and after); transcription allowed when a saved transcript is required; post-meeting Copilot needs a saved transcript; Copilot isn't available in some sovereign clouds; meeting features like E2EE can disable recording/transcription/Copilot.</li>
<li><b>Meeting join and features</b>: lobby and anonymous settings, external access blocks, information barriers, presenter role, policy-disabled features (recording, transcription, Q&amp;A, chat), Teams Premium-only features, network ports blocked.</li>
</ul>`},
{id:'concepts', h:'Important concepts', html:`
<dl class="kv">
<dt>Container label</dt><dd>Sensitivity label applied to a team/group/site that enforces privacy and sharing.</dd>
<dt>Segment</dt><dd>Group of users defined by an attribute for information barriers.</dd>
<dt>EUII</dt><dd>End-user identifiable information in quality data; shown only to certain roles.</dd>
<dt>Building data</dt><dd>Subnet-to-location mapping uploaded to CQD.</dd>
<dt>ZAP</dt><dd>Zero-hour auto purge removes malicious messages after delivery.</dd>
<dt>Retention location</dt><dd>Teams channel messages (groups) vs Teams chats (users).</dd>
<dt>Self-help diagnostics</dt><dd>Automated checks in the Microsoft 365 admin center.</dd>
</dl>`},
{id:'resp', h:'Administrator responsibilities', html:`
<ul>
<li>Work with compliance owners on retention, labels, DLP, IB and communication compliance for Teams.</li>
<li>Enable Defender protections for Teams and train users to report suspicious messages.</li>
<li>Upload building data to CQD and review quality monthly.</li>
<li>Configure alert rules and respond to device/DR health alerts.</li>
<li>Publish usage reports to stakeholders (respecting privacy settings).</li>
<li>Run first-line troubleshooting with logs, diagnostics, call analytics and sign-in logs.</li>
</ul>`},
{id:'paths', h:'Portals & PowerShell', html:`
<pre><code># Information barriers (Security &amp; Compliance PowerShell)
Connect-IPPSSession
New-OrganizationSegment -Name "R&amp;D" -UserGroupFilter "Department -eq 'R&amp;D'"
New-OrganizationSegment -Name "Sales" -UserGroupFilter "Department -eq 'Sales'"
New-InformationBarrierPolicy -Name "R&amp;D-Sales" -AssignedSegment "R&amp;D" -SegmentsBlocked "Sales" -State Active
New-InformationBarrierPolicy -Name "Sales-R&amp;D" -AssignedSegment "Sales" -SegmentsBlocked "R&amp;D" -State Active
Start-InformationBarrierPoliciesApplication

# Sensitivity labels for containers
Execute-AzureADLabelSync

# Feedback policy
Set-CsTeamsFeedbackPolicy -Identity Global -UserInitiatedMode Enabled -ReceiveSurveysMode EnabledUserOverride</code></pre>
<p>Purview: Data lifecycle management › Retention policies · Information protection › Labels/Label policies · Data loss prevention › Policies · Information barriers · Communication compliance · Audit · eDiscovery. TAC: Analytics &amp; reports › Usage reports / Call quality dashboard / Protection reports · Notifications &amp; alerts › Rules · Users › user › Meetings &amp; calls.</p>`},
{id:'scen', h:'Real-world scenarios', html:`
<div class="scen"><h4>Regulated chat retention</h4><div class="sol"><b>Solution:</b> Retention policy on the <i>Teams chats</i> location (all users) retaining 7 years; separate policy for <i>Teams channel messages</i> on relevant teams.</div></div>
<div class="scen"><h4>Research and sales must not talk</h4><div class="sol"><b>Solution:</b> Information barriers with two segments and reciprocal block policies; apply policies.</div></div>
<div class="scen"><h4>Credit card numbers in chat</h4><div class="sol"><b>Solution:</b> DLP policy for Teams chat and channel messages with the credit card SIT, policy tip and block.</div></div>
<div class="scen"><h4>Which floor has bad calls?</h4><div class="sol"><b>Solution:</b> Upload building data to CQD and filter by building/subnet.</div></div>
<div class="scen"><h4>User can't sign in after a new policy</h4><div class="sol"><b>Solution:</b> Check Entra sign-in logs for the CA result, then the Teams sign-in diagnostic.</div></div>`},
{id:'bp', h:'Best practices', html:`
<ul>
<li>Use container labels as the single governance control for privacy and guest access of sensitive teams.</li>
<li>Test IB in a pilot; it affects existing teams and chats.</li>
<li>Keep retention policies simple: one org-wide chats policy plus targeted channel policies.</li>
<li>Upload and maintain CQD building data; it turns raw data into actionable reports.</li>
<li>Assign Support Specialist/Engineer roles instead of Teams Administrator for helpdesk staff.</li>
</ul>`},
{id:'tips', h:'Exam tips', html:`
<ul>
<li>One user's call → call analytics; ongoing meeting → real-time analytics; org trends → CQD.</li>
<li>Full participant details for helpdesk without admin rights → Teams Communications Support Engineer.</li>
<li>Usage report shows hashed names → turn off concealment in Microsoft 365 admin center.</li>
<li>Who deleted a team → Purview audit log.</li>
<li>IB cmdlets: segment → policy → <code>Start-InformationBarrierPoliciesApplication</code>.</li>
<li>Logs: Ctrl+Alt+Shift+1.</li>
</ul>`},
{id:'mistakes', h:'Common mistakes', html:`
<ul>
<li>Choosing communication compliance when the requirement is to <i>prevent</i> communication (that's IB).</li>
<li>Applying the Teams chats retention location to groups (it targets users).</li>
<li>Expecting CQD to show building names without uploading building data.</li>
<li>Giving helpdesk Teams Administrator just to see call analytics.</li>
</ul>`},
{id:'asks', h:'Things Microsoft likes to ask on the exam', html:`
<ul class="asklist">
<li>Which Purview feature fits: retention vs DLP vs IB vs communication compliance vs insider risk.</li>
<li>Which license enables a compliance feature.</li>
<li>Which quality tool for a scenario, and which role sees EUII.</li>
<li>How to reveal user names in reports.</li>
<li>How to collect logs/clear cache for the new client.</li>
<li>Why Copilot or recording is unavailable in a meeting.</li>
</ul>`},

],

n:7, key:'iam', icon:'key', short:'Identity, access & auth',
title:'Identity, access and authentication',
maps:['Domain 1 · 40–45%','Configure and manage external collaboration','Choose appropriate Teams administrator roles','Specify Conditional Access policies for Teams'],
intro:'Teams identity is Microsoft Entra ID. This tab covers authentication and Conditional Access, Teams admin roles, and the full external collaboration toolkit: external access, guest access, cross-tenant access with B2B direct connect and shared channels, and multitenant organizations.',
sections:[
{id:'guide', h:'Detailed study guide', html:`
<h3>1. Identity foundations</h3>
<ul>
<li>Identity models: <b>cloud-only</b> or <b>hybrid</b> (Entra Connect / Cloud Sync from AD DS with password hash sync, pass-through auth or federation). Teams requires users to exist in Entra ID and be licensed; the Teams service provisions a <code>CsOnlineUser</code> object.</li>
<li>UPN and SIP address should match a verified domain; users with unverified (e.g., .local) UPNs can't sign in with them.</li>
<li><b>Modern authentication</b> (OAuth) is used by all Teams clients; MFA, Conditional Access and passwordless (Authenticator, FIDO2, Windows Hello) apply.</li>
</ul>
<h3>2. Conditional Access (CA) for Teams</h3>
<ul>
<li>Teams depends on Exchange Online and SharePoint Online. Target CA policies at the <b>Office 365</b> cloud app (the app group that includes Teams, Exchange, SharePoint) so enforcement is consistent and users don't hit partial failures.</li>
<li>Typical controls: require MFA, require compliant or hybrid-joined device, block legacy auth, restrict by location, app protection policies on mobile, session controls (e.g., sign-in frequency).</li>
<li><b>Teams Rooms and shared devices</b>: exclude from interactive MFA and require device compliance/trusted network instead.</li>
<li>Guests are subject to <i>your</i> CA policies (and can be trusted for MFA/device claims from their home tenant via cross-tenant inbound trust settings).</li>
<li>License: Microsoft Entra ID P1.</li>
</ul>
<h3>3. Teams administrator roles</h3>
<div class="tblwrap"><table class="tbl"><thead><tr><th>Role</th><th>Scope</th></tr></thead><tbody>
<tr><td>Teams Administrator</td><td>Everything in Teams and TAC, plus Microsoft 365 groups management</td></tr>
<tr><td>Teams Communications Administrator</td><td>Calling and meetings: phone numbers, voice and meeting policies, AA/CQ, call analytics</td></tr>
<tr><td>Teams Telephony Administrator</td><td>Voice and telephony features and troubleshooting in TAC</td></tr>
<tr><td>Teams Communications Support Engineer</td><td>Advanced troubleshooting: call analytics/CQD with full participant information</td></tr>
<tr><td>Teams Communications Support Specialist</td><td>Basic troubleshooting: call analytics with limited information about other participants</td></tr>
<tr><td>Teams Devices Administrator</td><td>Teams devices (TAC devices and Teams Rooms Pro Management)</td></tr>
<tr><td>Teams Reader <span class=\"nfe\">NEW FOR EXAM</span></td><td>Read everything in the Teams admin center without changing anything</td></tr>
<tr><td>Global Reader / Reports Reader</td><td>Read-only across admin centers / usage reports only</td></tr>
</tbody></table></div>
<p>Apply least privilege; use Privileged Identity Management (Entra ID P2) for just-in-time elevation. Group owners manage their teams without admin roles.</p>
<h3>4. External collaboration options</h3>
<div class="tblwrap"><table class="tbl"><thead><tr><th>Option</th><th>Account in your tenant?</th><th>Capabilities</th><th>Configure in</th></tr></thead><tbody>
<tr><td><b>External access</b> (federation)</td><td>No</td><td>1:1/group chat, calls, presence, meeting join with people in other Teams orgs (and unmanaged Teams accounts)</td><td>TAC › Users › External access; external access policies</td></tr>
<tr><td><b>Guest access</b> (B2B collaboration)</td><td>Yes — guest user</td><td>Team membership, channels, files, chat, meetings</td><td>Entra external collaboration + Microsoft 365 Groups settings + TAC guest access + SharePoint sharing</td></tr>
<tr><td><b>Shared channels</b> (B2B direct connect)</td><td>No</td><td>Work in a specific channel from their own tenant (chat, files, meetings) without switching tenants</td><td>Entra cross-tenant access (both orgs) + Teams policies</td></tr>
<tr><td><b>Multitenant organization</b> (MTO)</td><td>Yes — synced external <i>member</i></td><td>Unified people search, chat/calls, cross-tenant notifications for tenants you own</td><td>Microsoft 365 admin center (Multitenant collaboration) or Entra; cross-tenant synchronization</td></tr>
</tbody></table></div>
<h4>External access details</h4>
<ul>
<li>Org-wide domain control: allow all external domains, allow only specific domains, block specific domains, or block all (<code>Set-CsTenantFederationConfiguration</code>).</li>
<li><b>Teams accounts not managed by an organization</b> (consumer Teams): allow/deny communication, and whether they can start conversations.</li>
<li><b>Per-user/group external access policies with domain control</b> (GA September 2025): custom policies can use org settings, allow all, allow only specific domains, block specific domains, or block all, and be assigned to users or groups (<code>Set-CsExternalAccessPolicy -CommunicationWithExternalOrgs AllowSpecificExternalDomains -AllowedExternalDomains ...</code>) <span class="nfe">NEW FOR EXAM</span>.</li>
<li>Consumer Skype retired May 5, 2025, so Skype interop scenarios no longer apply.</li>
</ul>
<h4>Guest access layers (all must allow)</h4>
<ol>
<li><b>Microsoft Entra</b> › External Identities › External collaboration settings: guest user access level (same as members / limited — default / most restrictive), who can invite guests (anyone incl. guests, members and specific admins, only admins with Guest Inviter, no one), allow/deny domain lists, email one-time passcode, self-service sign-up.</li>
<li><b>Microsoft 365 admin center</b> › Settings › Org settings › Microsoft 365 Groups: let owners add guests; let guests access group content.</li>
<li><b>Teams admin center</b> › Users › Guest access: allow guest access in Teams (on by default) plus guest calling, meeting and messaging permissions.</li>
<li><b>SharePoint admin center</b>: external sharing at least “Existing guests” / “New and existing guests” for team sites; site-level sharing can't exceed org level.</li>
</ol>
<ul>
<li><b>Block guests in one team</b>: sensitivity label with external user access off, or group setting <code>AllowToAddGuests = false</code> via Graph PowerShell.</li>
<li><b>Remove guests</b>: from a team (owners/TAC), or from the tenant (delete the guest user in Entra/Microsoft 365 admin center); automate with access reviews.</li>
<li>Guests don't need licenses; Entra External ID uses MAU billing (first 50,000 MAU free).</li>
</ul>
<h4>Shared channels and B2B direct connect</h4>
<ul>
<li>Both organizations configure <b>cross-tenant access settings</b> (Entra › External Identities): your <b>outbound</b> B2B direct connect allows your users/groups to access the partner; the partner's <b>inbound</b> allows them in (and vice versa for the other direction). Applications: Office 365 (or all apps).</li>
<li>Teams policies: <i>Create shared channels</i>, <i>Invite external users to shared channels</i>, <i>Join external shared channels</i>.</li>
<li>Inbound <b>trust settings</b> can accept MFA and device compliance claims from the partner tenant to avoid double prompts.</li>
</ul>
<h4>Multitenant organizations (MTO)</h4>
<ul>
<li>Create in the Microsoft 365 admin center › Settings › Org settings › Organization profile › Multitenant collaboration; owner tenant invites joiner tenants; <b>Share users</b> creates cross-tenant synchronization configurations (<i>MTO_Sync_&lt;TenantID&gt;</i>) in Entra.</li>
<li>Synced users appear as external <b>members</b> (not guests) — enabling better search, chat and collaboration in the new Teams client. Requires Entra ID P1 per participating user. Sync can take up to 24 hours to appear in Teams.</li>
</ul>
<h3>5. Anonymous and unauthenticated access</h3>
<p>Anonymous meeting join is governed by the org-wide meeting setting and the organizer's meeting policy; you can require verification (e.g., one-time passcode) for anonymous users, and Microsoft may enforce email OTP for external event participants to prevent abuse.</p>`},
{id:'concepts', h:'Important concepts', html:`
<dl class="kv">
<dt>Federation</dt><dd>Teams external access between tenants (no account in your directory).</dd>
<dt>B2B collaboration</dt><dd>Guest accounts in your tenant.</dd>
<dt>B2B direct connect</dt><dd>Mutual trust enabling shared channels without guests.</dd>
<dt>Cross-tenant access settings</dt><dd>Default and per-organization inbound/outbound rules and trust settings.</dd>
<dt>Cross-tenant synchronization</dt><dd>Automated provisioning of users from one tenant to another (MTO).</dd>
<dt>Guest Inviter</dt><dd>Entra role that can invite guests when invitations are restricted.</dd>
<dt>Office 365 app (CA)</dt><dd>Cloud app grouping that covers Teams and its dependencies.</dd>
<dt>Least privilege</dt><dd>Use the narrowest Teams role that meets the requirement.</dd>
</dl>`},
{id:'resp', h:'Administrator responsibilities', html:`
<ul>
<li>Define the external collaboration strategy per partner type (federation, guests, shared channels, MTO).</li>
<li>Configure domain allow/block lists and per-group external access policies.</li>
<li>Align guest settings across Entra, Microsoft 365 Groups, Teams and SharePoint.</li>
<li>Configure cross-tenant access with partners and trust settings.</li>
<li>Assign Teams admin roles using least privilege and PIM.</li>
<li>Coordinate Conditional Access with the identity team (Office 365 app, device compliance, rooms).</li>
</ul>`},
{id:'paths', h:'Admin center paths & PowerShell', html:`
<pre><code># External access: only allow two partner domains org-wide
Set-CsTenantFederationConfiguration -AllowFederatedUsers $true -AllowedDomains (New-CsEdgeAllowList -AllowedDomain "fabrikam.com","tailspin.com")

# Per-group external access policy (Legal can only talk to courts.example)
New-CsExternalAccessPolicy -Identity "LegalCourts" -EnableFederationAccess $true -CommunicationWithExternalOrgs "AllowSpecificExternalDomains" -AllowedExternalDomains @("courts.example")
Grant-CsExternalAccessPolicy -PolicyName "LegalCourts" -Group "legal@litware.com" -Rank 1

# Shared channel Teams policy
Set-CsTeamsChannelsPolicy -Identity Global -AllowSharedChannelCreation $true -AllowChannelSharingToExternalUser $true -AllowUserToParticipateInExternalSharedChannel $true

# Block guests in a single team (Microsoft Graph PowerShell, group setting Group.Unified.Guest -> AllowToAddGuests=false)</code></pre>
<p>Paths: TAC › Users › External access / Guest access · Entra › External Identities › External collaboration settings / Cross-tenant access settings · M365 admin center › Settings › Org settings › Microsoft 365 Groups / Multitenant collaboration · SharePoint admin center › Policies › Sharing · Entra › Protection › Conditional Access · Entra › Roles &amp; admins.</p>`},
{id:'scen', h:'Real-world scenarios', html:`
<div class="scen"><h4>Chat with a supplier, no guests</h4><div class="sol"><b>Solution:</b> External access — allow the supplier's domain.</div></div>
<div class="scen"><h4>Partner engineers work in one channel, no guest accounts</h4><div class="sol"><b>Solution:</b> Shared channel; configure B2B direct connect inbound/outbound in both tenants for the relevant groups; Teams policy allows inviting external users.</div></div>
<div class="scen"><h4>Two tenants after an acquisition</h4><div class="sol"><b>Solution:</b> Multitenant organization with user sharing (cross-tenant sync) for unified search and chat.</div></div>
<div class="scen"><h4>Guests can't open team files</h4><div class="sol"><b>Solution:</b> Check SharePoint org/site external sharing (must allow existing guests) and Microsoft 365 Groups guest settings.</div></div>`},
{id:'bp', h:'Best practices', html:`
<ul>
<li>Prefer allow lists for external access in regulated organizations.</li>
<li>Use shared channels for ongoing partner collaboration when both sides use Teams; use guests when partners need full team access.</li>
<li>Restrict guest invitations to members or admins and review guests regularly.</li>
<li>Use CA with the Office 365 app; protect rooms with device-based CA.</li>
<li>Configure inbound trust for MFA from trusted partners to reduce friction.</li>
</ul>`},
{id:'tips', h:'Exam tips', html:`
<ul>
<li>“Without creating guest accounts” → external access (chat/calls) or shared channels (channel collaboration).</li>
<li>Shared channels need cross-tenant settings in <b>both</b> tenants.</li>
<li>Guest access needs all four layers; the most restrictive wins.</li>
<li>Per-group external domain control = custom external access policy (new).</li>
<li>Helpdesk with full call details = Support Engineer; devices only = Devices Administrator.</li>
</ul>`},
{id:'mistakes', h:'Common mistakes', html:`
<ul>
<li>Turning on Teams guest access but leaving Microsoft 365 Groups guest settings off.</li>
<li>Configuring B2B direct connect only in your own tenant.</li>
<li>Targeting CA at Teams only, causing inconsistent behavior with SharePoint/Exchange.</li>
<li>Using Global Administrator for daily Teams tasks.</li>
</ul>`},
{id:'asks', h:'Things Microsoft likes to ask on the exam', html:`
<ul class="asklist">
<li>External access vs guest access vs shared channels for a scenario.</li>
<li>Steps/settings for B2B direct connect.</li>
<li>Where to restrict who can invite guests or which domains are allowed.</li>
<li>How to block guests for one team only.</li>
<li>Which role meets a least-privilege requirement.</li>
<li>Which cloud app to target in CA for Teams.</li>
<li>What MTO provides and how users are represented.</li>
</ul>`},
