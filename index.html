n:8, key:'lic', icon:'license', short:'Licensing & M365 integration',
title:'Licensing and Microsoft 365 integration',
maps:['Domain 1 · licensing requirements in several objectives','Teams with Exchange, SharePoint, OneDrive, Microsoft 365 Groups','Teams Premium, Phone, Rooms, Copilot'],
intro:'Licensing questions appear in nearly every MS-700 domain. Learn which plans include Teams, which add-ons unlock which features (after the 2025–2026 changes), and how Teams integrates with the rest of Microsoft 365.',
sections:[
{id:'guide', h:'Detailed study guide', html:`
<h3>1. How users get Teams</h3>
<ul>
<li><b>Enterprise</b>: Microsoft 365 / Office 365 E1, E3, E5 suites <b>with Teams</b> — reintroduced worldwide from <b>November 1, 2025</b> — or suites <b>without Teams</b> plus the standalone <b>Teams Enterprise</b> license. Prices changed again on <b>July 1, 2026</b> <span class="nfe">NEW FOR EXAM</span>.</li>
<li><b>Business</b> (≤ 300 users): Microsoft 365 Business Basic, Standard, Premium (with or without Teams); <b>Teams Essentials</b> for standalone small-business meetings/chat.</li>
<li><b>Frontline</b>: Microsoft 365 F1/F3 (with or without Teams).</li>
<li><b>Education</b> (A1/A3/A5) and <b>Government</b> (G3/G5, GCC/GCC High/DoD) variants.</li>
<li>A user needs the <b>Microsoft Teams</b> service plan enabled; disabling the plan in a license removes Teams access. Use <b>group-based licensing</b> (Entra ID P1) to manage at scale.</li>
</ul>
<h3>2. Add-ons and what they unlock</h3>
<div class="tblwrap"><table class="tbl"><thead><tr><th>Add-on</th><th>Unlocks</th></tr></thead><tbody>
<tr><td>Teams Phone Standard</td><td>Cloud PBX features (included in E5). Plus PSTN via Calling Plan, Operator Connect, Teams Phone Mobile or Direct Routing</td></tr>
<tr><td>Calling Plans</td><td>Microsoft PSTN service (Domestic, Domestic &amp; International, Pay-as-you-go)</td></tr>
<tr><td>Audio Conferencing</td><td>Dial-in/out for meetings (basic version free with many plans; full in E5)</td></tr>
<tr><td>Teams Phone Resource Account</td><td>Free license for AA/CQ resource accounts</td></tr>
<tr><td>Teams Shared Devices (and Teams Shared Space, 2026)</td><td>Common area phones, panels, hot-desking devices; shared desks in Places</td></tr>
<tr><td>Teams Rooms Basic / Pro</td><td>Meeting room devices (Basic free ≤ 25 rooms; Pro with advanced features and management)</td></tr>
<tr><td>Teams Premium</td><td>Advanced meeting protection (watermarks, labels, E2EE meetings), intelligent recap and translation, branding/customization, custom meeting templates, custom policy packages, advanced virtual appointments, Queues app</td></tr>
<tr><td>Attendee Capacity Pack</td><td>Town halls with engagement above 3,000 attendees (up to 100,000) <span class="nfe">NEW FOR EXAM</span></td></tr>
<tr><td>Microsoft 365 Copilot</td><td>Copilot in Teams meetings, calls and chats (plus other apps)</td></tr>
<tr><td>Entra ID P1 / P2</td><td>Group naming/expiration, creation restriction, dynamic groups, CA (P1); access reviews, PIM (P2/Governance)</td></tr>
<tr><td>E5 Compliance / Security</td><td>IB, communication compliance, IRM, DLP for chat, Audit Premium, Defender for Office 365 P2</td></tr>
</tbody></table></div>
<h3>3. The April 1, 2026 Teams licensing update <span class="nfe">NEW FOR EXAM</span></h3>
<ul>
<li>Advanced <b>town hall</b> features moved from Teams Premium to Teams Enterprise: Microsoft/partner eCDN, ultra-low-latency streaming, 1080p, custom invites, attendee chat/reactions/hand raise/polls, town hall insights, engagement reporting, Silent Test.</li>
<li>Advanced <b>webinar</b> features moved too: custom invite templates and send times, registration waitlists, manual approval, registration windows, hide attendee names, spotlight, RTMP-In.</li>
<li>Capacity: Teams Enterprise town halls support <b>3,000</b> attendees with engagement and <b>10,000</b> view-only; the <b>Attendee Capacity Pack</b> raises engagement events to <b>100,000</b>. Customers with Teams Premium bought before April 1, 2026 keep prior entitlements (including 100,000-attendee town halls) until renewal ("Teams Premium Legacy").</li>
<li><b>Immersive events</b> (Mesh replacement) are included with Teams Enterprise.</li>
<li><b>Microsoft Places</b> core finder/explorer features became available more broadly; shared desks use Teams Shared Space licensing.</li>
</ul>
<h3>4. Integration with Microsoft 365 services</h3>
<ul>
<li><b>Exchange Online</b>: calendar, meeting scheduling, voicemail, compliance records, room mailboxes. Hybrid with on-premises Exchange mailboxes requires Exchange hybrid with OAuth for calendar features; some features (e.g., delegation, eDiscovery of chats) need cloud mailboxes.</li>
<li><b>SharePoint/OneDrive</b>: file storage, sharing, versioning, retention; external sharing settings decide guest file access.</li>
<li><b>Microsoft 365 Groups</b>: membership and lifecycle for teams; Planner, OneNote and the group mailbox come with each team.</li>
<li><b>Planner/Tasks</b>, <b>Loop</b> components, <b>Whiteboard</b>, <b>Stream</b> (recordings playback), <b>Bookings</b> (virtual appointments), <b>Viva</b> apps (Engage integration with town halls, Connections), <b>Places</b>.</li>
<li><b>Power Platform</b>: Workflows (Power Automate) replaced Office 365 connectors; Power Apps and Copilot Studio agents can be published to Teams.</li>
<li><b>Microsoft 365 Copilot</b> grounds on Teams chats, meetings (transcripts) and files the user can access.</li>
</ul>`},
{id:'concepts', h:'Important concepts', html:`
<dl class="kv">
<dt>Service plan</dt><dd>Component inside a license (e.g., TEAMS1) that can be toggled.</dd>
<dt>Group-based licensing</dt><dd>Assign licenses to Entra groups (Entra ID P1).</dd>
<dt>Teams Enterprise</dt><dd>Standalone Teams license used with “no Teams” suites; includes advanced events since April 2026.</dd>
<dt>Teams Premium Legacy</dt><dd>Pre-April-2026 Premium terms with previous entitlements until renewal.</dd>
<dt>Attendee Capacity Pack</dt><dd>Assigned to organizers to scale engagement events to 100,000.</dd>
<dt>Communication credits</dt><dd>Prepaid balance for toll-free and pay-per-minute calling.</dd>
<dt>MAU billing</dt><dd>Monthly active user pricing for external identities.</dd>
</dl>`},
{id:'resp', h:'Administrator responsibilities', html:`
<ul>
<li>Map business requirements to licenses and add-ons before enabling features.</li>
<li>Assign licenses with groups; monitor unassigned and over-assigned licenses.</li>
<li>Re-evaluate Teams Premium seats after the April 2026 changes.</li>
<li>Plan Exchange and SharePoint dependencies (hybrid mailboxes, sharing settings).</li>
<li>Track Microsoft licensing announcements and Message center posts.</li>
</ul>`},
{id:'paths', h:'Admin centers & PowerShell', html:`
<p>Microsoft 365 admin center › Billing › Licenses · Users › Active users › Licenses and apps (toggle the Microsoft Teams service plan) · Entra › Groups › Licenses (group-based licensing) · TAC › Teams Premium page (license counts, usage, feature advisor) · TAC › Voice › Phone numbers (Calling Plan usage) · Microsoft 365 admin center › Billing › Communication credits.</p>
<pre><code># Check a user's assigned plans (Microsoft Graph PowerShell)
Get-MgUserLicenseDetail -UserId user@contoso.com | Select SkuPartNumber
# Teams object provisioning
Get-CsOnlineUser -Identity user@contoso.com | Select DisplayName, AccountEnabled, FeatureTypes, EnterpriseVoiceEnabled</code></pre>`},
{id:'scen', h:'Real-world scenarios', html:`
<div class="scen"><h4>Webinar program on Premium</h4><p>Marketing bought Teams Premium only for webinar registration and branding emails.</p><div class="sol"><b>Solution:</b> Since April 2026, those webinar features are in Teams Enterprise; review whether Premium is still needed at renewal (keep it for watermarking, recap, Queues app, etc.).</div></div>
<div class="scen"><h4>40 rooms and 20 panels</h4><div class="sol"><b>Solution:</b> Teams Rooms Pro for rooms needing management; panels via Pro (room scenario) or Teams Shared Devices — Basic can't license panels.</div></div>
<div class="scen"><h4>Small business with 120 users</h4><div class="sol"><b>Solution:</b> Microsoft 365 Business Standard (with Teams) plus Teams Phone with Calling Plan for receptionists.</div></div>`},
{id:'bp', h:'Best practices', html:`
<ul>
<li>License by persona; avoid buying add-ons for features now included in Enterprise.</li>
<li>Use group-based licensing and service plan toggles rather than per-user edits.</li>
<li>Keep at least one Teams Phone license if you use AA/CQ; license resource accounts properly.</li>
<li>Document Premium-only features in your governance guide so helpdesk can explain missing options.</li>
</ul>`},
{id:'tips', h:'Exam tips', html:`
<ul>
<li>Watermarks / meeting labels / custom templates / Queues app → Teams Premium.</li>
<li>Naming / expiration / creation restriction → Entra ID P1; access reviews → P2.</li>
<li>IB / communication compliance / DLP for chat → E5 compliance.</li>
<li>Town hall > 3,000 engaged attendees → Attendee Capacity Pack.</li>
<li>Guests → no license; resource accounts → free Resource Account license.</li>
</ul>`},
{id:'mistakes', h:'Common mistakes', html:`
<ul>

n:9, key:'news', icon:'spark', short:'Recent changes & exam updates',
title:'Recent Changes and Exam Updates',
maps:['Skills measured as of October 27, 2026','All four domains','NEW FOR EXAM items'],
intro:'What changed in Teams administration and in the exam outline through late 2026. Every item here is marked <span class="nfe">NEW FOR EXAM</span> — expect the current replacement feature, not the retired one, in answer options.',
sections:[
{id:'guide', h:'Exam outline updates', html:`
<div class="callout new"><b>Current skills outline: October 27, 2026 <span class="nfe">NEW FOR EXAM</span></b>Domains and weights: Configure and manage a Teams environment (40–45%), Manage teams, channels, chats, and apps (20–25%), Manage meetings and calling (15–20%), Monitor, report on, and troubleshoot Teams (15–20%). The October 2026 refresh lists minor changes in network planning, team creation, app management and troubleshooting.</div>
<ul>
<li><span class="nfe">NEW FOR EXAM</span> <b>Teams Advisor</b> is named explicitly for rollout planning.</li>
<li><span class="nfe">NEW FOR EXAM</span> <b>Multitenant organizations (MTO)</b> and <b>B2B direct connect</b> for shared channels are explicit external-collaboration skills.</li>
<li><span class="nfe">NEW FOR EXAM</span> <b>Control external access by domain for specific users and groups</b> is listed.</li>
<li><span class="nfe">NEW FOR EXAM</span> <b>Meeting settings for Microsoft 365 Copilot</b> and <b>troubleshooting Copilot and AI experiences in Teams</b>.</li>
<li><span class="nfe">NEW FOR EXAM</span> <b>Teams town halls</b>, <b>webinars</b>, <b>Appointments</b>, <b>meeting templates and template policies</b>, <b>meeting customization policies</b>, <b>events policies</b>.</li>
<li><span class="nfe">NEW FOR EXAM</span> <b>Frontline teams and experiences</b>, <b>Purview Insider Risk Management</b> use cases, <b>Defender for Office 365 threat policies</b>, <b>Entra access reviews</b>, <b>update policies</b>, <b>Teams for VDI</b>, <b>device tags</b> and <b>remote sign-in</b>.</li>
<li>Skype for Business upgrade/coexistence content is no longer part of the outline.</li>
</ul>`},
{id:'news', h:'New Teams admin center capabilities', html:`
<ul>
<li><span class="nfe">NEW FOR EXAM</span> <b>What's New</b> section in TAC (Nov–Dec 2025): tenant-specific feature updates, new admin controls, Message center links and Targeted Release visibility.</li>
<li><span class="nfe">NEW FOR EXAM</span> <b>Security detections report</b> (Analytics &amp; reports › Protection reports): impersonation, malicious URLs and weaponizable files in Teams messaging; export data and block malicious external users through external access (rolled out mid/late 2026).</li>
<li><span class="nfe">NEW FOR EXAM</span> <b>Simplified app enablement</b> (Teams apps › Manage apps › Manage access): guided review of availability, installation and permission changes for apps and agents (mid-October to mid-November 2026).</li>
<li><span class="nfe">NEW FOR EXAM</span> <b>App centric management</b> fully replaced app permission policies (auto-migration finished mid-2025).</li>
<li><span class="nfe">NEW FOR EXAM</span> <b>Teams Premium page</b> in TAC: license counts, usage, feature advisor.</li>
<li><span class="nfe">NEW FOR EXAM</span> <b>Per-user/group external access policies</b> with domain allow/block lists (GA September 2025).</li>
<li><span class="nfe">NEW FOR EXAM</span> <b>Private channels</b>: up to the 1,000-channel team limit, 5,000 members, meetings supported, and compliance moved to the team's group (migration late 2025 through spring 2026).</li>
</ul>`},
{id:'meetnews', h:'Teams Premium, meetings and webinar updates', html:`
<ul>
<li><span class="nfe">NEW FOR EXAM</span> <b>April 1, 2026 licensing</b>: advanced town hall and webinar features moved from Teams Premium to Teams Enterprise; Teams Enterprise town halls: 3,000 engaged / 10,000 view-only; <b>Attendee Capacity Pack</b> to 100,000; Teams Premium Legacy for pre-April purchases.</li>
<li><span class="nfe">NEW FOR EXAM</span> Teams Premium now focuses on advanced meeting protection, intelligent recap/translation, branding, custom policy packages, advanced virtual appointments and the Queues app.</li>
<li><span class="nfe">NEW FOR EXAM</span> <b>Town hall 1080p</b> via events policy <code>-TownhallMaxResolution Max1080p</code>; ultra-low latency streaming; Microsoft eCDN; town hall insights.</li>
<li><span class="nfe">NEW FOR EXAM</span> <b>Teams Live Events retirement</b>: no new scheduling after June 30, 2026; existing scheduled events continue through February 28, 2027.</li>
<li><span class="nfe">NEW FOR EXAM</span> <b>Microsoft Mesh retired</b> on December 1, 2025 (apps, website, Immersive space (3D) view); replaced by <b>immersive events in Teams</b>, controlled by the events policy <code>ImmersiveEvents</code> setting and included with Teams Enterprise since April 2026.</li>
<li><span class="nfe">NEW FOR EXAM</span> <b>Recording ownership</b>: non-channel recordings save to the organizer's OneDrive (fallback co-organizer → initiator); the recording-initiator policy was retired in 2025.</li>
</ul>`},
{id:'phonenews', h:'Teams Phone updates', html:`
<ul>
<li><span class="nfe">NEW FOR EXAM</span> <b>Teams Phone Agent</b>: AI receptionist on auto attendants (natural-language Q&amp;A, appointments, routing, 60+ languages). Frontier preview June 2026; GA from September 30, 2026; usage billed through Copilot Credits with spending policies in the Microsoft 365 admin center.</li>
<li><span class="nfe">NEW FOR EXAM</span> <b>AI Agent resource account type</b> to attach Copilot Studio voice agents directly to Teams Phone numbers (preview).</li>
<li><span class="nfe">NEW FOR EXAM</span> <b>Call queues</b>: automatic recording and compliance recording configuration in TAC (August 2026); templates step in the setup wizard.</li>
<li><span class="nfe">NEW FOR EXAM</span> <b>Queues app</b>: auto attendant shared voicemail (August 2026) and Copilot call recap for recorded queue calls (September 2026).</li>
<li><span class="nfe">NEW FOR EXAM</span> <b>Personal Attendant</b> (Frontier): AI handling of incoming calls on behalf of a Copilot user.</li>
</ul>`},
{id:'devnews', h:'Teams Rooms and devices updates', html:`
<ul>
<li><span class="nfe">NEW FOR EXAM</span> <b>Android device management moved to the Teams Rooms Pro Management portal</b>: Teams Rooms on Android, phones, panels and SIP devices (GA public cloud July 2026; overlapping TAC capabilities deprecated by September 2026).</li>
<li><span class="nfe">NEW FOR EXAM</span> <b>License-based management</b> in PMP (March 2026): Basic → inventory and automatic updates; Pro → remote configuration, history and advanced monitoring.</li>
<li><span class="nfe">NEW FOR EXAM</span> <b>Teams Shared Space licensing</b> for shared desks in Microsoft Places (April 2026).</li>
</ul>`},
{id:'secnews', h:'Copilot, security, compliance and client updates', html:`
<ul>
<li><span class="nfe">NEW FOR EXAM</span> <b>Copilot meeting policy values</b>: On, On with saved transcript required, On with transcript saved by default, Off — only “saved transcript required” is enforceable.</li>
<li><span class="nfe">NEW FOR EXAM</span> <b>Copilot without transcription</b> became the default experience for many tenants (late 2025); conversation history persists during the meeting.</li>
<li><span class="nfe">NEW FOR EXAM</span> <b>Messaging safety</b> protections (malicious URL scanning, weaponizable file types, impersonation detection) and the security detections report.</li>
<li><span class="nfe">NEW FOR EXAM</span> <b>Private channel compliance</b>: retention, DLP and holds now scope to the team's group mailbox.</li>
<li><span class="nfe">NEW FOR EXAM</span> <b>VDI</b>: SlimCore-based optimization is the strategic path; WebRTC-based optimization on Windows endpoints reaches end of support October 1, 2026 and end of availability April 1, 2027.</li>
<li><span class="nfe">NEW FOR EXAM</span> <b>Office 365 connectors in Teams</b> stopped working May 18–22, 2026 → Workflows webhooks.</li>
</ul>`},
{id:'retire', h:'Licensing changes and retirements timeline', html:`
<div class="tblwrap"><table class="tbl"><thead><tr><th>Date</th><th>Change</th></tr></thead><tbody>
<tr><td>May 5, 2025</td><td>Consumer Skype retired (users moved to Teams Free)</td></tr>
<tr><td>July 1, 2025</td><td>Classic Teams client end of availability</td></tr>
<tr><td>Mid-2025</td><td>App permission policies fully replaced by app centric management</td></tr>
<tr><td>October 14, 2025</td><td>Skype for Business Server 2015/2019 end of support (Subscription Edition is the supported on-prem version)</td></tr>
<tr><td>November 1, 2025</td><td>Microsoft 365/Office 365 suites with Teams available worldwide again; Teams Enterprise price change</td></tr>
<tr><td>December 1, 2025</td><td>Microsoft Mesh retired → immersive events in Teams</td></tr>
<tr><td>April 1, 2026</td><td>Teams licensing update (events features to Enterprise, Attendee Capacity Pack, Places, Teams Shared Space)</td></tr>
<tr><td>May 18–22, 2026</td><td>Office 365 connectors in Teams disabled</td></tr>
<tr><td>June 30, 2026</td><td>Teams Live Events — no new scheduling (existing events run until Feb 28, 2027)</td></tr>
<tr><td>July 1, 2026</td><td>Microsoft 365 suite price changes</td></tr>
<tr><td>July–September 2026</td><td>Android Teams device management moves to Pro Management portal</td></tr>
<tr><td>September 30, 2026</td><td>Teams Phone Agent general availability begins</td></tr>
<tr><td>October 1, 2026</td><td>WebRTC VDI optimization (Windows endpoints) end of support</td></tr>
<tr><td>October 2026</td><td>Admin app in Teams/Outlook/Microsoft365.com retired (use the admin centers or Microsoft 365 Admin Agent)</td></tr>
<tr><td>October 27, 2026</td><td>MS-700 skills measured refresh</td></tr>
<tr><td>April 1, 2027</td><td>WebRTC VDI optimization end of availability (Windows endpoints)</td></tr>
</tbody></table></div>`},
{id:'tips', h:'Exam tips for recent changes', html:`
<ul>
<li>Exams rarely test exact dates — they test <b>which feature to use now</b>. Pick town halls, Workflows, ACM, SlimCore, immersive events, PMP.</li>
<li>Expect licensing distractors built on the old Premium boundary.</li>
<li>Questions may still describe TAC device pages; answer with the concept (configuration profile, tag, remote sign-in) — it applies in both portals.</li>
<li>For Copilot, read carefully whether the requirement says “cannot override” (enforced) or “by default”.</li>
</ul>`},

{id:'A08', t:'multi', tp:'gov', lv:'M', cs:'fabrikam', q:'<p>You need to meet Fabrikam\'s requirement that only members of <i>Team-Creators</i> can create Microsoft 365 groups. Which two settings should you configure? Each correct answer presents part of the solution.</p>', o:['Set EnableGroupCreation to false in the Group.Unified directory setting','Set GroupCreationAllowedGroupId to the object ID of Team-Creators','Create a Teams policy that blocks team creation for all users','Disable SharePoint site creation in the SharePoint admin center','Remove the Microsoft Teams service plan from store employees'], a:[0,1], w:['Required — turns off creation for everyone not exempted.','Required — the allowed group can still create groups.','Teams policies don\'t control group creation.','Doesn\'t block Microsoft 365 group/team creation.','Would remove Teams from store staff.'], x:'Group creation is restricted tenant-wide through the Group.Unified directory setting using Microsoft Graph PowerShell; it needs Entra ID P1.', r:['creation']},
{id:'A09', t:'match', tp:'gov', lv:'M', cs:'fabrikam', q:'<p>Match each Fabrikam governance requirement to the feature that meets it.</p>', pool:['Microsoft 365 group expiration policy','Group naming policy','Group.Unified directory settings','Retention policy','Access review'], pt:'Features', tt:'Requirement', m:[

{id:'A10', t:'yn', tp:'gov', lv:'M', q:'<p>A team is archived from the Teams admin center with “Make the SharePoint site read-only for team members” selected. Evaluate each statement.</p>', s:[

{id:'A11', t:'single', tp:'gov', lv:'H', sc:'trbl', q:'<p>A team was deleted eight days ago. You restore its Microsoft 365 group from the Microsoft Entra admin center. Two hours later, users report that the team still doesn\'t appear in Teams. What should you do?</p>', o:['Run New-Team -GroupId to recreate the team','Wait — restored teams can take up to 24 hours to reappear in Teams','Restore the SharePoint site from the second-stage recycle bin','Unarchive the team in the Teams admin center'], a:1, w:['Creating a new team isn\'t needed and could conflict.','Correct.','The site is restored with the group.','The team wasn\'t archived.'], x:'Restoring the group restores the team, channels, files and conversations; replication into Teams can take up to 24 hours.', r:['restore','archive']},
{id:'A12', t:'hot', tp:'policy', lv:'H', q:'<p>User Lee has no direct meeting policy assignment. Lee is a member of <b>Group1</b> (meeting policy <i>P1</i>, rank 2) and <b>Group2</b> (meeting policy <i>P2</i>, rank 1). The Global policy is <i>P0</i>. Complete the statements.</p>', h:[
 {l:'Effective meeting policy for Lee', p:[{o:['P0','P1','P2'], a:2, w:'Rank 1 has the highest precedence among group assignments.'}]},
 {l:'Cmdlet that shows the effective policy and its source', p:[{o:['Get-CsUserPolicyAssignment','Get-CsTeamsMeetingPolicy','Get-CsGroupPolicyAssignment','Get-Team'], a:0, w:'Shows the effective policy and whether it came from a group.'}]}],
 x:'Precedence: direct › group (lowest rank number wins) › Global. Get-CsGroupPolicyAssignment lists group assignments but not a user\'s effective result.', r:['assignpol']},
{id:'A13', t:'single', tp:'policy', lv:'M', q:'<p>You must assign a new messaging policy to 3,500 users listed in a CSV file as a one-time change. The users are not in a common group. What is the most efficient method?</p>', o:['Run Grant-CsTeamsMessagingPolicy in a loop for each user','Run New-CsBatchPolicyAssignmentOperation','Create a custom policy package','Change the Global (org-wide default) messaging policy'], a:1, w:['Works, but slow and throttled.','Correct — batches up to 5,000 users per operation.','Packages require Teams Premium for custom content and still need assignment.','Would affect every user.'], x:'Batch policy assignment handles up to 5,000 users per batch and runs asynchronously (check with Get-CsBatchPolicyAssignmentOperation).', r:['assignpol']},
{id:'A14', t:'multi', tp:'policy', lv:'M', q:'<p>Which two statements about group policy assignment in Teams are true? Each correct answer presents a complete solution.</p>', o:['When a user is removed from a group, the policy assigned through that group no longer applies to the user','A group policy assignment overrides a direct assignment to the same user','When a user belongs to several groups with the same policy type assigned, the assignment with the lowest rank number applies','Group policy assignment changes always apply instantly'], a:[0,2], w:['Correct — the next applicable policy (or Global) takes over.','Direct assignments win.','Correct.','Propagation can take hours (up to 24 or more for large groups).'], x:'Group assignment is dynamic and ranked, but always below direct assignment in precedence.', r:['assignpol']},
{id:'A15', t:'single', tp:'ext', lv:'M', cs:'contoso', q:'<p>Which solution meets Contoso\'s requirement for collaboration between selected R&amp;D users and Fabrikam Labs?</p>', o:['Invite Fabrikam Labs users as guests to an R&amp;D team','Create a shared channel and configure B2B direct connect between Contoso and Fabrikam Labs','Add fabrikamlabs.com to the external access allow list','Create a multitenant organization with Fabrikam Labs'], a:1, w:['Creates guest accounts — explicitly not allowed.','Correct — shared channels use B2B direct connect, no guest accounts.','External access allows chat/calls but not a shared channel workspace.','MTO is for tenants your organization owns.'], x:'Shared channels let external users collaborate from their own tenant via B2B direct connect.', r:['sharedch','b2bdc']},
{id:'A16', t:'order', tp:'ext', lv:'H', cs:'contoso', q:'<p>Teams policies already allow inviting external users to shared channels. Order the actions to let Contoso R&amp;D users share a channel with Fabrikam Labs users.</p>', it:['In Contoso\'s Microsoft Entra cross-tenant access settings, add Fabrikam Labs as an organization','Configure Contoso outbound B2B direct connect for the R&amp;D group and the Office 365 application','Fabrikam Labs configures inbound B2B direct connect to allow Contoso users','Create the shared channel and share it with the Fabrikam Labs user'], dx:['Turn on guest access in the Teams admin center','Invite Fabrikam Labs users as B2B guests in Entra'], dw:['Shared channels don\'t use guest access.','Guests aren\'t required — and are prohibited in the case.'], x:'B2B direct connect must be allowed in both directions: your outbound and the partner\'s inbound (plus the reverse if Fabrikam will invite Contoso users).', r:['b2bdc','xtap','sharedch']},
{id:'A17', t:'single', tp:'ext', lv:'M', q:'<p>Users must be able to start chats with people who use personal (unmanaged) Teams accounts, but people with personal accounts must not be able to start conversations with your users. What should you configure in External access?</p>', o:['Turn off communication with Teams accounts not managed by an organization','Keep communication with unmanaged Teams accounts on, and turn off “External users with Teams accounts not managed by an organization can contact users in my organization”','Block all external domains','Add consumer domains to the blocked domains list'], a:1, w:['Blocks all communication, including outbound.','Correct.','Affects federated organizations, not unmanaged accounts.','Unmanaged accounts aren\'t controlled by domain lists.'], x:'Unmanaged Teams account settings include whether your users can communicate and whether those accounts can initiate.', r:['extaccess']},
{id:'A18', t:'multi', tp:'ext', lv:'M', sc:'trbl', q:'<p>Guests in the Marketing team can read channel conversations but receive “access denied” when opening the Files tab. Which two settings could cause this? Each correct answer presents a complete solution.</p>', o:['SharePoint organization-level external sharing is set to Only people in your organization','The Marketing team site\'s sharing setting is set to Only people in your organization','The partner\'s domain is blocked in Teams external access','Guest calling is turned off in Teams guest access settings','The meeting policy disables anonymous join'], a:[0,1], w:['Correct — blocks guest file access tenant-wide.','Correct — site-level setting for this team.','External access is federation, not guest file access.','Calling settings don\'t affect files.','Unrelated to files.'], x:'Guest file access depends on SharePoint sharing at the org and site level (sites can\'t be more permissive than the org).', r:['spsharing','guestcheck']},
{id:'A19', t:'single', tp:'ext', lv:'H', q:'<p>A guest from a former vendor must immediately lose access to every team and resource in your tenant. What should you do?</p>', o:['Remove the guest from each team in the Teams admin center','Block the vendor\'s domain in Teams external access','Delete the guest user account in Microsoft Entra ID (or the Microsoft 365 admin center)','Run an access review next quarter'], a:2, w:['Leaves the guest object and access to other resources.','External access doesn\'t govern guest accounts.','Correct — removes the guest from the tenant and all teams.','Not immediate.'], x:'Removing a guest from the tenant (deleting the account) removes access everywhere; removing from a team only affects that team.', r:['guest']},
{id:'A20', t:'hot', tp:'ext', lv:'H', nfe:true, q:'<p>Only members of the Compliance group may communicate with the external domain <code>regulator.example</code>; everyone else keeps the organization\'s external access settings. Complete the PowerShell.</p>', h:[
 {c:true, p:['New-CsExternalAccessPolicy -Identity "Regulator" -EnableFederationAccess $true -CommunicationWithExternalOrgs ', {o:['AllowSpecificExternalDomains','OrganizationDefault','BlockAllExternalDomains'], a:0, w:'Restricts the policy\'s users to the listed domains.'}, ' -AllowedExternalDomains @("regulator.example")']},
 {c:true, p:['Grant-CsExternalAccessPolicy -PolicyName "Regulator" ', {o:['-Group compliance@contoso.com -Rank 1','-Global','-Identity regulator.example'], a:0, w:'Group assignment targets the Compliance group; Global would affect everyone.'}]}],
 x:'Custom external access policies with domain control (GA September 2025) can be assigned to users or groups; other users continue to inherit the org-wide settings.', r:['extaccess']},
{id:'A21', t:'single', tp:'iam', lv:'M', q:'<p>Teams administrators must use the Teams Administrator role only when needed, for a maximum of four hours, with approval from a security lead. What should you implement?</p>', o:['Microsoft Entra Privileged Identity Management (PIM)','An access review of the Teams Administrator role','A Conditional Access policy requiring MFA','Administrative units'], a:0, w:['Correct — just-in-time activation with duration and approval (Entra ID P2).','Reviews attest assignments periodically but don\'t provide JIT activation.','MFA doesn\'t limit duration or require approval.','AUs scope management, not time-bound activation.'], x:'PIM provides eligible role assignments with time-bound activation, approval and justification.', r:['roles']},
{id:'A22', t:'multi', tp:'iam', lv:'H', q:'<p>All users must use MFA for Teams. Teams Rooms accounts can\'t perform MFA and must sign in only from Intune-compliant devices. Which two Conditional Access policies should you create? Each correct answer presents part of the solution.</p>', o:['Target the Office 365 app for all users, exclude the Teams Rooms accounts group, grant access requiring MFA','Target the Office 365 app for the Teams Rooms accounts group, grant access requiring a compliant device','Enable per-user MFA for the Teams Rooms accounts','Allow legacy authentication for Teams Rooms accounts'], a:[0,1], w:['Correct.','Correct.','Rooms can\'t answer MFA prompts.','Legacy auth weakens security and isn\'t needed.'], x:'Rooms are protected with device-based CA instead of interactive MFA.', r:['ca','roomsca']},
{id:'A23', t:'single', tp:'iam', lv:'M', q:'<p>Guests from a trusted partner already complete MFA in their home tenant. They are prompted for MFA again when accessing your teams. You need to avoid the second prompt while keeping your MFA policy. What should you configure?</p>', o:['Exclude all guests from Conditional Access','In cross-tenant access settings, configure inbound trust settings for the partner to trust MFA from its tenant','Convert the guests to members','Enable email one-time passcode'], a:1, w:['Removes protection.','Correct.','Doesn\'t change MFA behavior and grants more access.','OTP is an authentication method for guests without Entra accounts.'], x:'Inbound trust settings can accept MFA, compliant-device and hybrid-joined claims from partner tenants.', r:['xtap']},
{id:'A24', t:'order', tp:'sec', lv:'H', cs:'contoso', q:'<p>You must implement Contoso\'s requirement that R&amp;D users cannot communicate with Sales users. Order the actions.</p>', it:['Verify the Department attribute is populated for all users','Create organization segments for R&amp;D and Sales with New-OrganizationSegment','Create information barrier policies blocking each segment from the other','Run Start-InformationBarrierPoliciesApplication'], dx:['Create a DLP policy for Teams chat','Create a communication compliance policy'], dw:['DLP protects sensitive data, it doesn\'t block communication between groups.','Communication compliance detects and reviews; it doesn\'t prevent.'], x:'Information barriers: attributes → segments → policies (both directions) → apply.', r:['ib','ibteams']},
{id:'A25', t:'single', tp:'sec', lv:'E', cs:'contoso', q:'<p>Which retention configuration meets Contoso\'s requirement for Teams chat messages?</p>', o:['A retention policy on the Teams chats location for all users, retaining items for 7 years','A retention policy on the Teams channel messages location for all teams, retaining for 7 years','A retention policy on Exchange mailboxes only','A retention label applied to the team\'s SharePoint site'], a:0, w:['Correct.','Covers channel messages, not chats.','Teams chats have their own location.','Covers files, not chat messages.'], x:'Teams chats (1:1/group) are retained through the Teams chats location, which targets users.', r:['retention']},
{id:'A26', t:'single', tp:'sec', lv:'M', q:'<p>Malicious files uploaded to Teams channels must be detected and blocked from being opened. Your tenant has Microsoft Defender for Office 365 Plan 1. What should you enable?</p>', o:['Safe Links for Teams','Safe Attachments for SharePoint, OneDrive, and Microsoft Teams','Zero-hour auto purge for Teams','A DLP policy for Teams chat and channel messages'], a:1, w:['Protects URLs, not files.','Correct.','ZAP removes malicious messages and is a Plan 2 capability.','DLP detects sensitive info, not malware.'], x:'Safe Attachments for SharePoint, OneDrive and Teams detects malicious files and blocks them from being opened.', r:['safeatt','mdoteams']},
{id:'A27', t:'multi', tp:'sec', lv:'H', q:'<p>Which two settings can a sensitivity label for containers enforce on a team? Each correct answer presents a complete solution.</p>', o:['Team privacy (public or private)','Whether owners can add guests to the team','Retention period for channel messages','Meeting recording expiration','Copilot availability in the team\'s meetings'], a:[0,1], w:['Correct.','Correct (external user access).','Retention uses retention policies/labels.','Meeting policy setting.','Meeting policy/options.'], x:'Container labels control privacy, external user access, external sharing for the site, unmanaged device access and related settings.', r:['labels']},
{id:'A28', t:'yn', tp:'sec', lv:'M', q:'<p>Evaluate each statement about Microsoft Purview solutions for Teams.</p>', s:[
 {t:'Communication compliance can detect harassing language in Teams chats and let reviewers remove the message.', a:true, w:'Reviewers can remediate, including removing messages from Teams.'},
 {t:'Insider risk management is the solution that prevents two departments from chatting.', a:false, w:'That is information barriers.'},
 {t:'A DLP policy can block a Teams message containing credit card numbers sent to external users.', a:true, w:'DLP for Teams chat and channel messages supports block for external recipients.'}],
 x:'Prevent communication → IB; detect/review behavior → communication compliance; protect sensitive data → DLP; risky user activity → IRM.', r:['cc','irm','dlp','ib']},
{id:'A29', t:'single', tp:'dev', lv:'M', cs:'fabrikam', q:'<p>Which license should Fabrikam assign to meet the meeting-room requirement in the case study?</p>', o:['Teams Rooms Basic','Teams Rooms Pro','Teams Shared Devices','Teams Premium'], a:1, w:['Basic lacks monitoring and incident management (and covers only 25 rooms).','Correct — includes Pro Management monitoring and incident management.','For common area phones and panels.','Meeting features for users, not rooms.'], x:'Teams Rooms Pro provides remote monitoring, incident management, remote configuration and advanced features.', r:['roomslic','pmp']},
{id:'A30', t:'multi', tp:'dev', lv:'M', cs:'fabrikam', q:'<p>You need to configure Fabrikam\'s break-room Teams phones. Which two actions should you perform? Each correct answer presents part of the solution.</p>', o:['Assign a Teams Shared Devices license to each phone\'s account','Assign an IP phone policy with SignInMode CommonAreaPhoneSignIn','Assign a Teams Rooms Basic license to each phone\'s account','Assign a Teams Premium license','Enable guest access'], a:[0,1], w:['Correct.','Correct — common area phone experience.','Rooms licenses are for meeting rooms.','Not needed.','Not related.'], x:'Common area phones = Teams Shared Devices + CAP sign-in mode (plus a number and calling policy if needed).', r:['cap']},
{id:'A31', t:'order', tp:'dev', lv:'M', q:'<p>You are deploying a new Teams Rooms on Windows system. Order the actions to prepare its account.</p>', it:['Create a room mailbox with New-Mailbox -Room -EnableRoomMailboxAccount $true','Configure Set-CalendarProcessing -AutomateProcessing AutoAccept','Assign a Teams Rooms Pro license to the account','Sign in to the Teams Rooms device with the account'], dx:['Assign a Teams Phone Resource Account license','Enable per-user MFA on the account'], dw:['That license is for auto attendant/call queue resource accounts.','Rooms can\'t complete MFA; use CA with device compliance.'], x:'Room account: Exchange room mailbox with enabled account → calendar processing → Teams Rooms license → device sign-in.', r:['roomsacct']},
{id:'A32', t:'single', tp:'dev', lv:'H', q:'<p>Most Teams Android devices must receive software updates 30 days after release, while ten pilot rooms must update as soon as updates are available. You must minimize effort. What should you do?</p>', o:['Disable automatic updates and update devices manually','Tag the pilot devices; set their automatic update option to As soon as possible and set all other devices to Defer for 30 days','Use SkypeSettings.xml on each device','Create an Intune Windows Update ring'], a:1, w:['Manual updates add effort.','Correct — tags enable bulk targeting of update settings.','XML is for Teams Rooms on Windows.','Windows Update rings don\'t manage Teams Android device software.'], x:'Teams device update management supports immediate or deferred updates; device tags help target groups of devices.', r:['devmgmt']},
{id:'A33', t:'single', tp:'lic', lv:'M', nfe:true, q:'<p>In November 2026, users licensed with Microsoft 365 E3 (with Teams) need to host town halls for up to 2,000 attendees with Microsoft eCDN, 1080p video and Q&amp;A. Which additional license is required?</p>', o:['Teams Premium','An Attendee Capacity Pack','None — Teams Enterprise includes these town hall features','Teams Essentials'], a:2, w:['Not required for these features since April 1, 2026.','Only needed above 3,000 engaged attendees.','Correct.','Not an add-on for Enterprise suites.'], x:'Since April 1, 2026, advanced town hall features (eCDN, 1080p, ULL, insights, engagement) are part of Teams Enterprise for up to 3,000 engaged attendees.', r:['events','townhall']},
{id:'A34', t:'single', tp:'lic', lv:'H', nfe:true, q:'<p>A company bought Teams Premium in January 2026 with a term ending in December 2026. In October 2026 it wants to host a town hall for 60,000 attendees with Q&amp;A. What is required?</p>', o:['An Attendee Capacity Pack for the organizer','Nothing additional until the Teams Premium term ends','Teams Rooms Pro','The event can\'t exceed 10,000 attendees'], a:1, w:['Not needed until renewal.','Correct — pre-April 2026 Premium keeps up to 100,000-attendee town halls until the term ends.','Unrelated.','Legacy entitlement allows more.'], x:'Teams Premium purchased before April 1, 2026 keeps prior entitlements (including 100,000 attendees) until expiry; after renewal, an Attendee Capacity Pack is needed above 3,000 engaged attendees.', r:['events']},
{id:'A35', t:'hot', tp:'teams', lv:'H', q:'<p>A developer must add Teams to an existing Microsoft 365 group by using Microsoft Graph. Complete the request.</p>', h:[{c:true, p:[{o:['PUT','POST','PATCH'], a:0, w:'Creating a team for an existing group uses PUT.'}, ' https://graph.microsoft.com/v1.0/', {o:['groups/{group-id}/team','teams','teams/{team-id}/clone'], a:0, w:'The team resource under the group.'}]}], x:'PUT /groups/{id}/team creates a team from a group (PowerShell equivalent: New-Team -GroupId). POST /teams creates a new team; /clone copies a team.', r:['graph']},
{id:'A36', t:'single', tp:'teams', lv:'E', q:'<p>Head-office users must not see the Microsoft-provided “Organize a store” team template when they create teams. Store managers must still see it. What should you use?</p>', o:['Delete the template','A template policy that hides the template, assigned to head-office users','A Teams policy','An app setup policy'], a:1, w:['Microsoft templates can\'t be deleted, and deletion affects everyone.','Correct.','Teams policies control channels.','Setup policies control apps.'], x:'Template policies show or hide templates per user or group.', r:['templatepol']},
{id:'A37', t:'multi', tp:'teams', lv:'M', q:'<p>A user creates a new team “From an existing team”. Which two items are copied from the original team? Each correct answer presents a complete solution.</p>', o:['Channels','Tabs','Channel conversations','Files in channels','Planner task contents'], a:[0,1], w:['Copied.','Copied.','Not copied.','Not copied.','Content isn\'t copied.'], x:'Copying a team can include channels, tabs, apps, settings and (optionally) members — never content.', r:['manageteams','graph']}

{id:'A38', t:'single', tp:'teams', lv:'H', cs:'fabrikam', q:'<p>Which approach meets Fabrikam\'s requirement for store teams with the least administrative effort?</p>', o:['Create one org-wide team per store','Create a custom team template and ask store managers to create their teams','Use Deploy frontline dynamic teams in the Teams admin center based on the officeLocation attribute','Run a nightly Microsoft Graph script that adds and removes store members'], a:2, w:['Org-wide teams include everyone and are limited to five.','Manual creation and static membership.','Correct — one team per location with dynamic membership.','Works but requires custom code and maintenance.'], x:'Frontline dynamic teams at scale create a team per location and keep membership updated from an Entra attribute.', r:['frontline']},

{id:'A40', t:'single', tp:'chan', lv:'E', q:'<p>Engineering team members need a channel where they collaborate with the entire internal Support team. Support members must not become members of the Engineering team. What should you create?</p>', o:['A private channel and add Support members','A shared channel shared with the Support team','A standard channel and add Support as guests','A new team for both departments'], a:1, w:['Private channel members must be team members.','Correct — shared channels can be shared with other teams.','Support users are internal, not guests; they would also become team members.','Not required.'], x:'Shared channels can include individuals or whole teams (internal or external) without team membership.', r:['sharedch']},

{id:'A42', t:'single', tp:'chan', lv:'E', q:'<p>Students must not be able to edit or delete messages they send; teachers must keep these abilities. What should you configure?</p>', o:['A messaging policy for students','A Teams policy for students','A meeting policy for students','A sensitivity label for class teams'], a:0, w:['Correct.','Controls channel creation/sharing.','Meeting settings.','Container settings.'], x:'Messaging policies control edit/delete of sent messages, Giphy, read receipts and more.', r:['msgpol']},
{id:'A43', t:'hot', tp:'chan', lv:'M', q:'<p>Users in the Regulated policy must not edit sent messages, and read receipts must be on for everyone with no user choice. Complete the command.</p>', h:[{c:true, p:['Set-CsTeamsMessagingPolicy -Identity Regulated -', {o:['AllowUserEditMessage','AllowOwnerDeleteMessage','AllowUserChat'], a:0, w:'Controls editing of sent messages.'}, ' $false -ReadReceiptsEnabledType ', {o:['UserPreference','Everyone','None'], a:1, w:'Everyone = on for everyone; UserPreference = user controlled.'}]}], x:'Messaging policy parameters map to TAC settings: edit sent messages, read receipts (user controlled / on for everyone / off).', r:['msgpol']},

{id:'A56', t:'single', tp:'copilot', lv:'M', nfe:true, q:'<p>For Copilot users, Copilot should be available during and after meetings by default, but organizers must be able to choose “Only during the meeting” for sensitive meetings. Which meeting policy value?</p>', o:['On','On with saved transcript required','On with transcript saved by default','Off'], a:2, w:['Default is Only during the meeting.','Organizers can\'t change it.','Correct — EnabledWithTranscriptDefaultOn.','Defaults to Off.'], x:'“On with transcript saved by default” sets During and after the meeting as the default while allowing organizers to change it.', r:['copilot']},

{id:'A60', t:'single', tp:'phone', lv:'M', q:'<p>Users move between floors and buildings. Emergency calls must automatically include the caller\'s current location. What should you configure?</p>', o:['A static emergency address on each user\'s number only','Dynamic emergency calling: trusted IPs and network identifiers (subnets, Wi-Fi access points) mapped to emergency locations','A caller ID policy','A dial plan with emergency normalization'], a:1, w:['Static addresses don\'t follow the user.','Correct.','Unrelated.','Normalization doesn\'t determine location.'], x:'Dynamic emergency calling uses the network topology / LIS to determine location from the client\'s network.', r:['dynemergency']},

{id:'A73', t:'single', tp:'trbl', lv:'M', sc:'trbl', q:'<p>Users at a partner company can join your meetings only as anonymous users and can\'t chat or call your users. Other external organizations work normally. What is the most likely cause?</p>', o:['The partner\'s domain is blocked (or not on the allow list) in Teams external access','Guest access is disabled','Anonymous join is disabled','Information barriers are applied'], a:0, w:['Correct.','Guest access affects team membership, not federation.','They can join anonymously, so it\'s enabled.','IB is internal.'], x:'External access controls federated chat, calls and presence; without it, partner users can still join meetings anonymously if allowed.', r:['extaccess']},

/* ---------------- State ---------------- */
function defState(){ return {v:1, theme:null, study:{}, runs:{}, last:null}; }
let memOnly = false;
function load(){
  try { const raw = localStorage.getItem(LS_KEY); if (raw) { const o = JSON.parse(raw); if (o && o.v === 1) return Object.assign(defState(), o); } }
  catch (e) { memOnly = true; }
  return defState();
}
let S = load();
let saveT = null;
function flush(){ clearTimeout(saveT); saveT = null; try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { memOnly = true; } }

window.addEventListener('pagehide', () => { if (saveT) flush(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && saveT) flush(); });

/* ---------------- RNG ---------------- */
function hash(str){ let h = 2166136261 >>> 0; for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ let a = seed >>> 0; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffled(arr, seed){ const a = arr.slice(), r = rng(seed); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------------- Data indexes ---------------- */

function confirmBox(title, text, ok, danger){
  return new Promise(res => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mdlT"><h3 id="mdlT">${esc(title)}</h3><p class="muted">${esc(text)}</p><div class="row"><button class="btn" data-r="0">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" data-r="1">${esc(ok)}</button></div></div>`;
    document.body.appendChild(bg);
    const done = v => { bg.remove(); res(v); };

/* ---------------- Progress computations ---------------- */
function studyState(n){ if (!S.study[n]) S.study[n] = {sec:{}}; return S.study[n]; }
function tabProgress(t){
  const st = S.study[t.n] || {sec:{}}; const total = t.sections.length + 1;

}
function runStats(key, qs){
  const r = S.runs[key] || {ans:{}}; let a = 0, c = 0;
  qs.forEach(q => { const x = r.ans && r.ans[q.id]; if (x){ a++; if (x.c) c++; } });
  return {answered:a, correct:c, total:qs.length, p:pct(c, a)};
}
function allAnswered(filterSrc){
  const out = [];
  Object.keys(S.runs).forEach(k => {

    Object.keys(r.ans).forEach(id => { const e = QIX[id]; if (e) out.push({q:e.q, src:e.src, c:!!r.ans[id].c}); });

}
function topicStats(list){
  const m = {}; Object.keys(D.topics).forEach(k => m[k] = {k, a:0, c:0});

}
function domainStats(list){
  const m = {1:{a:0,c:0},2:{a:0,c:0},3:{a:0,c:0},4:{a:0,c:0}};
  list.forEach(x => { const t = D.topics[x.q.tp]; if (t){ m[t.d].a++; if (x.c) m[t.d].c++; } });

function readiness(){
  const totalSecs = D.tabs.reduce((s, t) => s + t.sections.length, 0);
  const doneSecs = D.tabs.reduce((s, t) => { const st = S.study[t.n]; return s + (st ? t.sections.filter(x => st.sec[x.id]).length : 0); }, 0);
  const study = totalSecs ? doneSecs / totalSecs : 0;
  let kcC = 0, kcT = 0; D.tabs.forEach(t => { const rs = runStats('kc' + t.n, t.kc); kcC += rs.correct; kcT += rs.total; });

  const r = (size - 14) / 2, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(100, p)) / 100);
  const col = cls === 'ok' ? 'var(--ok)' : cls === 'bad' ? 'var(--bad)' : cls === 'warn' ? 'var(--warn)' : 'var(--brand)';
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="10"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg><div class="rv"><b>${p}%</b><span>${esc(label || '')}</span></div></div>`;
}
const barCls = p => p >= 80 ? 'ok' : p >= 70 ? '' : p >= 50 ? 'warn' : 'bad';

/* ---------------- Router ---------------- */
let curRoute = '';
let timerI = null;
function route(){
  const raw = decodeURIComponent(location.hash.slice(1) || '/dashboard');
  const p = raw.split('/').filter(Boolean);
  clearInterval(timerI); timerI = null;
  document.body.classList.remove('nav-open');
  const view = $('#view');
  let navKey = '/' + p.slice(0, 2).join('/');
  if (p[0] === 'study' && D.tabs[+p[1] - 1]) { viewStudy(+p[1], p[2]); }
  else if (p[0] === 'practice' && SETS[p[1]]) { viewPractice(p[1], p[2] === 'q' ? p[3] : null); }
  else if (p[0] === 'focus') { viewFocus(p[1]); navKey = '/focus'; }
  else if (p[0] === 'search') { viewSearch(p.slice(1).join('/')); navKey = '/search'; }
  else { viewDashboard(); navKey = '/dashboard'; }
  if (p[0] !== 'search' && document.activeElement !== $('#searchIn')) $('#searchIn').value = '';
  curRoute = navKey; S.last = raw; save();
  renderNav(navKey);
  if (!p[2] || p[0] === 'practice') window.scrollTo(0, 0);
  view.focus({preventScroll:true});
}

/* ---------------- Practice view ---------------- */
function viewPractice(k, qid){
  const set = SETS[k];
  let h = `<div class="container"><div class="page-h"><div><div class="eyebrow">Exam simulation · ${set.qs.length} questions</div><h1>${esc(set.title)}</h1><p>${esc(D.meta['intro' + k])}</p></div><div class="row"><span class="chip info" id="timer" title="Time spent on this set">⏱ 00:00</span></div></div><div id="runner"></div></div>`;
  $('#view').innerHTML = h;
  mountRunner({key:k, qs:set.qs, mode:'exam', title:set.title, jump:qid});
  const R = S.runs[k];
  const fmt = s => { const m = Math.floor(s / 60), x = s % 60; return (m < 10 ? '0' : '') + m + ':' + (x < 10 ? '0' : '') + x; };
  const tick = () => { const el = $('#timer'); if (el) el.textContent = '⏱ ' + fmt(R.t || 0); };
  tick();
  timerI = setInterval(() => { if (document.hidden) return; const done = Object.keys(R.ans).length >= set.qs.length; if (done) return; R.t = (R.t || 0) + 1; tick(); if (R.t % 15 === 0) save(); }, 1000);
}

/* ---------------- Quiz runner ---------------- */
let RUN = null; // {key, qs, mode, title}
const DRAFT = {};
function runState(key, qs, mode){
  let R = S.runs[key];
  const ids = qs.map(q => q.id);
  if (!R) R = S.runs[key] = {seed:(Math.random() * 1e9) | 0, order:null, ans:{}, cur:null, lv:'all', view:'all', flags:{}, t:0, showRes:false};
  const valid = R.order && R.order.length === ids.length && ids.every(id => R.order.includes(id));
  if (!valid) R.order = mode === 'exam' ? shuffled(ids, R.seed) : ids.slice();
  Object.keys(R.ans).forEach(id => { if (!ids.includes(id)) delete R.ans[id]; });
  if (!R.flags) R.flags = {};
  return R;
}
function visibleIds(R){
  return R.order.filter(id => {
    const q = QIX[id].q;
    if (R.lv !== 'all' && q.lv !== R.lv) return false;
    if (R.view === 'un' && R.ans[id]) return false;
    if (R.view === 'bad' && !(R.ans[id] && !R.ans[id].c)) return false;
    if (R.view === 'flag' && !R.flags[id]) return false;
    return true;
  });
}
function mountRunner(cfg){
  RUN = cfg; const R = runState(cfg.key, cfg.qs, cfg.mode);
  if (cfg.jump && QIX[cfg.jump]){ R.lv = 'all'; R.view = 'all'; R.cur = cfg.jump; R.showRes = false; }
  save(); renderRunner();
}
function renderRunner(){
  const cfg = RUN; if (!cfg) return; const R = S.runs[cfg.key]; const host = $('#runner'); if (!host) return;
  const vis = visibleIds(R);
  if (!R.cur || !vis.includes(R.cur)) R.cur = vis[0] || null;
  const st = runStats(cfg.key, cfg.qs);
  const exam = cfg.mode === 'exam';
  let h = '';
  if (exam){
    const passCls = st.answered ? (st.p >= PASS ? 'pass' : 'fail') : '';
    h += `<div class="statbar"><div class="stat"><div class="v">${st.answered}/${st.total}</div><div class="l">Answered</div></div><div class="stat"><div class="v">${st.correct}</div><div class="l">Correct</div></div><div class="stat ${passCls}"><div class="v">${st.answered ? st.p + '%' : '—'}</div><div class="l">Score (pass ≥ ${PASS}%)</div></div><div class="stat ${passCls}"><div class="v">${st.answered ? (st.answered === st.total ? (st.p >= PASS ? 'PASS' : 'FAIL') : (st.p >= PASS ? 'On track' : 'At risk')) : '—'}</div><div class="l">${st.answered === st.total ? 'Final result' : 'Pass/fail projection'}</div></div></div>`;
    h += `<div class="toolbar"><span class="small muted">Difficulty</span><div class="seg" role="group" aria-label="Difficulty filter">${[['all','All'],['E','Easy'],['M','Medium'],['H','Hard']].map(([v, l]) => `<button class="${R.lv === v ? 'on' : ''}" data-act="lv" data-v="${v}">${l}</button>`).join('')}</div><span class="small muted">Show</span><div class="seg" role="group" aria-label="Question filter">${[['all','All'],['un','Unanswered'],['bad','Incorrect'],['flag','Flagged']].map(([v, l]) => `<button class="${R.view === v ? 'on' : ''}" data-act="view" data-v="${v}">${l}</button>`).join('')}</div><span class="spacer"></span><button class="btn sm ${R.showRes ? 'primary' : ''}" data-act="results">${ic('chart')}${R.showRes ? 'Back to questions' : 'Results & breakdown'}</button><button class="btn sm" data-act="restart">${ic('shuffle')}Restart (new order)</button></div>`;
  }
  if (exam && R.showRes){ host.innerHTML = h + resultsHTML(cfg, R); return; }
  h += `<div class="runner ${exam ? '' : 'compact'}"><div id="qwrap">${R.cur ? qCardHTML(cfg, R, R.cur, vis) : `<div class="card empty">No questions match this filter. <button class="btn sm" data-act="view" data-v="all">Show all</button></div>`}</div>`;
  if (exam) h += `<aside class="side-panel"><div class="card"><h2 style="font-size:15px">Question navigator</h2>${paletteHTML(R, vis)}<div class="legend"><span><i style="background:var(--ok-soft);border:1px solid var(--ok)"></i>Correct</span><span><i style="background:var(--bad-soft);border:1px solid var(--bad)"></i>Incorrect</span><span><i style="background:var(--surface-2);border:1px solid var(--border)"></i>Open</span><span><i style="background:var(--warn);border-radius:50%"></i>Flagged</span></div><div class="hr"></div><div class="small muted">Keyboard: <kbd>←</kbd>/<kbd>→</kbd> navigate · <kbd>1</kbd>–<kbd>6</kbd> pick option · <kbd>Enter</kbd> submit</div></div><div class="card"><h2 style="font-size:15px">Live domain breakdown</h2>${domainMini(cfg)}</div></aside>`;
  h += `</div>`;
  if (!exam){
    const m = pct(st.correct, st.total); const lvl = st.answered < st.total ? '' : m >= 80 ? 'Mastered' : m >= 60 ? 'Developing' : 'Needs review';
    h += `<div class="row" style="margin-top:12px"><span class="small muted">${st.answered}/${st.total} answered · ${st.correct} correct</span><span class="spacer"></span>${kcPaletteHTML(R, cfg)}<button class="btn sm" data-act="restart">${ic('shuffle')}Retake</button></div>`;
    const mEl = $('#kcMastery'); if (mEl) mEl.innerHTML = st.answered ? `<span class="chip ${m >= 80 ? 'ok' : m >= 60 ? 'warn' : 'bad'}">Topic mastery ${m}%${lvl ? ' · ' + lvl : ''}</span>` : '<span class="chip">Not started</span>';
  }
  host.innerHTML = h;
  mountDnD();
}
function kcPaletteHTML(R, cfg){

/* ----- Question card ----- */
function qInstr(q){
  if (q.mi) return q.mi;
  switch (q.t){
    case 'single': return 'Select one answer.';
    case 'multi': return `Select ${q.a.length} answers. Each correct selection is worth one point.`;
    case 'yn': return 'For each statement, select Yes if the statement is true. Otherwise, select No.';
    case 'order': return 'Move the appropriate actions to the answer area and arrange them in the correct order.' + (q.dx && q.dx.length ? ' Not all actions are required.' : '');
    case 'match': return 'Drag the appropriate values to the correct targets. Each value may be used once, more than once, or not at all.';
    case 'hot': return 'To answer, select the appropriate options in the answer area.';
  }
  return '';
}
function optPerm(R, q){ return shuffled(q.o.map((_, i) => i), hash(R.seed + ':' + q.id)); }
function hotBlanks(q){ const b = []; q.h.forEach(line => line.p.forEach(part => { if (typeof part === 'object') b.push(part); })); return b; }
function draftOf(key, q){

    case 'yn': d = {v:q.s.map(() => null)}; break;
    case 'order': { const keys = q.it.map((_, i) => 'c' + i).concat((q.dx || []).map((_, i) => 'd' + i)); d = {src:shuffled(keys, hash(R.seed + 'o' + q.id)), ans:[]}; break; }
    case 'match': d = {v:q.m.map(() => null), pick:null}; break;

}
function respFromDraft(q, d){ return q.t === 'order' ? d.ans.slice() : (Array.isArray(d.v) ? d.v.slice() : d.v); }
function draftComplete(q, d){
  switch (q.t){
    case 'single': return d.v != null;
    case 'multi': return d.v.length > 0;
    case 'yn': case 'match': case 'hot': return d.v.every(x => x != null);
    case 'order': return d.ans.length > 0;
  }

}
function grade(q, r){
  switch (q.t){
    case 'single': return {c:r === q.a, p:r === q.a ? 1 : 0};
    case 'multi': { const A = q.a.slice().sort().join(','), B = r.slice().sort().join(','); const hit = r.filter(x => q.a.includes(x)).length; return {c:A === B, p:Math.max(0, hit - (r.length - hit)) / q.a.length}; }
    case 'yn': { const n = q.s.filter((s, i) => r[i] === s.a).length; return {c:n === q.s.length, p:n / q.s.length}; }
    case 'order': { const want = q.it.map((_, i) => 'c' + i); const ok = want.length === r.length && want.every((k, i) => r[i] === k); let n = 0; want.forEach((k, i) => { if (r[i] === k) n++; }); return {c:ok, p:n / want.length}; }
    case 'match': { const n = q.m.filter((m, i) => r[i] === m.a).length; return {c:n === q.m.length, p:n / q.m.length}; }
    case 'hot': { const b = hotBlanks(q); const n = b.filter((x, i) => r[i] === x.a).length; return {c:n === b.length, p:n / b.length}; }
  }
  return {c:false, p:0};
}

/* ----- Runner interactions ----- */
function curQ(){ const R = S.runs[RUN.key]; return R.cur ? QIX[R.cur].q : null; }
function rerenderQ(){
  const R = S.runs[RUN.key]; const wrap = $('#qwrap'); if (!wrap) return renderRunner();
  wrap.innerHTML = R.cur ? qCardHTML(RUN, R, R.cur, visibleIds(R)) : ''; mountDnD();
}
function go(dir){
  const R = S.runs[RUN.key]; const vis = visibleIds(R); const i = vis.indexOf(R.cur); const j = i + dir;
  if (j >= 0 && j < vis.length){ R.cur = vis[j]; save(); renderRunner(); const w = $('#runner'); if (w && w.getBoundingClientRect().top < 0) w.scrollIntoView({block:'start'}); }
}
function submit(){
  const R = S.runs[RUN.key]; const q = curQ(); if (!q || R.ans[q.id]) return;
  const d = draftOf(RUN.key, q); if (!draftComplete(q, d)) return;
  const r = respFromDraft(q, d); const g = grade(q, r);
  R.ans[q.id] = {r, c:g.c, p:g.p, at:Date.now()};
  delete DRAFT[RUN.key + '|' + q.id];
  flush(); renderRunner(); renderNav(curRoute);
  const fb = $('.fb'); if (fb) fb.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function onRunnerClick(e, el){
  const act = el.dataset.act; if (!RUN) return false; const R = S.runs[RUN.key]; const q = curQ();
  switch (act){
    case 'opt': { if (!q || R.ans[q.id]) return true; const d = draftOf(RUN.key, q); const oi = +el.dataset.oi; if (q.t === 'single') d.v = oi; else { const k = d.v.indexOf(oi); if (k >= 0) d.v.splice(k, 1); else d.v.push(oi); } e.preventDefault(); rerenderQ(); return true; }
    case 'yn': { const d = draftOf(RUN.key, q); d.v[+el.dataset.i] = el.dataset.v === '1'; rerenderQ(); return true; }
    case 'otog': { if (e.target.closest('.mv')) return true; const d = draftOf(RUN.key, q); const k = el.dataset.key; const ai = d.ans.indexOf(k); if (ai >= 0){ d.ans.splice(ai, 1); d.src.push(k); } else { d.src.splice(d.src.indexOf(k), 1); d.ans.push(k); } rerenderQ(); return true; }
    case 'oup': case 'odn': { const d = draftOf(RUN.key, q); const k = el.dataset.key; const i = d.ans.indexOf(k); const j = act === 'oup' ? i - 1 : i + 1; if (i >= 0 && j >= 0 && j < d.ans.length){ [d.ans[i], d.ans[j]] = [d.ans[j], d.ans[i]]; rerenderQ(); } return true; }
    case 'mpick': { const d = draftOf(RUN.key, q); const pi = +el.dataset.pi; d.pick = d.pick === pi ? null : pi; rerenderQ(); return true; }
    case 'mslot': { const d = draftOf(RUN.key, q); const i = +el.dataset.i; if (d.pick != null){ d.v[i] = d.pick; d.pick = null; } else d.v[i] = null; rerenderQ(); return true; }
    case 'submit': submit(); return true;
    case 'retry': { delete R.ans[q.id]; delete DRAFT[RUN.key + '|' + q.id]; save(); renderRunner(); renderNav(curRoute); return true; }
    case 'next': go(1); return true;
    case 'prev': go(-1); return true;
    case 'go': R.cur = el.dataset.id; R.showRes = false; save(); renderRunner(); return true;
    case 'flag': R.flags[q.id] = !R.flags[q.id]; save(); renderRunner(); return true;
    case 'lv': R.lv = el.dataset.v; R.cur = null; save(); renderRunner(); return true;
    case 'view': R.view = el.dataset.v; R.cur = null; save(); renderRunner(); return true;
    case 'results': R.showRes = !R.showRes; save(); renderRunner(); return true;
    case 'restart': {
      confirmBox(RUN.mode === 'exam' ? 'Restart this practice set?' : 'Retake this knowledge check?', 'All answers for this set will be cleared and the question order reshuffled. Other progress is kept.', 'Restart', true).then(ok => {
        if (!ok) return; const k = RUN.key; delete S.runs[k]; Object.keys(DRAFT).forEach(x => { if (x.startsWith(k + '|')) delete DRAFT[x]; });
        save(); if (RUN.mode === 'exam') route(); else { mountRunner(RUN); renderNav(curRoute); toast('Knowledge check reset'); }
      });
      return true;
    }
  }
  return false;
}
function mountDnD(){
  const q = RUN && curQ(); if (!q) return; const R = S.runs[RUN.key]; if (R.ans[q.id]) return;
  if (q.t === 'order'){
    const d = draftOf(RUN.key, q);
    $$('.dnd .ditem[draggable]').forEach(it => {
      it.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', it.dataset.key); e.dataTransfer.effectAllowed = 'move'; it.classList.add('dragging'); });
      it.addEventListener('dragend', () => it.classList.remove('dragging'));
    });
    $$('.dnd .dzone').forEach(z => {
      z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('over'); });
      z.addEventListener('dragleave', () => z.classList.remove('over'));
      z.addEventListener('drop', e => {
        e.preventDefault(); z.classList.remove('over'); const k = e.dataTransfer.getData('text/plain'); if (!k) return;
        const items = $$('.ditem', z).filter(x => x.dataset.key !== k); let idx = items.length;
        for (let i = 0; i < items.length; i++){ const b = items[i].getBoundingClientRect(); if (e.clientY < b.top + b.height / 2){ idx = i; break; } }
        [d.src, d.ans].forEach(a => { const i = a.indexOf(k); if (i >= 0) a.splice(i, 1); });
        const target = z.dataset.zone === 'ans' ? d.ans : d.src; const before = items[idx] ? items[idx].dataset.key : null;
        const bi = before ? target.indexOf(before) : -1; if (bi >= 0) target.splice(bi, 0, k); else target.push(k);
        rerenderQ();
      });
    });
  } else if (q.t === 'match'){
    const d = draftOf(RUN.key, q);
    $$('.pchip[draggable]').forEach(c => c.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', c.dataset.pi); e.dataTransfer.effectAllowed = 'copy'; }));
    $$('.slot').forEach(s => {
      s.addEventListener('dragover', e => { e.preventDefault(); s.classList.add('over'); });
      s.addEventListener('dragleave', () => s.classList.remove('over'));
      s.addEventListener('drop', e => { e.preventDefault(); const v = e.dataTransfer.getData('text/plain'); if (v === '') return; d.v[+s.dataset.i] = +v; d.pick = null; rerenderQ(); });
    });
  }
}

/* ---------------- Search ---------------- */
let SIDX = null;
function buildIndex(){
  const ix = [];
  D.tabs.forEach(t => t.sections.forEach(s => ix.push({k:'Study', t:`${t.n}. ${t.short} › ${s.h}`, s:strip(s.html || '') + ' ' + (s.refs || []).map(r => D.refs[r] ? D.refs[r][0] : '').join(' '), r:`/study/${t.n}/${s.id}`})));
  D.focus.sections.forEach(s => ix.push({k:'Exam focus', t:`Exam focus hub › ${s.h}`, s:strip(s.html), r:`/focus/${s.id}`}));
  const qEntry = (q, src) => { const txt = strip(q.q) + ' ' + strip(q.x) + ' ' + (q.o || []).map(strip).join(' ') + ' ' + (q.s || []).map(s => strip(s.t)).join(' ') + ' ' + (q.it || []).map(strip).join(' ') + ' ' + (q.pool || []).map(strip).join(' '); return {k:src === 'A' || src === 'B' ? 'Practice ' + src : 'Knowledge check', t:`${q.id} · ${D.topics[q.tp].name}`, s:txt, r:src === 'A' || src === 'B' ? `/practice/${src}/q/${q.id}` : `/study/${src.slice(2)}/kc`, qid:q.id, src}; };
  Object.values(QIX).forEach(e => ix.push(qEntry(e.q, e.src)));
  Object.keys(D.refs).forEach(k => ix.push({k:'Learn reference', t:D.refs[k][0], s:D.refs[k][1], url:D.refs[k][1]}));
  ix.forEach(e => e.lc = (e.t + ' ' + e.s).toLowerCase());
  return ix;
}
function viewSearch(qs){
  const q = (qs || '').trim(); $('#searchIn').value = q;
  if (!SIDX) SIDX = buildIndex();
  const terms = q.toLowerCase().split(/\s+/).filter(x => x.length > 1);
  let res = [];
  if (terms.length){ res = SIDX.map(e => { if (!terms.every(t => e.lc.includes(t))) return null; let sc = 0; terms.forEach(t => { if (e.t.toLowerCase().includes(t)) sc += 5; sc += Math.min(5, e.lc.split(t).length - 1); }); if (e.k === 'Study') sc += 2; return {e, sc}; }).filter(Boolean).sort((a, b) => b.sc - a.sc).slice(0, 80); }
  const hl = txt => { let out = esc(txt); terms.forEach(t => { out = out.replace(new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>'); }); return out; };
  const snip = s => { const lc = s.toLowerCase(); let i = -1; for (const t of terms){ i = lc.indexOf(t); if (i >= 0) break; } const st = Math.max(0, i - 80); return (st ? '…' : '') + s.slice(st, st + 240) + (s.length > st + 240 ? '…' : ''); };
  let h = `<div class="container"><div class="page-h"><div><div class="eyebrow">Search</div><h1>${q ? `Results for “${esc(q)}”` : 'Search the study guide'}</h1><p>${q ? `${res.length}${res.length === 80 ? '+' : ''} matches across study tabs, the exam focus hub, practice questions and Microsoft Learn references.` : 'Type at least two characters in the search box — try “B2B direct connect”, “Grant-CsTeamsMeetingPolicy”, “town hall” or “expiration”.'}</p></div></div><div class="sres">`;
  res.forEach(({e}) => { const href = e.url ? e.url : '#' + e.r; h += `<a href="${esc(href)}" ${e.url ? 'target="_blank" rel="noopener"' : ''}><div class="st"><span class="chip ${e.k === 'Study' ? 'brand' : e.k.startsWith('Practice') ? 'info' : ''}">${esc(e.k)}</span>${hl(e.t)}</div><div class="ss">${hl(snip(e.s))}</div></a>`; });
  if (q && !res.length) h += `<div class="card empty">No matches. Try fewer or different words.</div>`;
  h += `</div></div>`;
  $('#view').innerHTML = h;
}

/* ---------------- Export / import ---------------- */
function exportState(){
  try { const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'ms700-progress-' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast('Progress exported'); }
  catch (e) { toast('Export failed in this browser'); }
}
function importState(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = () => { const f = inp.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { const o = JSON.parse(rd.result); if (!o || o.v !== 1) throw 0; S = Object.assign(defState(), o); save(); applyTheme(); route(); toast('Progress imported'); } catch (e) { toast('That file is not a valid MS-700 progress export'); } }; rd.readAsText(f); };
  inp.click();
}

/* ---------------- Global events ---------------- */
function init(){
  applyTheme();
  $('#themeBtn').addEventListener('click', () => { const cur = document.documentElement.getAttribute('data-theme'); S.theme = cur === 'dark' ? 'light' : 'dark'; flush(); applyTheme(); });
  $('#menuBtn').addEventListener('click', () => document.body.classList.toggle('nav-open'));
  $('#overlay').addEventListener('click', () => document.body.classList.remove('nav-open'));
  let st = null;
  $('#searchIn').addEventListener('input', e => { clearTimeout(st); const v = e.target.value; st = setTimeout(() => { if (v.trim().length >= 2) location.hash = '/search/' + encodeURIComponent(v.trim()); }, 260); });
  $('#searchIn').addEventListener('keydown', e => { if (e.key === 'Enter'){ const v = e.target.value.trim(); if (v) location.hash = '/search/' + encodeURIComponent(v); } if (e.key === 'Escape'){ e.target.value = ''; e.target.blur(); } });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT'){ e.preventDefault(); $('#searchIn').focus(); return; }
    if (!RUN || !$('#qwrap')) return; const tag = document.activeElement.tagName; if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || e.ctrlKey || e.metaKey || e.altKey) return;
    if (document.querySelector('.modal-bg')) return;
    if (RUN.mode !== 'exam' && !document.activeElement.closest('#runner')) return;
    const q = curQ(); if (!q) return; const R = S.runs[RUN.key];
    if (e.key === 'ArrowRight'){ go(1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft'){ go(-1); e.preventDefault(); }
    else if (e.key === 'Enter' && !R.ans[q.id] && document.activeElement.tagName !== 'BUTTON'){ submit(); e.preventDefault(); }
    else if (/^[1-6]$/.test(e.key) && (q.t === 'single' || q.t === 'multi') && !R.ans[q.id]){ const perm = optPerm(R, q); const oi = perm[+e.key - 1]; if (oi == null) return; const d = draftOf(RUN.key, q); if (q.t === 'single') d.v = oi; else { const k = d.v.indexOf(oi); if (k >= 0) d.v.splice(k, 1); else d.v.push(oi); } rerenderQ(); }
  });
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el || !el.dataset.act) return;
    const act = el.dataset.act;
    if (act === 'secdone'){ const n = +el.dataset.n, s = el.dataset.s; const stt = studyState(n); stt.sec[s] = !stt.sec[s]; flush(); const on = stt.sec[s]; el.classList.toggle('on', on); el.setAttribute('aria-pressed', on); el.innerHTML = on ? ic('check') + ' Completed' : 'Mark complete'; const link = $(`.secnav a[href="#/study/${n}/${s}"]`); if (link) link.classList.toggle('done', on); renderNav(curRoute); const t = D.tabs[n - 1]; const p = tabProgress(t); const bar = $('.study-hero .bar i'); if (bar) bar.style.width = p.p + '%'; const lbl = $('.study-hero .row .small'); if (lbl) lbl.textContent = `${p.done}/${p.total} complete`; return; }
    if (act === 'export') return exportState();
    if (act === 'import') return importState();
    if (act === 'resetall'){ confirmBox('Reset all progress?', 'This clears study completion, knowledge checks and both practice sets in this browser. Consider exporting first.', 'Reset everything', true).then(ok => { if (!ok) return; const th = S.theme; S = defState(); S.theme = th; Object.keys(DRAFT).forEach(k => delete DRAFT[k]); save(); route(); toast('All progress reset'); }); return; }
    if (onRunnerClick(e, el)) return;
  });
  document.addEventListener('change', e => {
    const el = e.target; if (el.dataset && el.dataset.act === 'hot' && RUN){ const q = curQ(); const d = draftOf(RUN.key, q); d.v[+el.dataset.i] = el.value === '' ? null : +el.value; const sb = $('[data-act="submit"]'); if (sb) sb.disabled = !draftComplete(q, d); }
  });
  window.addEventListener('hashchange', route);
  if (!location.hash && S.last) location.replace('#' + S.last); else route();
}
document.addEventListener('DOMContentLoaded', init);
})();
