<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MS-700 Prep Studio — Managing Microsoft Teams</title>
<meta name="description" content="Self-contained MS-700 (Managing Microsoft Teams) study guide and exam practice app: 9 study tabs, 90 knowledge-check questions, two 75-question practice exams and a readiness dashboard.">
<style>
:root{
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Code","Cascadia Mono",Consolas,"SFMono-Regular",Menlo,monospace;
  --bg:#f3f3f6;--surface:#ffffff;--surface-2:#f8f8fb;--surface-3:#eef0f6;
  --border:#e1e1e8;--border-strong:#c9c9d4;
  --text:#1f1f24;--text-2:#5c5c66;--text-3:#7d7d88;
  --brand:#5b5fc7;--brand-hover:#4f52b2;--brand-press:#444791;--brand-soft:#e8e9f8;--brand-soft-2:#d6d8f4;--on-brand:#fff;
  --ok:#0e7a0d;--ok-soft:#e3f3e3;--bad:#c50f1f;--bad-soft:#fbe6e8;--warn:#9a5b00;--warn-soft:#fff3d6;--info:#0f6cbd;--info-soft:#e3effa;
  --new:#b4009e;--new-2:#5b5fc7;
  --code-bg:#f1f1f6;--code-text:#3b3b8f;
  --shadow-1:0 1px 2px rgba(20,20,40,.06),0 1px 3px rgba(20,20,40,.06);
  --shadow-2:0 2px 6px rgba(20,20,40,.08),0 8px 24px rgba(20,20,40,.08);
  --radius:10px;--radius-s:6px;
  --sidebar-w:288px;--topbar-h:56px;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#18181c;--surface:#232329;--surface-2:#2a2a31;--surface-3:#30303a;
  --border:#3a3a44;--border-strong:#4b4b57;
  --text:#f2f2f5;--text-2:#b9b9c4;--text-3:#8f8f9b;
  --brand:#8b8ff2;--brand-hover:#9da1f5;--brand-press:#7378e0;--brand-soft:#2c2d4a;--brand-soft-2:#383a63;--on-brand:#14142a;
  --ok:#6ccb5f;--ok-soft:#1f3320;--bad:#ff7b86;--bad-soft:#3d2025;--warn:#f2c661;--warn-soft:#3a3020;--info:#6cb8f6;--info-soft:#1d2d3d;
  --new:#ff6fd8;--new-2:#8b8ff2;
  --code-bg:#1c1c24;--code-text:#c5c8ff;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 4px 16px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);font-size:15px;line-height:1.55;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;font-size:inherit;color:inherit}
code,kbd,.mono{font-family:var(--mono);font-size:.88em}
code{background:var(--code-bg);color:var(--code-text);padding:.1em .38em;border-radius:4px;word-break:break-word}
pre{background:var(--code-bg);color:var(--code-text);padding:12px 14px;border-radius:8px;overflow:auto;font-family:var(--mono);font-size:13px;line-height:1.5;border:1px solid var(--border)}
pre code{background:none;padding:0;color:inherit}
kbd{border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:4px;padding:0 .35em;background:var(--surface)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;height:var(--topbar-h);display:flex;align-items:center;gap:12px;padding:0 16px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--border)}
.brandmark{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand) 0%,#7b4fc9 100%);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:.2px;box-shadow:var(--shadow-1);flex:none}
.brandtxt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brandtxt b{font-size:15px;white-space:nowrap}
.brandtxt span{font-size:11.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{flex:1;max-width:560px;margin-left:auto;position:relative}
.search input{width:100%;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);padding:0 12px 0 36px;font:inherit;font-size:14px}
.search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.search svg{position:absolute;left:11px;top:10px;width:16px;height:16px;color:var(--text-3)}
.iconbtn{width:36px;height:36px;border-radius:8px;border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--text-2);flex:none}
.iconbtn:hover{background:var(--surface-3);color:var(--text)}
.iconbtn svg{width:20px;height:20px}
#menuBtn{display:none}

/* ---------- Layout ---------- */
.layout{display:flex;min-height:calc(100vh - var(--topbar-h))}
.sidebar{width:var(--sidebar-w);flex:none;border-right:1px solid var(--border);background:var(--surface);position:sticky;top:var(--topbar-h);height:calc(100vh - var(--topbar-h));overflow-y:auto;padding:12px 10px 24px}
.navgroup{margin:6px 0 14px}
.navgroup h6{margin:8px 10px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);font-weight:600}
.navitem{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--text);cursor:pointer;font-size:14px;position:relative;text-decoration:none!important;border:0;background:none;width:100%;text-align:left}
.navitem:hover{background:var(--surface-3)}
.navitem.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
.navitem.active::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--brand)}
.navitem .ni-ico{width:20px;height:20px;flex:none;display:grid;place-items:center;color:var(--text-2)}
.navitem.active .ni-ico{color:var(--brand)}
.navitem .ni-ico svg{width:18px;height:18px}
.navitem .ni-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navitem .ni-num{font-size:11px;color:var(--text-3);width:16px;text-align:right;flex:none}
.navitem .ni-pct{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.navitem .ni-pct.done{color:var(--ok);font-weight:600}
.sidefoot{border-top:1px solid var(--border);margin-top:10px;padding:12px 8px 0;display:flex;flex-direction:column;gap:6px}
.sidefoot small{color:var(--text-3);font-size:11.5px;line-height:1.4}
.main{flex:1;min-width:0;padding:24px clamp(14px,3vw,36px) 64px}
.container{max-width:1120px;margin:0 auto}
.overlay{display:none}

/* ---------- Generic UI ---------- */
.page-h{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{font-size:26px;line-height:1.2;margin:0 0 6px;font-weight:650;letter-spacing:-.01em}
.page-h p{margin:0;color:var(--text-2);max-width:780px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin-bottom:6px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-1);padding:18px 20px}
.card+.card{margin-top:14px}
.card h2{font-size:18px;margin:0 0 10px;font-weight:650}
.card h3{font-size:16px;margin:18px 0 8px;font-weight:650}
.card h4{font-size:14.5px;margin:16px 0 6px;font-weight:650;color:var(--text)}
.card p{margin:8px 0}
.card ul,.card ol{margin:8px 0;padding-left:22px}
.card li{margin:4px 0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.muted{color:var(--text-2)}
.small{font-size:13px}
.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none!important}
.btn:hover{background:var(--surface-3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-hover)}
.btn.subtle{border-color:transparent;background:transparent}
.btn.subtle:hover{background:var(--surface-3)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--border))}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.btn svg{width:16px;height:16px}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:5px 11px;cursor:pointer;font-size:13px;color:var(--text-2);font-weight:600}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--brand-soft);color:var(--brand)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-3);color:var(--text-2);border:1px solid var(--border);white-space:nowrap}
.chip.brand{background:var(--brand-soft);color:var(--brand);border-color:var(--brand-soft-2)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.nfe{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:999px;color:#fff;background:linear-gradient(90deg,var(--new),var(--new-2));vertical-align:middle;white-space:nowrap;margin:0 4px}
.nfe::before{content:"✦";font-size:10px}
.callout{border:1px solid var(--border);border-left:4px solid var(--info);background:var(--info-soft);padding:10px 14px;border-radius:8px;margin:12px 0}
.callout.tip{border-left-color:var(--ok);background:var(--ok-soft)}
.callout.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.callout.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.callout.new{border-left-color:var(--new);background:color-mix(in srgb,var(--new) 9%,var(--surface))}
.callout b:first-child{display:block;margin-bottom:2px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0}
.tbl th,.tbl td{border-bottom:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-2);background:var(--surface-2);font-weight:650}
.tbl tr:hover td{background:var(--surface-2)}
.tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;margin:10px 0}
.tblwrap .tbl{margin:0}
.tblwrap .tbl tr:last-child td{border-bottom:0}
.bar{height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s}
.bar.ok>i{background:var(--ok)}.bar.bad>i{background:var(--bad)}.bar.warn>i{background:var(--warn)}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:12.5px;color:var(--text-2)}
.empty{padding:28px;text-align:center;color:var(--text-2)}
.hr{height:1px;background:var(--border);margin:16px 0}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--surface-3);color:var(--text-2);border:1px solid var(--border)}
.lv-E{color:var(--ok)}.lv-M{color:var(--warn)}.lv-H{color:var(--bad)}

/* ---------- Study pages ---------- */
.study-hero{background:linear-gradient(135deg,var(--brand-soft) 0%,var(--surface) 70%);border:1px solid var(--border);border-radius:14px;padding:22px 22px 18px;margin-bottom:16px}
.study-hero h1{margin:4px 0 8px;font-size:26px;line-height:1.2}
.study-hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.secnav{position:sticky;top:calc(var(--topbar-h) + 0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:8px 0;margin:0 0 12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.secnav a{flex:none;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);text-decoration:none}
.secnav a:hover{color:var(--brand);border-color:var(--brand-soft-2)}
.secnav a.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,var(--border))}
.secnav a.done::before{content:"✓ "}
.sec{scroll-margin-top:calc(var(--topbar-h) + 56px)}
.sec-h{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:4px}
.sec-h h2{margin:0}
.sec-h .sec-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.sec-h .sec-ico svg{width:17px;height:17px}
.sec-h .ttl{display:flex;align-items:center;gap:10px}
.donebtn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;color:var(--text-2)}
.donebtn.on{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--brand)}30%{box-shadow:0 0 0 4px var(--brand-soft-2)}100%{box-shadow:var(--shadow-1)}}
.reflist{list-style:none;padding:0!important;margin:6px 0;display:grid;gap:6px}
.reflist li{margin:0!important}
.reflist a{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--text);text-decoration:none}
.reflist a:hover{border-color:var(--brand-soft-2);background:var(--brand-soft)}
.reflist a .u{display:block;font-size:11.5px;color:var(--text-3);word-break:break-all}
.reflist svg{width:16px;height:16px;color:var(--brand);flex:none;margin-top:3px}
.scen{border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin:10px 0;background:var(--surface-2)}
.scen h4{margin:0 0 6px!important}
.scen .sol{margin-top:6px;padding-top:6px;border-top:1px dashed var(--border)}
.asklist li::marker{color:var(--brand)}
.kv{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:6px 14px;margin:8px 0}
.kv dt{font-weight:650;color:var(--text)}
.kv dd{margin:0;color:var(--text-2)}

/* ---------- Quiz runner ---------- */
.runner{display:grid;grid-template-columns:minmax(0,1fr) 264px;gap:16px;align-items:start}
.runner.compact{grid-template-columns:minmax(0,1fr)}
.statbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.stat{flex:1;min-width:120px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow-1)}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .l{font-size:12px;color:var(--text-2)}
.stat.pass .v{color:var(--ok)}.stat.fail .v{color:var(--bad)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.qcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-1);overflow:hidden}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.qhead .qn{font-weight:700;font-size:14px;margin-right:4px}
.qbody{padding:18px 20px 8px}
.qstem{font-size:15.5px;line-height:1.6}
.qstem p{margin:0 0 10px}
.qinstr{font-size:13px;color:var(--text-2);font-style:italic;margin:6px 0 12px}
.opts{display:grid;gap:8px;margin:12px 0 6px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;border:1.5px solid var(--border);border-radius:9px;cursor:pointer;background:var(--surface);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--brand-soft-2);background:var(--surface-2)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .ltr{flex:none;width:26px;height:26px;border-radius:7px;border:1.5px solid var(--border-strong);display:grid;place-items:center;font-weight:700;font-size:12.5px;color:var(--text-2);background:var(--surface)}
.opt.multi .ltr{border-radius:6px}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .ltr{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.opt.locked{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .ltr{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .ltr{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.missed{border-style:dashed;border-color:var(--ok)}
.opt .otxt{flex:1;min-width:0;padding-top:2px}
.qfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--border);background:var(--surface-2)}
.casebox{border:1px solid var(--border);border-radius:10px;margin:0 0 14px;background:var(--surface-2);overflow:hidden}
.casebox summary{cursor:pointer;padding:10px 14px;font-weight:650;display:flex;align-items:center;gap:8px;list-style:none}
.casebox summary::-webkit-details-marker{display:none}
.casebox summary svg{width:18px;height:18px;flex:none;color:var(--brand)}
.casebox summary::after{content:"▾";margin-left:auto;color:var(--text-3)}
.casebox[open] summary::after{content:"▴"}
.casebox .cbody{padding:4px 16px 14px;font-size:14px;border-top:1px solid var(--border);max-height:420px;overflow:auto}
.casebox .cbody h5{margin:12px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--brand)}
.casebox .cbody ul{padding-left:20px;margin:4px 0}
/* yes/no */
.yn{width:100%;border-collapse:separate;border-spacing:0 6px;margin:8px 0}
.yn td{padding:10px 12px;background:var(--surface-2);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.yn td:first-child{border-left:1px solid var(--border);border-radius:8px 0 0 8px}
.yn td:last-child{border-right:1px solid var(--border);border-radius:0 8px 8px 0;white-space:nowrap;width:1%}
.yn th{font-size:12px;color:var(--text-2);text-align:left;padding:0 12px}
.ynbtn{border:1.5px solid var(--border-strong);background:var(--surface);border-radius:6px;padding:4px 12px;font-weight:650;cursor:pointer;font-size:13px}
.ynbtn+.ynbtn{margin-left:6px}
.ynbtn.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.ynbtn.right{background:var(--ok);border-color:var(--ok);color:#fff}
.ynbtn.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.ynbtn:disabled{cursor:default}
/* drag & drop */
.dnd{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0}
.dnd h5{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2)}
.dzone{min-height:120px;border:1.5px dashed var(--border-strong);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2)}
.dzone.over{border-color:var(--brand);background:var(--brand-soft)}
.ditem{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:grab;font-size:14px;box-shadow:var(--shadow-1);user-select:none}
.ditem:active{cursor:grabbing}
.ditem .grip{color:var(--text-3);flex:none;font-size:14px;line-height:1}
.ditem .dtxt{flex:1;min-width:0}
.ditem .idx{flex:none;width:22px;height:22px;border-radius:6px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-size:12px;font-weight:700}
.ditem .mv{display:flex;gap:2px;flex:none}

mark{background:color-mix(in srgb,#ffd400 55%,transparent);color:inherit;border-radius:3px;padding:0 1px}

D.cases = {
  contoso: {t:'Contoso Pharmaceuticals', b:`<h5>Overview</h5><p>Contoso Pharmaceuticals is a regulated life-sciences company with 9,000 users in Amsterdam (HQ), Boston and Singapore. All users have Microsoft 365 E5 licenses. Teams is the primary collaboration and calling platform.</p><h5>Existing environment</h5><ul><li>Teams Phone with Operator Connect in the Netherlands and Calling Plans in the US. Singapore still uses an on-premises PBX.</li><li>Research (R&amp;D) and Sales departments are defined by the Entra ID <code>Department</code> attribute.</li><li>A partner, Fabrikam Labs, uses its own Microsoft 365 tenant.</li><li>Teams meeting recordings currently never expire.</li></ul><h5>Requirements</h5><ul><li><b>Compliance:</b> R&amp;D users must not chat, call or meet with Sales users. All Teams chat messages must be retained for 7 years.</li><li><b>Collaboration:</b> Selected R&amp;D users must collaborate with Fabrikam Labs in a channel <i>without</i> creating guest accounts in either tenant.</li><li><b>Meetings:</b> Board meetings must show each attendee's email as a watermark on shared content, and recordings for most users must be deleted automatically after 60 days.</li><li><b>Voice:</b> Singapore users must keep their existing numbers through an on-premises certified SBC.</li><li><b>Administration:</b> Helpdesk staff must view call quality details including other participants' device and network information without being able to change any settings.</li></ul>`},
  fabrikam: {t:'Fabrikam Retail', b:`<h5>Overview</h5><p>Fabrikam Retail operates 420 stores and a head office. Store employees are frontline workers licensed with Microsoft 365 F3; head-office staff use Microsoft 365 E3 with Teams.</p><h5>Existing environment</h5><ul><li>Each store's employees have the Entra ID attribute <code>officeLocation</code> populated with the store number.</li><li>Head office uses Teams Rooms on Windows in 30 meeting rooms and 60 Teams phones in break rooms and warehouses.</li><li>Teams creation is currently open to everyone, which has created over 3,000 unused teams.</li></ul><h5>Requirements</h5><ul><li><b>Frontline:</b> Every store must have its own team whose membership updates automatically as staff join or leave.</li><li><b>Apps:</b> Store employees must see the Shifts and Walkie Talkie apps pinned first in Teams; they must not be able to unpin them.</li><li><b>Governance:</b> Only members of the <i>Team-Creators</i> security group may create Microsoft 365 groups; unused teams must be removed automatically after one year unless owners renew them; all new team names must start with <code>FR-</code>.</li><li><b>Devices:</b> Break-room phones must be shared by anyone without a personal sign-in; meeting rooms must get remote monitoring and incident management.</li><li>Minimize administrative effort and licensing cost.</li></ul>`},
  litware: {t:'Litware Inc.', b:`<h5>Overview</h5><p>Litware Inc. is a professional services firm with 2,400 users in London and New York. It just acquired Tailspin Consulting, which has its own Microsoft 365 tenant (800 users).</p><h5>Existing environment</h5><ul><li>Both tenants use Microsoft 365 E3 with Teams. 300 Litware users have Microsoft 365 Copilot licenses.</li><li>Litware's Teams external access currently allows all external domains.</li><li>An auto attendant and two call queues (Sales, Support) serve the main New York number.</li></ul><h5>Requirements</h5><ul><li><b>Integration:</b> Until tenants are merged, Litware and Tailspin users must find each other in Teams search, chat with a single unified identity, and see notifications from the other tenant — with the least administrative effort.</li><li><b>External access:</b> Only the Legal group may chat with users at <code>courts.example</code>; everyone else must continue to communicate with any domain.</li><li><b>Copilot:</b> For Copilot users, Copilot in meetings must only be usable when a transcript is saved.</li><li><b>Voice:</b> Sales managers must be able to change call queue greetings and holiday routing without accessing the Teams admin center.</li><li><b>Events:</b> Quarterly all-hands broadcasts for 2,800 attendees with Q&amp;A, without additional add-on licenses.</li></ul>`},
  tailwind: {t:'Tailwind Traders', b:`<h5>Overview</h5><p>Tailwind Traders is a logistics company with 6,000 users. It runs a hybrid environment: identities synchronize from on-premises AD DS with Microsoft Entra Connect; all mailboxes are in Exchange Online.</p><h5>Existing environment</h5><ul><li>Users connect to Teams from Citrix Virtual Apps and Desktops published desktops (Windows endpoints) in the call center and from physical PCs elsewhere.</li><li>Teams Phone uses Direct Routing through two certified SBCs (<code>sbc1.tailwindtraders.com</code>, <code>sbc2.tailwindtraders.com</code>).</li><li>Offices have local internet breakout, but remote users connect through a full-tunnel VPN.</li><li>Users report robotic audio and frozen video in meetings, mainly when working from home.</li></ul><h5>Requirements</h5><ul><li><b>Quality:</b> Identify which buildings and subnets produce poor calls, and prioritize real-time media on the corporate network.</li><li><b>VDI:</b> Call-center agents must get optimized media with the newest VDI optimization before the legacy WebRTC-based optimization reaches end of support on Windows endpoints.</li><li><b>Security:</b> Teams access must require MFA except from compliant devices, and policy must apply consistently to Teams, SharePoint and Exchange.</li><li><b>Operations:</b> The network team must be alerted automatically when Direct Routing SBC health degrades.</li></ul>`}
};

D.focus = {
  title: 'Exam focus hub',
  intro: 'The high-yield material in one place: the topics Microsoft tests most, where candidates lose points, the settings and cmdlets that keep showing up in scenarios, the Teams admin center paths you must know, and licensing dependencies. Skills measured as of October 27, 2026.',
  sections: [
  {id:'freq', h:'Frequently tested topics', icon:'target', html:`
<p>Domain weights tell you where the points are. Domain 1 alone is 40–45% of the exam — external collaboration, governance and security/compliance carry most of it.</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th>Domain</th><th>Weight</th><th>Most frequently tested</th></tr></thead><tbody>
<tr><td><b>1 · Configure and manage a Teams environment</b></td><td>40–45%</td><td>External access vs guest access vs shared channels (B2B direct connect); group expiration &amp; naming policies; restricting group creation; retention policies (where data lives); sensitivity labels for teams and meetings; information barriers; admin roles; policy assignment precedence &amp; policy packages; Network planner, ports, QoS; Teams Rooms accounts/licensing; VDI optimization.</td></tr>
<tr><td><b>2 · Manage teams, channels, chats, and apps</b></td><td>20–25%</td><td>Channel types &amp; who can create them (Teams policies); private/shared channel membership; team templates &amp; template policies; creating teams from groups/sites/templates (PowerShell &amp; Graph); messaging policies; app centric management, app setup policies (pinning, custom app upload), blocking apps, consent; org-wide teams; frontline dynamic teams.</td></tr>
<tr><td><b>3 · Manage meetings and calling</b></td><td>15–20%</td><td>Meeting policy settings (lobby, presenters, recording, recording expiration, transcription, Copilot); anonymous join (org-wide vs per-organizer); meeting vs webinar vs town hall vs virtual appointment; events policies; phone number assignment (<code>Set-CsPhoneNumberAssignment</code>); calling/caller ID/voicemail policies; auto attendants &amp; call queues (routing methods, overflow/timeout, resource accounts, authorized users).</td></tr>
<tr><td><b>4 · Monitor, report on, and troubleshoot Teams</b></td><td>15–20%</td><td>CQD vs call analytics vs real-time analytics; building data upload; admin roles that see EUII; usage reports &amp; concealed names; audit log for team creation/deletion; alert rules; client logs &amp; cache; self-help diagnostics; sign-in troubleshooting; Copilot not available in meetings; meeting join failures.</td></tr>
</tbody></table></div>`},
  {id:'fail', h:'Areas where candidates often fail', icon:'warn', html:`
<ol>
<li><b>Mixing up external access and guest access.</b> External access (federation) = chat/call/meet with people who stay in their own tenant; no team membership. Guest access = a B2B guest account in <i>your</i> directory who can be a team member. Shared channels = B2B direct connect — no guest account at all.</li>
<li><b>Forgetting that shared channels need cross-tenant access configured in <i>both</i> organizations</b> (inbound and outbound B2B direct connect) <i>plus</i> the Teams policy settings for creating/inviting/joining shared channels.</li>
<li><b>Policy precedence.</b> Direct assignment (including policy packages, which are direct assignments) beats group assignment; among groups the lowest rank number wins; the org-wide Global policy applies only when nothing else does.</li>
<li><b>“Off” is not always enforced.</b> Many meeting settings can be overridden by organizers unless enforced (for example, the Copilot meeting policy value <i>Off</i> only sets the default; only <i>On with saved transcript required</i> is enforced). Anonymous join needs <i>both</i> the org-wide setting and the organizer's policy to allow it.</li>
<li><b>Licensing edge cases:</b> Entra ID P1 for naming/expiration policies and restricting group creation; Entra ID P2/Governance for access reviews; E5-class compliance for information barriers, communication compliance and DLP on chat messages; Teams Premium for watermarking, meeting sensitivity labels, custom meeting templates, custom policy packages and the Queues app; Teams Rooms Pro vs Basic (25 free Basic rooms).</li>
<li><b>Where Teams stores content</b> (and therefore where retention, holds and eDiscovery apply): chats in user mailboxes, channel messages in the group mailbox (now including private channels), files in SharePoint/OneDrive, recordings in the organizer's OneDrive or the channel's SharePoint site.</li>
<li><b>Choosing the wrong monitoring tool:</b> per-user call details = call analytics; org-wide trends by building = CQD (with building data); in-progress meeting = real-time analytics; adoption = usage reports.</li>
<li><b>Call queue routing methods and overflow/timeout:</b> attendant (all ring), serial (in order), round robin (balanced), longest idle (presence-based). Know conference mode and presence-based routing.</li>
<li><b>Recent retirements:</b> Live events (no new scheduling after June 30, 2026), Office 365 connectors in Teams (May 2026), Mesh (December 2025), app permission policies (replaced by app centric management). Exams prefer the current replacement.</li>
</ol>`},

  {id:'settings', h:'Configuration settings commonly used in scenario questions', icon:'term', html:`
<div class="tblwrap"><table class="tbl"><thead><tr><th>Requirement in the scenario</th><th>Setting / feature</th><th>Where</th></tr></thead><tbody>
<tr><td>Only certain users can create teams</td><td>Restrict Microsoft 365 group creation to a security group (<code>EnableGroupCreation=false</code>, <code>GroupCreationAllowedGroupId</code>)</td><td>Entra directory settings via Microsoft Graph PowerShell</td></tr>
<tr><td>Delete unused teams automatically</td><td>Microsoft 365 group expiration policy (auto-renews on activity)</td><td>Entra admin center › Groups › Expiration</td></tr>
<tr><td>Force a prefix/suffix and block words in team names</td><td>Group naming policy</td><td>Entra admin center › Groups › Naming policy</td></tr>
<tr><td>Make a finished project read-only</td><td>Archive team (optionally make SharePoint site read-only for members)</td><td>TAC › Teams › Manage teams; <code>Set-TeamArchivedState</code></td></tr>
<tr><td>Chat with a partner org without guest accounts</td><td>External access (domain allow list)</td><td>TAC › Users › External access</td></tr>
<tr><td>Partner users work in a channel without guest accounts</td><td>Shared channel + B2B direct connect (both tenants)</td><td>Entra › External Identities › Cross-tenant access settings + TAC Teams policies</td></tr>

<tr><td>Nobody bypasses the lobby except the organizer</td><td>Meeting policy › Who can bypass the lobby = Only organizers and co-organizers</td><td>TAC › Meetings › Meeting policies</td></tr>

  {id:'ps', h:'PowerShell commands likely to be tested', icon:'term', html:`
<p>Install and connect: <code>Install-Module MicrosoftTeams</code> then <code>Connect-MicrosoftTeams</code>. Group and directory settings use the Microsoft Graph PowerShell SDK (<code>Connect-MgGraph</code>); Purview uses <code>Connect-IPPSSession</code>; Exchange uses <code>Connect-ExchangeOnline</code>.</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th>Cmdlet</th><th>Purpose / exam angle</th></tr></thead><tbody>
<tr><td><code>New-Team</code> / <code>New-Team -GroupId</code></td><td>Create a team; “teamify” an existing Microsoft 365 group</td></tr>
<tr><td><code>Add-TeamUser -Role Owner</code></td><td>Add a member or owner</td></tr>
<tr><td><code>New-TeamChannel -MembershipType Private|Shared</code></td><td>Create private/shared channels</td></tr>
<tr><td><code>Set-TeamArchivedState -Archived $true -SetSpoSiteReadOnlyForMembers $true</code></td><td>Archive a team and lock its site</td></tr>
<tr><td><code>Grant-CsTeamsMeetingPolicy -Identity / -Group -Rank</code></td><td>Assign a policy to a user or a group (rank sets precedence)</td></tr>
<tr><td><code>New-CsBatchPolicyAssignmentOperation</code></td><td>Assign a policy to up to 5,000 users per batch</td></tr>
<tr><td><code>Grant-CsUserPolicyPackage</code> / <code>Grant-CsGroupPolicyPackageAssignment</code></td><td>Assign policy packages</td></tr>
<tr><td><code>Get-CsUserPolicyAssignment</code></td><td>See effective policy and its source (direct or group)</td></tr>
<tr><td><code>Set-CsTeamsMeetingPolicy -AutoAdmittedUsers -AllowCloudRecording -NewMeetingRecordingExpirationDays -AllowTranscription -Copilot</code></td><td>Lobby, recording, expiration, transcription, Copilot</td></tr>
<tr><td><code>Set-CsTeamsMeetingConfiguration -DisableAnonymousJoin</code></td><td>Org-wide anonymous join</td></tr>

  {id:'strategy', h:'Exam-day strategy', icon:'star', html:`
<ul>
<li><b>Format:</b> about 40–60 items in 100 minutes; passing score is 700 on a 1–1,000 scale. Expect case studies (read the requirements tab first), Yes/No series that cannot be revisited, drag-and-drop sequences and hotspots.</li>
<li><b>Read for constraints:</b> “least administrative effort”, “minimize cost”, “without creating guest accounts”, “ensure users cannot override”. These words choose between two technically valid answers.</li>
<li><b>Prefer current features:</b> app centric management over permission policies, town halls over live events, Workflows over Office 365 connectors, new Teams client and SlimCore VDI optimization.</li>
<li><b>Map the portal:</b> if the answer requires an Entra or Purview capability, Teams admin center options are distractors (and vice versa).</li>
<li><b>Microsoft Learn is available</b> during the exam (it is an open-book resource for role-based exams) — but it costs time. Use it only for a specific parameter you can't recall.</li>
</ul>`}

n:1, key:'env', icon:'globe', short:'Plan & configure environment',
title:'Plan and configure a Microsoft Teams environment',
maps:['Domain 1 · 40–45%','Plan network settings for Teams','Manage Teams clients (deployment, VDI, update policies)','Teams Advisor & admin tools'],
intro:'How Teams is built on Microsoft 365, the admin tools you use to run it, how to prepare the network for real-time media, and how to deploy and keep the Teams client healthy on physical and virtual desktops.',
sections:[
{id:'guide', h:'Detailed study guide', html:`
<h3>1. Teams architecture in Microsoft 365</h3>
<p>Teams is a hub that stitches together several Microsoft 365 services. Knowing which service does what explains most governance, compliance and troubleshooting answers:</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th>Service</th><th>What Teams uses it for</th></tr></thead><tbody>
<tr><td>Microsoft Entra ID</td><td>Identities, authentication, Conditional Access, guest (B2B) accounts, groups, cross-tenant access, admin roles</td></tr>
<tr><td>Microsoft 365 Groups</td><td>Every team is backed by a Microsoft 365 group (membership, owners, lifecycle: naming, expiration, deletion/restore)</td></tr>
<tr><td>SharePoint Online</td><td>Channel files (one site per team; private and shared channels each get their own site), channel meeting recordings</td></tr>
<tr><td>OneDrive</td><td>Files shared in 1:1/group chats (sender's OneDrive), non-channel meeting recordings and transcripts (organizer's OneDrive), Whiteboard, Loop components in chat</td></tr>
<tr><td>Exchange Online</td><td>Calendar and meetings, voicemail, compliance copies of chats (user mailboxes) and channel messages (group mailbox), room mailboxes for Teams Rooms</td></tr>
<tr><td>Microsoft Purview</td><td>Retention, eDiscovery, audit, DLP, sensitivity labels, information barriers, communication compliance</td></tr>
</tbody></table></div>
<h3>2. Administration tools</h3>
<ul>
<li><b>Teams admin center (TAC)</b> — <code>admin.teams.microsoft.com</code>: teams, policies, apps, meetings, voice, locations, analytics, devices. Includes a tenant-specific <b>What's New</b> section <span class="nfe">NEW FOR EXAM</span>.</li>
<li><b>Teams PowerShell module</b> — <code>Install-Module MicrosoftTeams</code>, <code>Connect-MicrosoftTeams</code>. Manages teams (<code>New-Team</code>), policies (<code>Cs*</code> cmdlets), voice, and batch operations. Skype for Business Online Connector is retired; everything is in this module.</li>
<li><b>Microsoft Graph</b> — Teams, channels, chats, apps, membership and archiving via REST (<code>/teams</code>, <code>/groups/{id}/team</code>); Microsoft Graph PowerShell for directory settings (group creation, guest settings).</li>
<li><b>Microsoft 365 admin center</b> — licenses, Microsoft 365 Groups org settings, usage reports privacy, multitenant collaboration, self-help diagnostics, network connectivity insights.</li>
<li><b>Teams Advisor</b> (Planning › Teams Advisor) — creates a Deployment team with a channel per workload, Planner task lists, tenant assessments and a Forms survey to drive a rollout. Needs Teams, Planner and Forms licensing; non-admins can use it, but readiness assessments need a Teams admin role.</li>
</ul>
<h3>3. Network planning for real-time media</h3>
<p>Teams media (audio, video, screen sharing) is real-time and sensitive to latency, jitter and packet loss. Microsoft's guidance focuses on <b>local internet egress</b>, <b>avoiding VPN hairpins and proxies</b> for media, opening the right ports, and measuring before deployment.</p>
<h4>Network performance targets (Microsoft Learn)</h4>
<div class="tblwrap"><table class="tbl"><thead><tr><th>Metric</th><th>Client → Microsoft network edge</th><th>Customer edge → Microsoft network edge</th></tr></thead><tbody>
<tr><td>Latency (one way)</td><td>&lt; 50 ms</td><td>&lt; 30 ms</td></tr>
<tr><td>Latency (round trip)</td><td>&lt; 100 ms</td><td>&lt; 60 ms</td></tr>
<tr><td>Burst packet loss</td><td>&lt; 10% in any 200 ms interval</td><td>&lt; 1% in any 200 ms interval</td></tr>
<tr><td>Packet loss</td><td>&lt; 1% in any 15 s interval</td><td>&lt; 0.1% in any 15 s interval</td></tr>
<tr><td>Jitter</td><td>&lt; 30 ms in any 15 s interval</td><td>&lt; 15 ms in any 15 s interval</td></tr>
<tr><td>Packet reorder</td><td>&lt; 0.05% out-of-order</td><td>&lt; 0.01% out-of-order</td></tr>
</tbody></table></div>
<h4>Bandwidth (per-endpoint reference values)</h4>
<div class="tblwrap"><table class="tbl"><thead><tr><th>Bandwidth (up/down)</th><th>Scenario</th></tr></thead><tbody>
<tr><td>30 kbps</td><td>Peer-to-peer audio</td></tr><tr><td>130 kbps</td><td>Peer-to-peer audio + screen sharing</td></tr><tr><td>500 kbps</td><td>Peer-to-peer video 360p/30 fps</td></tr><tr><td>1.2 Mbps</td><td>Peer-to-peer HD video 720p/30 fps</td></tr><tr><td>1.5 Mbps</td><td>Peer-to-peer HD video 1080p/30 fps</td></tr><tr><td>500 kbps / 1 Mbps</td><td>Group video</td></tr><tr><td>1 Mbps / 2 Mbps</td><td>HD group video (540p tiles on a 1080p screen)</td></tr>
</tbody></table></div>
<p>Teams adapts bitrate dynamically; administrators can cap video bitrate per user with the meeting policy setting <i>Media bit rate (Kbs)</i> (<code>-MediaBitRateKb</code>), or restrict IP video/audio modes for low-bandwidth sites.</p>
<h4>Ports and protocols</h4>
<ul>
<li><b>TCP 443</b> (and 80) — signaling, web traffic, and media fallback when UDP is blocked (worse quality).</li>
<li><b>UDP 3478–3481</b> — media to Teams Transport Relays (required for optimal media). Microsoft 365 “Optimize” category endpoints for Teams should bypass proxies and TLS inspection.</li>
<li>Client source ports for QoS (when port ranges are enabled): audio <b>50000–50019</b>, video <b>50020–50039</b>, screen/app sharing <b>50040–50059</b>.</li>
</ul>
<h4>Quality of Service (QoS)</h4>
<p>QoS marks packets so the managed network can prioritize them. Recommended DSCP values: <b>Audio = EF (46)</b>, <b>Video = AF41 (34)</b>, <b>Application/screen sharing = AF21 (18)</b>. On Windows, use Group Policy/Intune policy-based QoS keyed to the port ranges; in TAC enable <i>Meetings › Meeting settings › Network › Insert Quality of Service (QoS) markers for real-time media traffic</i> and the port ranges. QoS only helps on networks you control — it does nothing on the public internet.</p>
<h4>Planning and assessment tools</h4>
<ul>
<li><b>Network planner</b> (TAC › Planning › Network planner): model your sites (users, WAN/internet links), apply personas (built-in such as Office worker, Remote worker, Teams Rooms system, or custom), and produce bandwidth requirement reports per site.</li>
<li><b>Microsoft Teams Network Assessment Tool</b>: a downloadable command-line tool that runs media quality tests (packet loss, jitter, RTT) toward Teams relays and, with <code>/connectivitycheck</code>, verifies connectivity to required ports/endpoints.</li>
<li><b>Microsoft 365 network connectivity test</b> (<code>connectivity.office.com</code>): tests egress location, DNS, proxy, front-door distance and Teams media connectivity; results can be shared to the Microsoft 365 admin center (<i>Health › Network connectivity</i>) for location-level insights.</li>
<li><b>Network topology</b> (TAC › Locations): define network regions, sites, subnets and trusted IPs — used by Location-Based Routing, dynamic emergency calling and reporting labels.</li>
</ul>
<h3>4. Deploying and updating the Teams client</h3>
<ul>
<li>The <b>new Teams client</b> is the only supported desktop client; classic Teams reached end of availability on July 1, 2025.</li>
<li>Bulk deployment uses <code>teamsbootstrapper.exe</code>: <code>-p</code> provisions the MSIX for all users on the machine, <code>-x</code> deprovisions, <code>-o</code> points to an offline MSIX. Intune and Configuration Manager can wrap the bootstrapper. Prerequisites include WebView2.</li>
<li>Teams updates itself (typically every two weeks). Versions older than ~90 days fall out of support.</li>
<li><b>Teams update policies</b> (TAC › Teams › Teams update policies / <code>Set-CsTeamsUpdateManagementPolicy -AllowPublicPreview</code>) control whether users see <b>Public Preview</b> features: <i>Follow Office Preview</i> (default — users on Office Current Channel (Preview) get Teams preview), <i>Enabled</i>, or <i>Not enabled</i>.</li>
<li>Web clients (Edge, Chrome, Firefox, Safari) and mobile clients are supported; mobile apps are managed with Intune app protection policies.</li>
</ul>
<h3>5. Teams on virtual desktops (VDI)</h3>
<ul>
<li>Without media optimization, audio/video is processed in the virtual machine — high CPU and poor quality. Optimization offloads media to the endpoint.</li>
<li>The <b>new VDI solution (SlimCore)</b> uses the same media engine as native Teams, delivered to the endpoint via a plugin and kept up to date automatically. It supports features the legacy WebRTC optimization lacks (gallery 3x3/7x7, QoS, HID, 1080p, hardware acceleration) and is enabled with the Teams VDI policy (<code>Set-CsTeamsVdiPolicy -VDI2Optimization Enabled</code>). For Citrix, allow the virtual channels <code>MSTEAMS</code>, <code>MSTEAM1</code>, <code>MSTEAM2</code> in Citrix Studio and deploy the plugin. <span class="nfe">NEW FOR EXAM</span></li>
<li>Legacy WebRTC-based optimization on Windows endpoints: end of support <b>October 1, 2026</b>, end of availability <b>April 1, 2027</b> (per Citrix/Microsoft guidance). Selection order at runtime: SlimCore › WebRTC › non-optimized fallback.</li>
<li>Install the new Teams per-machine (MSIX) for non-persistent VDI; use profile containers (for example FSLogix) to roam cache; assign a <b>Teams VDI policy</b> (<code>CsTeamsVdiPolicy</code>) to disable calls/meetings or audio/video for users on non-optimized VDI.</li>
</ul>`},
{id:'concepts', h:'Important concepts', html:`
<dl class="kv">
<dt>Optimize endpoints</dt><dd>The Microsoft 365 endpoint category (Teams media, Exchange, SharePoint) that should bypass proxies, VPN and TLS inspection and egress locally.</dd>
<dt>Transport Relay</dt><dd>Microsoft media relay that clients reach on UDP 3478–3481 when a direct peer path isn't possible.</dd>
<dt>DSCP</dt><dd>The QoS marking in the IP header (EF 46, AF41 34, AF21 18 for Teams).</dd>
<dt>Network planner persona</dt><dd>A bandwidth usage profile (Office worker, Remote worker, Teams Rooms system, custom) applied to users at a site.</dd>
<dt>Split-tunnel VPN</dt><dd>Sends Teams media directly to Microsoft instead of through the corporate VPN — the single biggest fix for remote-worker call quality.</dd>
<dt>teamsbootstrapper.exe</dt><dd>Installer that provisions the new Teams MSIX machine-wide.</dd>
<dt>Public Preview</dt><dd>Early feature channel controlled by Teams update policy.</dd>
<dt>SlimCore (VDI 2.0)</dt><dd>New Microsoft-owned VDI media optimization replacing WebRTC-based optimization.</dd>
<dt>Teams Advisor</dt><dd>Guided rollout workspace (Deployment team + Planner + assessments) in TAC › Planning.</dd>
<dt>Network topology</dt><dd>Regions, sites, subnets and trusted IPs used by dynamic emergency calling, LBR and reporting.</dd>
</dl>`},
{id:'resp', h:'Administrator responsibilities', html:`
<ul>
<li>Assess network readiness before rollout: run the Network Assessment Tool and connectivity test from representative sites; model bandwidth with Network planner.</li>
<li>Work with network owners to open UDP 3478–3481 and TCP 443, exempt Optimize endpoints from proxies/TLS inspection, and implement split-tunnel VPN.</li>
<li>Design and deploy QoS end-to-end (client marking + switches/routers honoring DSCP).</li>
<li>Deploy and update the new Teams client (bootstrapper, Intune/ConfigMgr), set update/preview policies, and keep VDI images current.</li>
<li>Choose the VDI optimization approach, deploy the endpoint plugin, and assign VDI policies.</li>
<li>Maintain TAC and PowerShell tooling (module version, scripts), and track tenant changes in TAC What's New and Message center.</li>
</ul>`},
{id:'paths', h:'Teams admin center paths & PowerShell', html:`
<div class="tblwrap"><table class="tbl"><thead><tr><th>Task</th><th>Where / how</th></tr></thead><tbody>
<tr><td>Bandwidth modeling</td><td>TAC › Planning › Network planner</td></tr>
<tr><td>Rollout plan</td><td>TAC › Planning › Teams Advisor</td></tr>
<tr><td>QoS markers and ports</td><td>TAC › Meetings › Meeting settings › Network; <code>Set-CsTeamsMeetingConfiguration -EnableQoS $true -ClientAudioPort 50000 -ClientAudioPortRange 20</code></td></tr>
<tr><td>Network sites/subnets</td><td>TAC › Locations › Network topology</td></tr>
<tr><td>Preview features</td><td>TAC › Teams › Teams update policies; <code>Set-CsTeamsUpdateManagementPolicy -Identity Global -AllowPublicPreview Enabled</code></td></tr>
<tr><td>VDI policy</td><td><code>New-CsTeamsVdiPolicy -Identity NoAV -DisableAudioVideoInCallsAndMeetings $true</code>; <code>Set-CsTeamsVdiPolicy -Identity Global -VDI2Optimization Enabled</code></td></tr>
<tr><td>Bulk install client</td><td><code>teamsbootstrapper.exe -p</code> (add <code>-o "C:\\path\\MSTeams-x64.msix"</code> for offline)</td></tr>
<tr><td>Connect PowerShell</td><td><code>Install-Module MicrosoftTeams -Force</code>; <code>Connect-MicrosoftTeams</code></td></tr>
</tbody></table></div>`},
{id:'scen', h:'Real-world scenarios', html:`
<div class="scen"><h4>Remote workers report robotic audio</h4><p>All home workers connect through a full-tunnel VPN that terminates in the head office.</p><div class="sol"><b>Solution:</b> Configure split-tunnel VPN so Teams Optimize endpoints (media) egress directly; confirm UDP 3478–3481 is reachable; validate with the Microsoft 365 network connectivity test.</div></div>
<div class="scen"><h4>New branch office with a 20 Mbps link</h4><p>You must determine whether the link supports 60 users plus two Teams Rooms.</p><div class="sol"><b>Solution:</b> Network planner — add the site, apply Office worker and Teams Rooms personas, review the report. Cap bitrate with a meeting policy if needed.</div></div>
<div class="scen"><h4>Citrix call center</h4><p>Agents on Citrix published desktops have poor video and high VM CPU.</p><div class="sol"><b>Solution:</b> Enable SlimCore optimization: Teams VDI policy <code>VDI2Optimization</code>, allow MSTEAMS/MSTEAM1/MSTEAM2 virtual channels, deploy the Teams VDI plugin on Windows endpoints.</div></div>
<div class="scen"><h4>Pilot group wants new features early</h4><div class="sol"><b>Solution:</b> Create a Teams update policy with <i>Show preview features = Enabled</i> and assign it to the pilot group; leave Global at the default.</div></div>`},
{id:'bp', h:'Best practices', html:`
<ul>
<li>Measure first (connectivity test + Network Assessment Tool), then plan (Network planner), then deploy QoS.</li>
<li>Provide local internet breakout close to users; avoid backhauling Teams media across the WAN.</li>
<li>Never inspect or proxy Teams media; use split tunneling for VPN.</li>
<li>Use the same DSCP values end-to-end and document them with the network team.</li>
<li>Provision the new Teams machine-wide in images; let it auto-update; monitor versions.</li>
<li>Use a small pilot ring with Public Preview to test changes before broad release.</li>
<li>Move VDI estates to SlimCore before WebRTC end of support.</li>
</ul>`},
{id:'tips', h:'Exam tips', html:`
<ul>
<li>“Determine bandwidth requirements per site” → <b>Network planner</b>. “Test connectivity and quality from a machine” → <b>Network Assessment Tool</b> / <b>network connectivity test</b>.</li>
<li>Memorize DSCP: <b>46 / 34 / 18</b> and the three port ranges starting at <b>50000</b>.</li>
<li>UDP <b>3478–3481</b> is the media port range to the cloud; TCP 443 is the fallback.</li>
<li>Update policy values: <i>Follow Office Preview</i>, <i>Enabled</i>, <i>Not enabled</i>.</li>
<li>VDI: legacy = WebRTC (VDI 1.0); new = SlimCore (VDI 2.0) via <code>VDI2Optimization</code>.</li>
</ul>`},
{id:'mistakes', h:'Common mistakes', html:`
<ul>
<li>Thinking QoS improves quality on home internet connections — it only works on managed networks.</li>
<li>Routing Teams through a proxy with TLS inspection “for security” — breaks or degrades media.</li>
<li>Using the Network planner to troubleshoot an existing bad call (use call analytics/CQD instead).</li>
<li>Installing per-user Teams in non-persistent VDI (profile bloat, slow logons).</li>
<li>Assuming classic Teams or Skype for Business Online are still supported options.</li>
</ul>`},
{id:'asks', h:'Things Microsoft likes to ask on the exam', html:`
<ul class="asklist">
<li>Which tool to use to estimate bandwidth for a planned site.</li>
<li>Which ports/protocols must be open for optimal Teams media.</li>
<li>DSCP values or port ranges for audio, video and sharing.</li>
<li>Network requirements (latency/jitter/packet loss thresholds).</li>
<li>How to let a subset of users try preview features.</li>
<li>How to optimize Teams in Citrix/AVD and which policy disables A/V for non-optimized users.</li>
<li>What Teams Advisor creates (Deployment team, Planner plans, assessments).</li>
</ul>`},

D.tabs.push({
n:2, key:'gov', icon:'cycle', short:'Lifecycle & governance',
title:'Manage lifecycle and governance for Teams',
maps:['Domain 1 · 40–45%','Plan and implement governance for Teams','Policy packages & policy assignment','PowerShell & Microsoft Graph operations'],
intro:'Control how teams are created, named, renewed, archived, deleted and restored; know where Teams stores content; assign policies at scale with packages and group assignment; and automate with PowerShell and Microsoft Graph.',
sections:[
{id:'guide', h:'Detailed study guide', html:`
<h3>1. Lifecycle phases</h3>
<p>A team lives through <b>creation → use → review/renewal → archive or delete → (restore)</b>. Governance controls each phase while keeping self-service productive.</p>
<h3>2. Controlling creation</h3>
<ul>
<li>By default every user can create Microsoft 365 groups and therefore teams. To restrict creation, set the Entra directory setting (template <i>Group.Unified</i>) <code>EnableGroupCreation = false</code> and <code>GroupCreationAllowedGroupId = &lt;security group ID&gt;</code> using Microsoft Graph PowerShell. This applies to Teams, Outlook, SharePoint, Planner etc. Global/privileged admins can still create groups.</li>
<li>Licensing: Microsoft Entra ID P1 for the admin who configures it and for members of the allowed group.</li>
<li>Alternatives: a request/approval process (Power Automate, Graph) that provisions teams from templates.</li>
<li><b>Org-wide teams</b> (all users auto-added) can only be created by Global admins, max 5 per tenant, organization ≤ 10,000 users.</li>
</ul>
<h3>3. Naming policy</h3>
<ul>
<li>Configured in <b>Entra admin center › Groups › Naming policy</b>. Two parts: <b>prefix/suffix</b> (fixed strings or user attributes such as <code>[Department]</code>, <code>[Company]</code>, <code>[Office]</code>, <code>[StateOrProvince]</code>, <code>[CountryOrRegion]</code>, <code>[Title]</code>) and <b>custom blocked words</b> (up to 5,000, case-insensitive, exact-word match).</li>
<li>Applies when groups are created in Teams, Outlook, SharePoint, Planner, etc. Certain admin roles are exempt. Requires Entra ID P1 for users who are group members.</li>
</ul>
<h3>4. Expiration policy</h3>
<ul>
<li>Entra admin center › Groups › Expiration: lifetime of 180, 365 days or custom (minimum 30 days); apply to <b>all</b>, <b>selected</b> or <b>no</b> Microsoft 365 groups; set a fallback email for ownerless groups.</li>
<li>Owners are emailed 30, 15 and 1 day before expiry. <b>Groups in active use are auto-renewed</b> (for example channel visits in Teams, SharePoint file activity, Outlook group activity).</li>
<li>Expired groups are soft-deleted and can be restored for <b>30 days</b>. Requires Entra ID P1.</li>
</ul>
<h3>5. Archive, delete, restore</h3>
<ul>
<li><b>Archive</b> (TAC › Manage teams, the client, Graph <code>POST /teams/{id}/archive</code>, or <code>Set-TeamArchivedState</code>): team becomes read-only; optionally make the SharePoint site read-only for members. Archived teams can be <b>unarchived</b> at any time.</li>
<li><b>Delete</b>: deletes the Microsoft 365 group, mailbox, site and OneNote; soft-deleted for <b>30 days</b>.</li>
<li><b>Restore</b>: Entra admin center (Groups › Deleted groups), Microsoft 365 admin center (Deleted groups), or <code>Restore-MgDirectoryDeletedItem</code>. The team can take up to 24 hours to reappear in Teams.</li>
<li>Deleted channels can be restored by team owners for 30 days (from Manage team › Channels).</li>
</ul>
<h3>6. Access reviews</h3>
<p>Microsoft Entra ID Governance access reviews periodically ask owners, selected reviewers or members themselves to confirm membership — ideal for <b>guest access to teams</b>. Results can be auto-applied to remove denied users. Requires Entra ID P2 / ID Governance.</p>
<h3>7. Where Teams stores content</h3>
<div class="tblwrap"><table class="tbl"><thead><tr><th>Content</th><th>Location</th></tr></thead><tbody>
<tr><td>1:1 and group chat messages</td><td>Hidden folder in each participant's Exchange mailbox (compliance copy)</td></tr>
<tr><td>Standard channel messages</td><td>Team's Microsoft 365 group mailbox</td></tr>
<tr><td>Private channel messages</td><td>Since the 2025–2026 migration: a dedicated channel mailbox linked to the team's group mailbox (previously members' mailboxes) <span class="nfe">NEW FOR EXAM</span></td></tr>
<tr><td>Shared channel messages</td><td>Channel mailbox linked to the parent team's group mailbox</td></tr>
<tr><td>Channel files</td><td>Team SharePoint site (each private/shared channel has its own site)</td></tr>
<tr><td>Chat files</td><td>Sender's OneDrive (Microsoft Teams Chat Files folder)</td></tr>
<tr><td>Meeting recordings/transcripts</td><td>Non-channel: organizer's OneDrive (Recordings folder); channel meetings: channel's SharePoint site</td></tr>
<tr><td>Voicemail, calendar</td><td>User's Exchange mailbox</td></tr>
<tr><td>Whiteboard / Loop in chat</td><td>Creator's OneDrive</td></tr>
</tbody></table></div>
<h3>8. Policy assignment at scale</h3>
<ul>
<li><b>Precedence</b>: direct (per-user) assignment › group assignment (lowest rank number wins) › org-wide default (Global).</li>
<li><b>Group policy assignment</b>: TAC policy page › Group policy assignment, or <code>Grant-Cs&lt;Policy&gt; -Group &lt;id&gt; -Rank n</code> / <code>New-CsGroupPolicyAssignment</code>. Membership changes are picked up automatically; propagation can take time (up to 24 hours or more for large groups).</li>
<li><b>Batch assignment</b>: <code>New-CsBatchPolicyAssignmentOperation</code> up to 5,000 users per batch; check status with <code>Get-CsBatchPolicyAssignmentOperation</code>.</li>
<li><b>Policy packages</b>: predefined bundles (e.g., Frontline worker, Frontline manager, Education teacher/student, Healthcare clinical worker, Public safety officer, Small/medium business user). Assigning a package creates <b>direct</b> assignments of each included policy. <b>Custom</b> policy packages require Teams Premium.</li>
<li><code>Get-CsUserPolicyAssignment -Identity user</code> shows the effective policy and whether it came directly or from a group.</li>
</ul>
<h3>9. Automation</h3>
<ul>
<li><b>Teams PowerShell</b>: <code>New-Team</code>, <code>Get-Team</code>, <code>Set-Team</code>, <code>Add-TeamUser</code>, <code>New-TeamChannel</code>, <code>Set-TeamArchivedState</code>, <code>Remove-Team</code>, policy cmdlets.</li>
<li><b>Microsoft Graph</b>: <code>POST /teams</code> (with a template), <code>PUT /groups/{id}/team</code>, <code>POST /teams/{id}/clone</code>, <code>POST /teams/{id}/archive</code>, <code>/teams/{id}/members</code>, <code>/teams/{id}/channels</code>.</li>
<li><b>Microsoft Graph PowerShell</b>: directory and group settings (creation restriction, per-group guest settings, sensitivity label enablement), deleted item restore.</li>
</ul>`},
{id:'concepts', h:'Important concepts', html:`
<dl class="kv">
<dt>Group.Unified directory setting</dt><dd>Tenant-wide Microsoft 365 group settings: creation restriction, guest usage, classification, sensitivity label enablement (<code>EnableMIPLabels</code>).</dd>
<dt>Soft delete</dt><dd>Deleted Microsoft 365 groups remain restorable for 30 days.</dd>
<dt>Auto-renewal</dt><dd>Active groups renew automatically under an expiration policy.</dd>
<dt>Archived team</dt><dd>Read-only conversations and (optionally) files; reversible.</dd>
<dt>Policy rank</dt><dd>Number that decides which group-assigned policy wins (1 = highest priority).</dd>
<dt>Policy package</dt><dd>Bundle of policies assigned together as direct assignments.</dd>
<dt>Access review</dt><dd>Recurring attestation of membership or access, with auto-apply.</dd>
<dt>Teamify</dt><dd>Add Teams to an existing Microsoft 365 group (<code>New-Team -GroupId</code> / <code>PUT /groups/{id}/team</code>).</dd>
</dl>`},
{id:'resp', h:'Administrator responsibilities', html:`
<ul>
<li>Decide creation model (open, restricted to a group, or request-based) with business stakeholders.</li>
<li>Configure naming, expiration and classification/labels; communicate them to users.</li>
<li>Define archiving and deletion standards; handle restore requests within 30 days.</li>
<li>Run access reviews for guests and sensitive teams.</li>
<li>Design policy assignment (packages, group assignment ranks, batch) and verify effective policies.</li>
<li>Automate repetitive lifecycle tasks with PowerShell/Graph and maintain scripts.</li>
<li>Understand where content lives to coordinate with compliance on retention and holds.</li>
</ul>`},
{id:'paths', h:'Admin center paths & PowerShell', html:`
<pre><code># Restrict Microsoft 365 group creation to one security group (Microsoft Graph PowerShell)
Connect-MgGraph -Scopes "Directory.ReadWrite.All","Group.Read.All"
$tpl = Get-MgBetaDirectorySettingTemplate | Where-Object DisplayName -eq "Group.Unified"
$setting = Get-MgBetaDirectorySetting | Where-Object DisplayName -eq "Group.Unified"
# (create from $tpl if $setting is null) then set:
#   EnableGroupCreation = "false"; GroupCreationAllowedGroupId = (Get-MgGroup -Filter "displayName eq 'Team-Creators'").Id

# Archive a team and make its site read-only for members
Set-TeamArchivedState -GroupId $gid -Archived:$true -SetSpoSiteReadOnlyForMembers:$true

# Restore a deleted team (Microsoft 365 group)
Get-MgDirectoryDeletedItemAsGroup | Select Id, DisplayName
Restore-MgDirectoryDeletedItem -DirectoryObjectId $deletedId

# Group policy assignment with rank, and batch assignment
Grant-CsTeamsMeetingPolicy -Group "sales@contoso.com" -PolicyName "Sales Meetings" -Rank 1
New-CsBatchPolicyAssignmentOperation -PolicyType TeamsMessagingPolicy -PolicyName "Restricted" -Identity $users -OperationName "Q4 batch"

# Policy packages
Grant-CsUserPolicyPackage -Identity user@contoso.com -PackageName "Frontline_Worker"
Get-CsUserPolicyAssignment -Identity user@contoso.com -PolicyType TeamsMeetingPolicy</code></pre>
<p>Portals: Entra admin center › Groups › Expiration / Naming policy / Deleted groups · TAC › Teams › Manage teams (archive/delete) · TAC › Policy packages · TAC › (policy) › Group policy assignment.</p>`},
{id:'scen', h:'Real-world scenarios', html:`
<div class="scen"><h4>3,000 abandoned teams</h4><div class="sol"><b>Solution:</b> Configure a 365-day expiration policy for all Microsoft 365 groups. Active teams renew automatically; owners of inactive teams receive renewal emails; expired teams can be restored for 30 days.</div></div>
<div class="scen"><h4>Consistent names</h4><p>Teams must start with the creator's department and must not contain “CEO” or “Payroll”.</p><div class="sol"><b>Solution:</b> Naming policy with prefix <code>[Department]</code> and custom blocked words.</div></div>
<div class="scen"><h4>Accidentally deleted project team</h4><div class="sol"><b>Solution:</b> Restore the Microsoft 365 group from Deleted groups within 30 days; channels, files and conversations return with it.</div></div>
<div class="scen"><h4>Different meeting policies for 4,000 sales users</h4><div class="sol"><b>Solution:</b> Assign the policy to the Sales security group (rank 1) so new hires inherit it; use direct assignment only for exceptions.</div></div>`},
{id:'bp', h:'Best practices', html:`
<ul>
<li>Prefer group-based policy assignment over per-user assignment; keep exceptions few and documented.</li>
<li>Keep at least two owners per team to avoid ownerless groups at renewal time.</li>
<li>Archive instead of delete when content must remain discoverable and readable.</li>
<li>Combine expiration with retention policies — expiration deletes the container; retention preserves required content.</li>
<li>Run quarterly access reviews for teams that contain guests.</li>
<li>Pilot naming policies; overly long prefixes frustrate users and break display names.</li>
</ul>`},
{id:'tips', h:'Exam tips', html:`
<ul>
<li>Naming/expiration/creation restriction live in <b>Entra</b>, not the Teams admin center.</li>
<li>30 days is the magic number for restoring deleted groups and channels.</li>
<li>Policy packages = <b>direct</b> assignments; they override group assignments.</li>
<li>Rank 1 is the highest priority in group assignment.</li>
<li>Access reviews need Entra ID P2 / Governance; naming/expiration need P1.</li>
<li>Archived ≠ deleted: archived teams are kept indefinitely and are read-only.</li>
</ul>`},
{id:'mistakes', h:'Common mistakes', html:`
<ul>
<li>Trying to restrict team creation with a Teams policy — it must be done at the Microsoft 365 group level.</li>
<li>Expecting expiration to delete active teams — activity auto-renews them.</li>
<li>Forgetting that deleting a team deletes its SharePoint site and group mailbox.</li>
<li>Assuming a group assignment applies when a user also has a direct assignment of the same policy type.</li>
<li>Using retention policies to “clean up” teams (they delete content, not containers).</li>
</ul>`},
{id:'asks', h:'Things Microsoft likes to ask on the exam', html:`
<ul class="asklist">
<li>How to allow only one group of users to create teams (and which license is needed).</li>
<li>Which policy automatically removes inactive teams, and what happens to active ones.</li>
<li>How to restore a deleted team, and within how many days.</li>
<li>Effective policy when a user has a direct and two group assignments with ranks.</li>
<li>Which actions (sequence) archive a team and lock its site.</li>
<li>Where chat messages, channel messages, files and recordings are stored.</li>
<li>When to use access reviews vs expiration policies.</li>
</ul>`},

],
